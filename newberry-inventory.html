<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newberry House — Science Inventory Manager</title>
<link rel="icon" type="image/webp" href="newberry-lab-logo.webp">
<link rel="apple-touch-icon" href="newberry-lab-logo.webp">
<style>
/* ============================================================
   NEWBERRY HOUSE SCIENCE INVENTORY MANAGER
   ============================================================ */

:root{
  --pakistan-green:#1f3d1d;
  --asparagus:#7da24b;
  --field-drab:#775d2f;
  --dun:#d1c7a3;
  --ivory:#fffdee;
  --platinum:#e0e1de;

  --bg:#f5f4ee;
  --bg-elevated:#ffffff;
  --bg-sunken:#ecece3;
  --surface-border:#d8d6c9;
  --text-primary:#1c2418;
  --text-secondary:#5a5c4f;
  --text-muted:#8a8c7c;
  --accent:var(--asparagus);
  --accent-strong:var(--pakistan-green);
  --header-grad-start:var(--pakistan-green);
  --header-grad-end:var(--asparagus);

  --danger:#a3402e;
  --danger-bg:#fbe9e4;
  --warn:#9a7415;
  --warn-bg:#fbf1d8;
  --ok:#3f7d3a;
  --ok-bg:#e8f3e3;

  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:14px;

  --shadow-sm:0 1px 2px rgba(20,30,15,0.06);
  --shadow-md:0 4px 14px rgba(20,30,15,0.08);
  --shadow-lg:0 10px 30px rgba(20,30,15,0.14);

  --font-head:'Trebuchet MS','Trebuchet','Lucida Grande',sans-serif;
  --font-body:'Noto Sans','Segoe UI',Arial,sans-serif;

  --focus-ring:0 0 0 3px rgba(125,162,75,0.45);
  --glow-accent:rgba(125,162,75,0.22);

  --card-eq:#2e5c1a;
  --card-chem:#1a3d5c;
  --card-warn:#5c3a0a;
  --card-alert:#5c1a1a;
}

[data-theme="dark"]{
  --bg:#0d1109;
  --bg-elevated:#141c10;
  --bg-sunken:#090d07;
  --surface-border:#263020;
  --text-primary:#eef1e6;
  --text-secondary:#b7bda8;
  --text-muted:#717a62;
  --accent:#93c25f;
  --accent-strong:#9fd368;
  --header-grad-start:#091208;
  --header-grad-end:#2e4d1c;

  --danger:#e2796a;
  --danger-bg:#2e1814;
  --warn:#e3b94f;
  --warn-bg:#2e2610;
  --ok:#7fd073;
  --ok-bg:#0f2a13;

  --shadow-sm:0 1px 3px rgba(0,0,0,0.4);
  --shadow-md:0 4px 18px rgba(0,0,0,0.5);
  --shadow-lg:0 12px 36px rgba(0,0,0,0.65);

  --focus-ring:0 0 0 3px rgba(147,194,95,0.5);
  --glow-accent:rgba(147,194,95,0.28);

  --card-eq:#163310;
  --card-chem:#0e2438;
  --card-warn:#38260a;
  --card-alert:#381010;
}

*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text-primary);
  line-height:1.5;
  transition:background .25s ease,color .25s ease;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-head);font-weight:700;margin:0;}
button{font-family:var(--font-body);}
input,select,textarea{font-family:var(--font-body);}
:focus-visible{outline:none;box-shadow:var(--focus-ring);border-radius:4px;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important;}}

a{color:var(--accent-strong);}
[data-theme="dark"] a{color:var(--accent);}

/* ============== LAYOUT SHELL ============== */
.app{min-height:100vh;display:flex;flex-direction:column;}

/* ============== TOP HEADER ============== */
header.topbar{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(160deg,var(--header-grad-start) 0%,var(--header-grad-end) 100%);
  color:var(--ivory);
  box-shadow:var(--shadow-md);
  border-bottom:1px solid rgba(255,253,238,0.08);
}
.topbar-inner{
  max-width:1400px;margin:0 auto;
  display:flex;align-items:center;gap:14px;
  padding:13px 20px;
}
.brand-mark{
  width:44px;height:44px;flex:0 0 auto;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,0.25);
}
.brand-logo{
  width:100%;height:100%;
  object-fit:cover;
  display:block;
}
.brand-text{flex:1;min-width:0;}
.brand-text h1{font-size:18px;letter-spacing:-.1px;color:var(--ivory);}
.brand-text .subtitle{font-size:12px;color:rgba(255,253,238,0.72);margin-top:1px;}

.topbar-actions{display:flex;align-items:center;gap:8px;}
.icon-btn{
  width:36px;height:36px;border-radius:9px;
  border:1px solid rgba(255,253,238,0.22);
  background:rgba(255,253,238,0.07);
  color:var(--ivory);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .15s ease,transform .1s ease,border-color .15s ease;
}
.icon-btn:hover{background:rgba(255,253,238,0.18);border-color:rgba(255,253,238,0.4);}
.icon-btn:active{transform:scale(0.93);}
.icon-btn svg{width:17px;height:17px;}

/* ============== STICKY SEARCH ============== */
.search-bar-wrap{
  position:sticky;top:72px;z-index:40;
  background:var(--bg);
  border-bottom:1px solid var(--surface-border);
  padding:10px 20px;
}
@media (max-width:640px){.search-bar-wrap{top:64px;}}
.search-bar-inner{max-width:1400px;margin:0 auto;display:flex;gap:10px;align-items:center;}
.search-field{
  flex:1;position:relative;display:flex;align-items:center;
}
.search-field svg{position:absolute;left:12px;width:16px;height:16px;color:var(--text-muted);pointer-events:none;}
.search-field input{
  width:100%;
  padding:10px 36px 10px 36px;
  border-radius:var(--radius-md);
  border:1px solid var(--surface-border);
  background:var(--bg-elevated);
  color:var(--text-primary);
  font-size:14px;
  transition:border-color .2s ease,box-shadow .2s ease;
}
.search-field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow-accent);}
.search-field input::placeholder{color:var(--text-muted);}
.search-clear{
  position:absolute;right:10px;width:20px;height:20px;
  border:none;background:none;cursor:pointer;
  color:var(--text-muted);display:flex;align-items:center;justify-content:center;
  border-radius:4px;
}
.search-clear:hover{color:var(--text-primary);}
.search-clear svg{width:14px;height:14px;}
.search-results-count{font-size:12.5px;color:var(--text-muted);white-space:nowrap;}

/* ============== MAIN CONTENT ============== */
main{flex:1;max-width:1400px;width:100%;margin:0 auto;padding:18px 20px 60px;}

/* ============== DASHBOARD CARDS ============== */
.dashboard{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(175px,1fr));
  gap:12px;
  margin-bottom:24px;
}
.dash-card{
  background:var(--bg-elevated);
  border:1px solid var(--surface-border);
  border-radius:var(--radius-lg);
  padding:16px 16px 14px;
  box-shadow:var(--shadow-sm);
  position:relative;
  overflow:hidden;
}
.dash-card::before{
  content:"";
  position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--surface-border);
  border-radius:var(--radius-lg) var(--radius-lg) 0 0;
  transition:background .2s ease;
}
.dash-card-clickable{
  cursor:pointer;
  transition:border-color .18s ease,transform .12s ease,box-shadow .18s ease;
}
.dash-card-clickable:hover{
  border-color:var(--accent);
  box-shadow:var(--shadow-md),0 0 0 1px var(--glow-accent);
  transform:translateY(-3px);
}
.dash-card-clickable:hover::before{background:var(--accent);}
.dash-card-clickable:active{transform:translateY(0) scale(0.985);box-shadow:var(--shadow-sm);}
.dash-card .dash-label{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--text-muted);font-weight:700;}
.dash-card .dash-value{font-family:var(--font-head);font-size:32px;margin-top:7px;color:var(--text-primary);line-height:1;}
.dash-card.alert .dash-value{color:var(--danger);}
.dash-card.alert::before{background:var(--danger);}
.dash-card.warn .dash-value{color:var(--warn);}
.dash-card.warn::before{background:var(--warn);}
.dash-card .dash-sub{font-size:11.5px;color:var(--text-muted);margin-top:5px;}
.dash-card .dash-icon{
  position:absolute;right:14px;top:16px;
  opacity:.1;
  width:34px;height:34px;
}

/* ============== SECTION (collapsible) ============== */
.section{
  background:var(--bg-elevated);
  border:1px solid var(--surface-border);
  border-radius:var(--radius-lg);
  margin-bottom:16px;
  overflow:hidden;
  box-shadow:var(--shadow-sm);
}
.section-header{
  display:flex;align-items:center;gap:12px;
  padding:16px 18px;
  cursor:pointer;
  user-select:none;
  background:var(--bg-elevated);
}
.section-header:hover{background:var(--bg-sunken);}
.section-header .chevron{
  width:20px;height:20px;flex:0 0 auto;
  color:var(--text-secondary);
  transition:transform .2s ease;
}
.section.collapsed .chevron{transform:rotate(-90deg);}
.section-header h2{font-size:16.5px;color:var(--text-primary);}
.section-header .section-meta{font-size:12px;color:var(--text-muted);margin-left:auto;margin-right:6px;white-space:nowrap;}
.section-body{
  border-top:1px solid var(--surface-border);
  padding:16px 18px 20px;
  max-height:8000px;
  overflow:hidden;
  opacity:1;
  transition:max-height .35s ease,opacity .2s ease,padding .3s ease,border-color .3s ease;
}
.section.collapsed .section-body{max-height:0;opacity:0;padding-top:0;padding-bottom:0;border-color:transparent;pointer-events:none;}
.section-icon{width:18px;height:18px;color:var(--accent-strong);flex:0 0 auto;}
[data-theme="dark"] .section-icon{color:var(--accent);}

.subsection{
  border:1px solid var(--surface-border);
  border-radius:var(--radius-md);
  margin-bottom:10px;
  overflow:hidden;
}
.subsection-header{
  display:flex;align-items:center;gap:10px;
  padding:11px 14px;cursor:pointer;user-select:none;
  background:var(--bg-sunken);
}
.subsection-header h3{font-size:14px;color:var(--text-primary);}
.subsection-header .chevron{width:16px;height:16px;color:var(--text-secondary);transition:transform .2s ease;}
.subsection.collapsed .chevron{transform:rotate(-90deg);}
.subsection-body{
  padding:14px;border-top:1px solid var(--surface-border);
  max-height:4000px;overflow:hidden;opacity:1;
  transition:max-height .3s ease,opacity .18s ease,padding .25s ease,border-color .25s ease;
}
.subsection.collapsed .subsection-body{max-height:0;opacity:0;padding-top:0;padding-bottom:0;border-color:transparent;pointer-events:none;}
.subsection-header .subsection-meta{margin-left:auto;font-size:11.5px;color:var(--text-muted);}

/* ============== BUTTONS ============== */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 14px;
  border-radius:var(--radius-sm);
  border:1px solid var(--surface-border);
  background:var(--bg-elevated);
  color:var(--text-primary);
  font-size:13.5px;font-weight:600;
  cursor:pointer;
  transition:background .15s ease,border-color .15s ease,transform .1s ease;
  white-space:nowrap;
}
.btn svg{width:15px;height:15px;}
.btn:hover{background:var(--bg-sunken);box-shadow:var(--shadow-sm);}
.btn:active{transform:scale(0.97);box-shadow:none;}
.btn-primary{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--ivory);}
.btn-primary:hover{background:var(--header-grad-end);box-shadow:0 2px 10px var(--glow-accent);}
.btn-danger{color:var(--danger);border-color:var(--danger);background:transparent;}
.btn-danger:hover{background:var(--danger-bg);box-shadow:0 2px 8px rgba(163,64,46,0.15);}
.btn-sm{padding:6px 10px;font-size:12.5px;}
.btn-icon-only{padding:7px;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}

/* ============== TABLES ============== */
.table-scroll{overflow-x:auto;border-radius:var(--radius-md);border:1px solid var(--surface-border);}
table.inv-table{width:100%;border-collapse:collapse;font-size:13.5px;}
table.inv-table.editable-table{table-layout:fixed;min-width:1100px;}
table.inv-table:not(.editable-table){min-width:600px;}
table.inv-table thead th{
  position:sticky;top:0;
  background:var(--bg-sunken);
  text-align:left;
  font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;
  color:var(--text-secondary);
  padding:10px 10px;
  border-bottom:1px solid var(--surface-border);
  white-space:nowrap;
}
table.inv-table.editable-table th:nth-child(2),table.inv-table.editable-table td:nth-child(2){width:170px;}
table.inv-table.editable-table th:last-child,table.inv-table.editable-table td:last-child{width:40px;}
table.inv-table tbody td{
  padding:7px 10px;
  border-bottom:1px solid var(--surface-border);
  color:var(--text-primary);
  vertical-align:middle;
  overflow:hidden;text-overflow:ellipsis;
}
table.inv-table tbody tr:last-child td{border-bottom:none;}
table.inv-table tbody tr{transition:background .12s ease;}
table.inv-table tbody tr:hover{background:var(--bg-sunken);}
table.inv-table tbody tr.row-shortage{background:var(--danger-bg);}
table.inv-table tbody tr.row-shortage:hover{background:var(--danger-bg);filter:brightness(0.97);}
table.inv-table tbody tr.row-expired{background:var(--warn-bg);}
table.inv-table tbody tr.row-expiring-soon{background:rgba(154,116,21,0.08);}
table.inv-table tbody tr.row-damaged{background:var(--warn-bg);}

.cell-edit{
  border:1px solid transparent;
  background:transparent;
  color:inherit;
  font-size:13.5px;
  padding:5px 7px;
  border-radius:6px;
  width:100%;
  min-width:90px;
  text-overflow:ellipsis;
  transition:border-color .15s ease,background .15s ease,box-shadow .15s ease;
}
.cell-edit:hover{border-color:var(--surface-border);}
.cell-edit:focus{border-color:var(--accent);background:var(--bg-elevated);box-shadow:0 0 0 2px var(--glow-accent);}
select.cell-edit{cursor:pointer;}
input.cell-edit[type="number"]{width:64px;min-width:54px;text-align:center;}
input.cell-edit[type="date"]{min-width:130px;}

.qty-stepper{display:flex;align-items:center;gap:4px;}
.qty-stepper button{
  width:26px;height:26px;border-radius:6px;
  border:1px solid var(--surface-border);
  background:var(--bg-elevated);color:var(--text-primary);
  cursor:pointer;font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .12s ease,color .12s ease,background .12s ease,transform .1s ease;
}
.qty-stepper button:hover{background:var(--bg-sunken);border-color:var(--accent);color:var(--accent);}
.qty-stepper button:active{transform:scale(0.9);}
.qty-stepper input{width:48px;text-align:center;}

.badge{
  display:inline-block;padding:3px 9px;border-radius:99px;
  font-size:11.5px;font-weight:600;white-space:nowrap;
}
.badge-low{background:var(--ok-bg);color:var(--ok);}
.badge-moderate{background:var(--warn-bg);color:var(--warn);}
.badge-high{background:var(--danger-bg);color:var(--danger);}
.badge-controlled{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger);}
.badge-excellent{background:var(--ok-bg);color:var(--ok);}
.badge-good{background:var(--ok-bg);color:var(--ok);}
.badge-fair{background:var(--warn-bg);color:var(--warn);}
.badge-repair{background:var(--danger-bg);color:var(--danger);}
.badge-replace{background:var(--danger-bg);color:var(--danger);}
.badge-soon{background:var(--warn-bg);color:var(--warn);}
.badge-shortage{background:var(--danger-bg);color:var(--danger);}

.plan-items{margin-top:10px;}
.plan-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--surface-border);font-size:13px;}
.plan-item:last-child{border-bottom:none;}
.plan-item-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-primary);}
.plan-item-qty{width:50px;text-align:center;font-weight:600;color:var(--text-secondary);}
.plan-item-stock{font-size:12px;min-width:80px;text-align:right;}
.plan-item-stock.ok{color:var(--ok);}
.plan-item-stock.low{color:var(--danger);font-weight:600;}
.plan-item-remove{width:22px;height:22px;border-radius:5px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;}
.plan-item-remove:hover{background:var(--danger-bg);color:var(--danger);}
.plan-add-row{display:flex;gap:6px;margin-top:8px;align-items:center;}
.plan-add-row select,.plan-add-row input{font-size:12.5px;padding:5px 8px;border:1px solid var(--surface-border);border-radius:var(--radius-sm);background:var(--bg-elevated);color:var(--text-primary);}
.plan-add-row select{flex:1;min-width:0;}
.plan-add-row input[type="number"]{width:60px;text-align:center;}
.plan-add-btn{font-size:12px;padding:5px 10px;border-radius:var(--radius-sm);border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;font-weight:600;white-space:nowrap;}
.plan-add-btn:hover{background:var(--accent);color:var(--ivory);}
.plan-summary{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap;}
.plan-stat{font-size:12px;color:var(--text-secondary);}
.plan-stat strong{font-weight:700;}
.plan-stat.has-shortage strong{color:var(--danger);}

td .del-row-btn{
  width:26px;height:26px;border-radius:6px;border:1px solid var(--surface-border);
  background:transparent;color:var(--text-muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s ease;
}
td .del-row-btn:hover{background:var(--danger-bg);color:var(--danger);border-color:var(--danger);box-shadow:0 0 0 3px rgba(163,64,46,0.12);}
td .del-row-btn:active{transform:scale(0.88);}
td .del-row-btn svg{width:14px;height:14px;}

/* ============== FORMS / SETTINGS ============== */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:12.5px;font-weight:600;color:var(--text-secondary);}
.field input,.field select,.field textarea{
  padding:9px 11px;border-radius:var(--radius-sm);
  border:1px solid var(--surface-border);
  background:var(--bg-elevated);color:var(--text-primary);
  font-size:14px;
}
.field textarea{resize:vertical;min-height:70px;}
.help-text{font-size:12px;color:var(--text-muted);}

/* ============== CHECKLIST (section 3) ============== */
.checklist-row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13.5px;}
.checklist-row input[type="checkbox"]{width:18px;height:18px;accent-color:var(--accent-strong);cursor:pointer;}
.checklist-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:4px 18px;margin-bottom:10px;}
.notes-area{width:100%;min-height:70px;padding:10px;border-radius:var(--radius-sm);border:1px solid var(--surface-border);background:var(--bg-elevated);color:var(--text-primary);font-size:13.5px;resize:vertical;}

/* practical category delete btn */
.pc-delete-btn{
  margin-left:auto;padding:4px 8px;border-radius:var(--radius-sm);
  border:1px solid transparent;background:none;
  color:var(--text-muted);font-size:12px;cursor:pointer;
}
.pc-delete-btn:hover{color:var(--danger);border-color:var(--danger);background:var(--danger-bg);}

/* ============== STOCKTAKE MODE ============== */
.stocktake-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.stocktake-list{display:flex;flex-direction:column;gap:8px;}
.stocktake-item{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px 14px;border:1px solid var(--surface-border);border-radius:var(--radius-md);
  background:var(--bg-elevated);
}
.stocktake-item .st-name{font-weight:600;font-size:14px;flex:1;min-width:140px;}
.stocktake-item .st-loc{font-size:12px;color:var(--text-muted);}
.stocktake-item.row-shortage{background:var(--danger-bg);border-color:var(--danger);}
.stocktake-item.row-expiring-soon{background:rgba(154,116,21,0.08);border-color:var(--warn);}
.filter-chip{
  padding:6px 12px;border-radius:99px;border:1px solid var(--surface-border);
  background:var(--bg-elevated);color:var(--text-secondary);font-size:12.5px;font-weight:600;cursor:pointer;
  transition:all .18s ease;
}
.filter-chip:hover:not(.active){border-color:var(--accent);color:var(--text-primary);}
.filter-chip.active{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--ivory);box-shadow:0 1px 6px var(--glow-accent);}
.filter-chip:active{transform:scale(0.96);}

/* ============== EMPTY STATE ============== */
.empty-state{padding:34px 20px;text-align:center;color:var(--text-muted);}
.empty-state svg{width:34px;height:34px;margin-bottom:10px;color:var(--text-muted);}
.empty-state .empty-title{font-weight:600;color:var(--text-secondary);margin-bottom:4px;font-size:14px;}
.empty-state .empty-sub{font-size:12.5px;}

/* ============== TOAST ============== */
#toast-wrap{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{
  background:var(--text-primary);color:var(--bg);
  padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;
  box-shadow:var(--shadow-lg);
  opacity:0;transform:translateY(8px);
  animation:toast-in .35s cubic-bezier(.22,.61,.36,1) forwards, toast-out .25s ease 2.6s forwards;
}
[data-theme="dark"] .toast{background:var(--accent-strong);color:#0c1009;}
@keyframes toast-in{
  0%{opacity:0;transform:translateY(18px) scale(0.92);}
  55%{opacity:1;transform:translateY(-3px) scale(1.02);}
  100%{opacity:1;transform:translateY(0) scale(1);}
}
@keyframes toast-out{to{opacity:0;transform:translateY(10px) scale(0.95);}}

/* ============== REPORTS ============== */
.report-block{margin-bottom:20px;}
.report-block h3{font-size:14.5px;margin-bottom:8px;color:var(--text-primary);}
.report-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.report-stat{background:var(--bg-sunken);border-radius:var(--radius-sm);padding:12px;}
.report-stat .rs-val{font-family:var(--font-head);font-size:22px;}
.report-stat .rs-label{font-size:11.5px;color:var(--text-muted);}

/* ============== PRINT ============== */
@media print{
  header.topbar,.search-bar-wrap,.btn-row,.section-header .chevron,
  .icon-btn,.qty-stepper button,.del-row-btn,#toast-wrap,.global-tabs,
  .no-print,.subsection-header .chevron,.pc-delete-btn{display:none!important;}
  body,body[data-theme="dark"]{
    --bg:#ffffff;--bg-elevated:#ffffff;--bg-sunken:#f1f1ea;
    --surface-border:#bbb;--text-primary:#000;--text-secondary:#333;--text-muted:#555;
    --accent-strong:#1f3d1d;--accent:#1f3d1d;
    --danger-bg:#fbe9e4;--warn-bg:#fbf1d8;--ok-bg:#e8f3e3;
    background:#fff;color:#000;
  }
  .section{box-shadow:none;border:1px solid #999;break-inside:avoid;}
  .subsection{break-inside:avoid;}
  .section-body{display:block!important;}
  .section.collapsed .section-body{display:block!important;}
  .subsection-body{display:block!important;}
  .subsection.collapsed .subsection-body{display:block!important;}
  .dash-card{break-inside:avoid;}
  table.inv-table tbody tr{break-inside:avoid;}
  .cell-edit{border:none!important;background:transparent!important;}
}

/* ============== TABS ============== */
.global-tabs{
  display:flex;gap:2px;overflow-x:auto;margin-bottom:20px;
  border-bottom:1px solid var(--surface-border);
  padding-bottom:0;
  scrollbar-width:none;
}
.global-tabs::-webkit-scrollbar{display:none;}
.global-tab{
  padding:10px 15px;font-size:13px;font-weight:600;
  color:var(--text-muted);background:transparent;border:none;
  border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap;
  transition:color .15s ease,border-color .15s ease,background .15s ease;
  letter-spacing:.1px;
  border-radius:var(--radius-sm) var(--radius-sm) 0 0;
}
.global-tab:hover{color:var(--text-primary);background:rgba(125,162,75,0.06);}
.global-tab.active{color:var(--accent-strong);border-bottom-color:var(--accent-strong);background:rgba(125,162,75,0.08);}
[data-theme="dark"] .global-tab.active{color:var(--accent);border-bottom-color:var(--accent);background:rgba(147,194,95,0.08);}
.tab-panel{display:none;}
.tab-panel.active{display:block;animation:tab-fade-in .28s cubic-bezier(.22,.61,.36,1);}
@keyframes tab-fade-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ============== PROGRESS BAR ============== */
.stock-bar-wrap{display:flex;align-items:center;gap:8px;min-width:120px;}
.stock-bar{flex:1;height:5px;border-radius:99px;background:var(--surface-border);overflow:hidden;}
.stock-bar-fill{height:100%;border-radius:99px;transition:width .3s ease;}
.stock-bar-fill.ok{background:var(--ok);}
.stock-bar-fill.warn{background:var(--warn);}
.stock-bar-fill.danger{background:var(--danger);}
.stock-bar-pct{font-size:11.5px;color:var(--text-muted);width:32px;text-align:right;}

/* ============== HAZARD BADGE (inline) ============== */
.hazard-pill{
  display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0;
}
.hazard-low{background:var(--ok);}
.hazard-moderate{background:var(--warn);}
.hazard-high{background:var(--danger);}
.hazard-controlled{background:var(--danger);box-shadow:0 0 0 2px var(--danger-bg);}

/* ============== MINI CHART (reports) ============== */
.mini-chart{display:flex;align-items:flex-end;gap:5px;height:52px;margin-top:10px;}
.mini-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.mini-bar{width:100%;border-radius:4px 4px 0 0;min-height:3px;background:var(--accent);transition:height .4s ease;opacity:.85;}
.mini-bar.danger{background:var(--danger);}
.mini-bar.warn{background:var(--warn);}
.mini-bar-label{font-size:10px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:center;}
.mini-bar-val{font-size:11px;font-weight:700;color:var(--text-secondary);}

/* ============== SECTION ENHANCEMENTS ============== */
.section{transition:box-shadow .15s ease;}
.section:hover{box-shadow:var(--shadow-md);}

/* ============== UTILITY ============== */
.flex-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.text-muted{color:var(--text-muted);}
.mt-0{margin-top:0;}
.mb-0{margin-bottom:0;}
.hidden{display:none!important;}
.small-note{font-size:12px;color:var(--text-muted);margin-top:10px;padding:8px 10px;background:var(--bg-sunken);border-radius:var(--radius-sm);border-left:3px solid var(--surface-border);}
.expiry-warn{color:var(--warn);font-size:12px;margin-left:4px;}

/* ============== SORT HEADERS ============== */
.sortable-th{cursor:pointer;user-select:none;position:relative;padding-right:22px!important;transition:background .12s ease;}
.sortable-th:hover{color:var(--text-primary);background:rgba(125,162,75,0.08);}
.sort-arrow{position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--text-muted);opacity:0;transition:opacity .15s ease;}
.sortable-th:hover .sort-arrow{opacity:.5;}
.sortable-th.sort-active .sort-arrow{opacity:1;color:var(--accent-strong);}
[data-theme="dark"] .sortable-th.sort-active .sort-arrow{color:var(--accent);}

/* ============== TAB BADGES ============== */
.tab-badge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:18px;height:18px;padding:0 5px;
  border-radius:99px;font-size:10.5px;font-weight:700;
  margin-left:5px;line-height:1;vertical-align:middle;
}
.tab-badge-warn{background:var(--warn-bg);color:var(--warn);}
.tab-badge-danger{background:var(--danger-bg);color:var(--danger);}

/* ============== FILTER SELECT ============== */
.filter-select{
  padding:7px 10px;border-radius:var(--radius-sm);
  border:1px solid var(--surface-border);
  background:var(--bg-elevated);color:var(--text-primary);
  font-size:12.5px;font-weight:600;cursor:pointer;
}

/* ============== UNDO TOAST ============== */
.toast-with-action{
  display:flex;align-items:center;gap:12px;
  animation:toast-in .35s cubic-bezier(.22,.61,.36,1) forwards, toast-out .25s ease 4.8s forwards;
}
.toast-undo-btn{
  background:none;border:1px solid currentColor;
  color:inherit;padding:3px 10px;border-radius:99px;
  font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;
}
.toast-undo-btn:hover{opacity:.8;}

/* ============== DRAG REORDER ============== */
.drag-col{width:28px!important;min-width:28px;padding:0 2px!important;text-align:center;}
.drag-handle{cursor:grab;color:var(--text-muted);font-size:14px;user-select:none;line-height:1;}
.drag-handle:hover{color:var(--text-primary);}
.drag-handle:active{cursor:grabbing;}
tr.dragging{opacity:.35;}
tr.drag-over td{box-shadow:inset 0 2px 0 var(--accent);}

/* ============== EXPIRY CALENDAR ============== */
.calendar-nav{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.calendar-nav h3{flex:1;text-align:center;font-size:15px;margin:0;}
.calendar-grid{
  display:grid;grid-template-columns:repeat(7,1fr);gap:1px;
  border:1px solid var(--surface-border);border-radius:var(--radius-md);
  overflow:hidden;background:var(--surface-border);
}
.calendar-day-header{
  background:var(--bg-sunken);padding:6px 4px;text-align:center;
  font-size:10.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;
}
.calendar-day{
  background:var(--bg-elevated);padding:6px;min-height:56px;font-size:12px;position:relative;
}
.calendar-day.empty{background:var(--bg-sunken);opacity:.4;}
.calendar-day.today{box-shadow:inset 0 0 0 2px var(--accent);}
.calendar-day .day-num{font-weight:700;font-size:11.5px;color:var(--text-secondary);margin-bottom:2px;}
.calendar-day-items{display:flex;flex-direction:column;gap:1px;}
.calendar-item{
  font-size:9.5px;padding:1px 3px;border-radius:3px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.calendar-item.expired{background:var(--danger-bg,rgba(239,68,68,.15));color:var(--danger);}
.calendar-item.expiring{background:var(--warn-bg,rgba(234,179,8,.15));color:var(--warn);}
.calendar-item.ok{background:var(--ok-bg,rgba(34,197,94,.15));color:var(--ok);}

/* ============== STOCKTAKE PREMIUM ============== */
.stocktake-item{transition:box-shadow .15s ease,border-color .15s ease;}
.stocktake-item:hover{box-shadow:var(--shadow-md);}

@media (max-width:640px){
  .brand-text h1{font-size:16px;}
  .brand-text .subtitle{font-size:11px;}
  .section-header h2{font-size:15px;}
  main{padding:14px 12px 50px;}
  .dashboard{grid-template-columns:repeat(2,1fr);}
}

/* ============== SCROLLBAR ============== */
::-webkit-scrollbar{width:7px;height:7px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--surface-border);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted);}
*{scrollbar-width:thin;scrollbar-color:var(--surface-border) transparent;}

/* ============== FORM FOCUS ============== */
.field input:focus,.field select:focus,.field textarea:focus,.notes-area:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px var(--glow-accent);
  outline:none;
}
.field input,.field select,.field textarea,.notes-area{
  transition:border-color .15s ease,box-shadow .15s ease;
}
.filter-select{transition:border-color .15s ease,box-shadow .15s ease;}
.filter-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow-accent);outline:none;}

/* ============== CALENDAR HOVER ============== */
.calendar-day:not(.empty){transition:background .12s ease;}
.calendar-day:not(.empty):hover{background:var(--bg-sunken);}

/* ============== STOCKTAKE INTERACTION ============== */
.stocktake-item{transition:box-shadow .15s ease,border-color .15s ease,transform .12s ease;}
.stocktake-item:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.stocktake-item:active{transform:translateY(0);}

/* ============== SECTION HEADER ============== */
.section-header{transition:background .12s ease;}
.subsection-header{transition:background .12s ease;}
.subsection-header:hover{background:rgba(125,162,75,0.06);}

/* ============== DRAG HANDLE TRANSITIONS ============== */
.drag-handle{transition:color .12s ease,transform .1s ease;}
.drag-handle:hover{transform:scale(1.15);}

/* ============== SORT HEADER ACTIVE ============== */
.sortable-th.sort-active{background:rgba(125,162,75,0.05);}

/* ============== REPORT STAT HOVER ============== */
.report-stat{transition:box-shadow .15s ease,transform .12s ease;}
.report-stat:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px);}

/* ============== BADGE HOVER ============== */
.badge{transition:transform .1s ease;}

/* ============== ICON BTN PULSE ============== */
.icon-btn{transition:background .15s ease,transform .12s ease,border-color .15s ease,box-shadow .15s ease;}
.icon-btn:hover{box-shadow:0 0 10px rgba(255,253,238,0.12);}

/* ============== PROGRESS BAR ============== */
.stock-bar{transition:background .15s ease;}
.stock-bar-fill{transition:width .4s cubic-bezier(.22,.61,.36,1);}

/* ============== TOAST SLIDE-UP ON HOVER ============== */
.toast{transition:transform .15s ease;cursor:default;}
.toast:hover{transform:translateY(-2px);}

/* ============== TABLE SCROLL SHADOW ============== */
.table-scroll{
  position:relative;
  background:
    linear-gradient(to right, var(--bg-elevated) 20px, transparent 60px),
    linear-gradient(to left, var(--bg-elevated) 20px, transparent 60px);
  background-size:100% 100%;
  background-attachment:local;
}

/* ============== CHECKLIST HOVER ============== */
.checklist-row{transition:background .1s ease;border-radius:var(--radius-sm);padding-left:6px;padding-right:6px;}
.checklist-row:hover{background:var(--bg-sunken);}

/* ============== PRINT OVERRIDE ============== */
@media print{
  .section-body{max-height:none!important;opacity:1!important;padding:16px 18px 20px!important;border-color:var(--surface-border)!important;pointer-events:auto!important;}
  .subsection-body{max-height:none!important;opacity:1!important;padding:14px!important;border-color:var(--surface-border)!important;pointer-events:auto!important;}
}

function mergeDefaults(parsed){
  const def = defaultState();
  if(!parsed.equipmentCategories || !parsed.equipmentCategories.length) parsed.equipmentCategories = def.equipmentCategories;
  if(!parsed.practical) parsed.practical = def.practical;
  if(!parsed.settings) parsed.settings = def.settings;
  else parsed.settings = Object.assign({}, def.settings, parsed.settings);
  if(!parsed.lastUpdated) parsed.lastUpdated = def.lastUpdated;
  return parsed;
}
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && parsed.equipment && parsed.chemicals) return mergeDefaults(parsed);
    }
  }catch(e){ console.warn("Could not parse saved inventory, using defaults.",e); }
  return defaultState();
}

function showToast(msg, action){
  const wrap = document.getElementById("toast-wrap");
  const el = document.createElement("div");
  el.className = "toast" + (action ? " toast-with-action" : "");
  if(action){
    const span = document.createElement("span");

}

/* ================================================================
   HELPERS
   ================================================================ */
function escapeHtml(str){
  return String(str==null?"":str).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function conditionBadge(condition){
  const cls = "badge badge-"+String(condition||"").toLowerCase().replace(/[^a-z]/g,"");
  return `<span class="${cls}">${escapeHtml(condition)}</span>`;
}
function hazardBadge(hazard){
  const key = String(hazard||"").toLowerCase().replace(/[^a-z]/g,"");
  return `<span class="hazard-pill hazard-${key}" title="${escapeHtml(hazard)}"></span>`;
}
function stockBar(cur, req){
  const pct = req>0 ? Math.min(100, Math.round((cur/req)*100)) : 100;
  const cls = pct>=100?"ok":pct>=50?"warn":"danger";
  return `<div class="stock-bar-wrap">
    <div class="stock-bar"><div class="stock-bar-fill ${cls}" style="width:${pct}%"></div></div>
    <span class="stock-bar-pct">${pct}%</span>
  </div>`;
}
function isExpiringOrExpired(dateStr){
  if(!dateStr) return {expired:false,soon:false};
  const d = new Date(dateStr);
  if(isNaN(d)) return {expired:false,soon:false};
  const now = new Date();
  const diffDays = (d-now)/(1000*60*60*24);
  return { expired: diffDays<0, soon: diffDays>=0 && diffDays<=60 };
}
function fmtDate(dateStr){
  if(!dateStr) return "—";
  try{
    const d = new Date(dateStr);
    if(isNaN(d)) return dateStr;
    return d.toLocaleDateString(undefined,{day:"2-digit",month:"short",year:"numeric"});
  }catch(e){return dateStr;}
}
function fmtDateTime(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleString(undefined,{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
  }catch(e){return iso;}
}
function matchesSearch(haystackArr, q){
  if(!q) return true;
  q = q.toLowerCase();
  return haystackArr.some(v=>String(v||"").toLowerCase().includes(q));
}
function emptyState(title,sub){
  return `<div class="empty-state">${ICON.inbox}<div class="empty-title">${escapeHtml(title)}</div><div class="empty-sub">${escapeHtml(sub||"")}</div></div>`;
}

function sortRows(rows, col, dir){
  if(!col) return rows;
  const mult = dir==="desc" ? -1 : 1;
  return [...rows].sort((a,b)=>{
    let va=a[col], vb=b[col];
    if(typeof va==="number" && typeof vb==="number") return (va-vb)*mult;
    va=String(va||"").toLowerCase(); vb=String(vb||"").toLowerCase();
    return va<vb ? -1*mult : va>vb ? 1*mult : 0;
  });
}

function sortableHeader(label, col, sortState){
  const active = sortState.col===col;
  const arrow = active ? (sortState.dir==="asc" ? "▲" : "▼") : "▲";
  return `<th class="sortable-th${active?" sort-active":""}" data-sort-col="${col}">${escapeHtml(label)}<span class="sort-arrow">${arrow}</span></th>`;
}

function parseCSV(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) return {header:[],rows:[]};
  const parse = line => {
    const result=[]; let cur="",inQuote=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(inQuote){ if(ch==='"'&&line[i+1]==='"'){cur+='"';i++;}else if(ch==='"'){inQuote=false;}else{cur+=ch;} }
      else{ if(ch==='"'){inQuote=true;}else if(ch===','){result.push(cur.trim());cur="";}else{cur+=ch;} }
    }
    result.push(cur.trim());
    return result;
  };
  const header = parse(lines[0]).map(h=>h.toLowerCase().replace(/[^a-z0-9]/g,""));
  const rows = lines.slice(1).map(parse);
  return {header,rows};
}

function updateTabBadges(){
  const lowEq = state.equipment.filter(needsReorder).length;
  const lowChem = state.chemicals.filter(needsReorder).length;
  const orderCount = lowEq + lowChem;
  const expiredCount = state.chemicals.filter(c=>isExpiringOrExpired(c.expiry).expired).length;
  const expiringCount = state.chemicals.filter(c=>isExpiringOrExpired(c.expiry).soon).length;
  const damagedCount = state.equipment.filter(i=>i.condition==="Repair"||i.condition==="Replace").length;
  const practicalShortages = state.practical.reduce((sum,p)=>sum+checkPracticalStock(p).short,0);
  const badges = {
    "tab-equipment": damagedCount > 0 ? `<span class="tab-badge tab-badge-warn">${damagedCount}</span>` : "",
    "tab-chemicals": expiredCount > 0 ? `<span class="tab-badge tab-badge-danger">${expiredCount}</span>` : expiringCount > 0 ? `<span class="tab-badge tab-badge-warn">${expiringCount}</span>` : "",
    "tab-practical": practicalShortages > 0 ? `<span class="tab-badge tab-badge-warn">${practicalShortages}</span>` : "",
    "tab-orders": orderCount > 0 ? `<span class="tab-badge tab-badge-danger">${orderCount}</span>` : "",
  };
  const labels = {
    "tab-equipment":"Equipment","tab-chemicals":"Chemicals","tab-practical":"Practicals",
    "tab-stocktake":"Stocktake","tab-orders":"Orders Required","tab-reports":"Reports","tab-settings":"Settings"
  };
  document.querySelectorAll(".global-tab").forEach(btn=>{
    const tab = btn.getAttribute("data-tab");
    if(labels[tab]) btn.innerHTML = escapeHtml(labels[tab]) + (badges[tab]||"");
  });
}

function needsReorder(item){
  const threshold = (item.reorderAt > 0) ? item.reorderAt : item.reqQty;
  return item.curQty < threshold;
}

function findInventoryItem(name, type){
  if(type==="equipment") return state.equipment.find(i=>i.name===name);
  if(type==="chemical") return state.chemicals.find(i=>i.name===name);
  return state.equipment.find(i=>i.name===name) || state.chemicals.find(i=>i.name===name);
}

function checkPracticalStock(practical){
  if(!practical.items || !practical.items.length) return {total:0,ok:0,short:0,items:[]};
  const results = practical.items.map(pi=>{
    const inv = findInventoryItem(pi.name, pi.type);
    const inStock = inv ? inv.curQty : 0;
    const needed = pi.qty || 0;
    return {name:pi.name, type:pi.type, needed, inStock, sufficient: inStock >= needed};
  });
  return {total:results.length, ok:results.filter(r=>r.sufficient).length, short:results.filter(r=>!r.sufficient).length, items:results};
}

function renderDashboard(){
  const eqCount = state.equipment.length;
  const chemCount = state.chemicals.length;
  const lowStockEq = state.equipment.filter(needsReorder);
  const lowStockChem = state.chemicals.filter(needsReorder);
  const lowStockCount = lowStockEq.length + lowStockChem.length;
  // total units to order (sum of deficits) — distinct from item count
  const totalUnitsNeeded = [...lowStockEq,...lowStockChem].reduce((sum,i)=>sum+(i.reqQty-i.curQty),0);
  const damaged = state.equipment.filter(i=>i.condition==="Repair"||i.condition==="Replace").length;
  const expiredCount = state.chemicals.filter(c=>isExpiringOrExpired(c.expiry).expired).length;
  const expiringCount = state.chemicals.filter(c=>isExpiringOrExpired(c.expiry).soon).length;

  const cards = [
    {label:"Equipment Items", value:eqCount, sub:eqCount+" tracked types", action:"tab-equipment"},
    {label:"Chemical Items", value:chemCount, sub:chemCount+" tracked types", action:"tab-chemicals"},
    {label:"Low Stock Items", value:lowStockCount, cls:lowStockCount>0?"warn":"", sub:lowStockEq.length+" equip · "+lowStockChem.length+" chemical", action:"tab-orders"},
    {label:"Total Units to Order", value:totalUnitsNeeded, cls:totalUnitsNeeded>0?"alert":"", sub:"combined deficit across all items", action:"tab-orders"},
    {label:"Damaged / Repair", value:damaged, cls:damaged>0?"warn":"", sub:"needs attention", action:"tab-stocktake", filter:"damaged"},
    {label:"Expired Chemicals", value:expiredCount, cls:expiredCount>0?"alert":"", sub:expiringCount+" expiring within 60 days", action:"tab-stocktake", filter:"expired"},
  ];

  document.getElementById("dashboard").innerHTML = cards.map(c=>`
    <div class="dash-card dash-card-clickable ${c.cls||""}" data-dash-action="${c.action}" ${c.filter?`data-dash-filter="${c.filter}"`:""} role="listitem button" tabindex="0" aria-label="View ${escapeHtml(c.label)}">
      <div class="dash-label">${escapeHtml(c.label)}</div>
      <div class="dash-value">${c.value}</div>
      <div class="dash-sub">${escapeHtml(c.sub)}</div>
    </div>
  `).join("") + `
    <div class="dash-card" role="listitem">
      <div class="dash-label">Last Updated</div>
      <div class="dash-value" style="font-size:15px;line-height:1.3;margin-top:10px;">${fmtDateTime(state.lastUpdated)}</div>
    </div>
  `;
  updateTabBadges();
}

function renderEquipmentTab(){

  const catFilter = ui.equipmentCategoryFilter;
  let rows = state.equipment.filter(item=>matchesSearch([item.name,item.category,item.location,item.supplier,item.notes,item.condition],q));
  if(catFilter && catFilter!=="all") rows = rows.filter(item=>item.category===catFilter);

  }else{
    tableRows = rows.map(item=>{

function bindEquipmentEvents(container){
  const addBtn = container.querySelector("#addEquipmentBtn");
  if(addBtn) addBtn.addEventListener("click",()=>{
    state.equipment.unshift({id:uid("eq"),name:"",category:state.equipmentCategories[0]||"General Laboratory",reqQty:0,curQty:0,condition:"Good",location:"",supplier:"",reorderAt:0,notes:""});
    scheduleSave(); rerenderActiveTab();
    setTimeout(()=>{ const f=container.querySelector('tbody tr td input[data-eq-field="name"]'); if(f) f.focus(); },30);
  });
  const catBtn = container.querySelector("#manageEqCategoriesBtn");
  if(catBtn) catBtn.addEventListener("click",()=>manageEqCategories());
  const csvBtn = container.querySelector("#exportEqCsvBtn");
  if(csvBtn) csvBtn.addEventListener("click",()=>{
    const header = ["Name","Category","Required Qty","Reorder At","Current Qty","Condition","Location","Supplier","Notes"];
    const rows = state.equipment.map(i=>[i.name,i.category,i.reqQty,i.reorderAt||0,i.curQty,i.condition,i.location,i.supplier,i.notes]);
    downloadCsv("equipment-inventory.csv", header, rows);
  });

  const catFilterEl = container.querySelector("#eqCategoryFilter");
  if(catFilterEl) catFilterEl.addEventListener("change",()=>{
    ui.equipmentCategoryFilter = catFilterEl.value;
    saveUI(); rerenderActiveTab();
  });

  container.querySelectorAll(".sortable-th[data-sort-col]").forEach(th=>{
    th.addEventListener("click",()=>{
      const col = th.getAttribute("data-sort-col");
      if(ui.equipmentSort.col===col) ui.equipmentSort.dir = ui.equipmentSort.dir==="asc"?"desc":"asc";
      else{ ui.equipmentSort.col=col; ui.equipmentSort.dir="asc"; }
      saveUI(); rerenderActiveTab();
    });
  });

  const importBtn = container.querySelector("#importEqCsvBtn");
  const importInput = container.querySelector("#importEqFileInput");
  if(importBtn) importBtn.addEventListener("click",()=>importInput.click());
  if(importInput) importInput.addEventListener("change",()=>{
    const file = importInput.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      const {header,rows} = parseCSV(reader.result);
      if(rows.length===0){ alert("No data rows found in the CSV file."); return; }
      const colMap = {name:-1,category:-1,reqqty:-1,requiredqty:-1,reorderat:-1,curqty:-1,currentqty:-1,condition:-1,location:-1,storagelocation:-1,supplier:-1,notes:-1};
      header.forEach((h,i)=>{ if(h in colMap) colMap[h]=i; });
      const nameCol = colMap.name!==-1?colMap.name : header.findIndex(h=>h.includes("name"));
      if(nameCol===-1){ alert("Could not find a 'Name' column in the CSV header."); return; }
      let added=0;
      rows.forEach(r=>{
        const name = (r[nameCol]||"").trim(); if(!name) return;
        const get = (...keys)=>{ for(const k of keys){ if(colMap[k]!==-1 && r[colMap[k]]) return r[colMap[k]].trim(); } return ""; };
        state.equipment.push({
          id:uid("eq"), name,
          category: get("category") || state.equipmentCategories[0] || "General Laboratory",
          reqQty: parseInt(get("reqqty","requiredqty"),10)||0,
          reorderAt: parseInt(get("reorderat"),10)||0,
          curQty: parseInt(get("curqty","currentqty"),10)||0,
          condition: get("condition") || "Good",
          location: get("location","storagelocation"),
          supplier: get("supplier"),
          notes: get("notes")
        });
        added++;
      });
      importInput.value="";
      if(added>0){ scheduleSave(`${added} items imported`); renderDashboard(); rerenderActiveTab(); }
      else alert("No valid rows could be imported.");
    };
    reader.readAsText(file);
  });

  container.querySelectorAll("[data-eq-id]").forEach(row=>{
    const id = row.getAttribute("data-eq-id");
    const item = state.equipment.find(i=>i.id===id);
    if(!item) return;

    row.querySelectorAll("[data-eq-field]").forEach(input=>{
      const field = input.getAttribute("data-eq-field");
      const handler = ()=>{
        let val = input.value;
        if(field==="reqQty"||field==="curQty"||field==="reorderAt"){ val = Math.max(0, parseInt(val,10)||0); input.value=val; }
        item[field]=val;
        scheduleSave();
        if(field==="reqQty"||field==="curQty"||field==="reorderAt"||field==="condition"){
          clearTimeout(input._rrTimer);
          input._rrTimer=setTimeout(()=>{ renderDashboard(); rerenderActiveTab(true); },350);
        }else{
          renderDashboard();
        }
      };
      input.addEventListener("input", handler);
      input.addEventListener("change", handler);
    });

    row.querySelectorAll("[data-eq-step]").forEach(btn=>{
      btn.addEventListener("click",()=>{
        const delta = parseInt(btn.getAttribute("data-eq-step"),10);
        item.curQty = Math.max(0, (item.curQty||0)+delta);
        scheduleSave(); renderDashboard(); rerenderActiveTab(true);
      });
    });

    const delBtn = row.querySelector("[data-eq-delete]");
    if(delBtn) delBtn.addEventListener("click",()=>{
      const idx = state.equipment.findIndex(i=>i.id===id);
      if(idx===-1) return;
      const removed = state.equipment.splice(idx,1)[0];
      scheduleSave(); renderDashboard(); rerenderActiveTab();
      showToast(`"${removed.name||"Item"}" removed`, {label:"Undo", fn:()=>{
        state.equipment.splice(idx,0,removed);
        scheduleSave(); renderDashboard(); rerenderActiveTab();
        showToast("Item restored");
      }});
    });
  });

  // Drag-to-reorder (only when no sort or filter is active)
  if(!ui.equipmentSort.col && ui.equipmentCategoryFilter==="all"){
    const tbody = container.querySelector(".editable-table tbody");
    if(tbody){
      tbody.addEventListener("dragstart",e=>{
        const handle = e.target.closest("[data-drag-eq]");
        if(!handle){ e.preventDefault(); return; }
        const tr = handle.closest("tr");
        tr.classList.add("dragging");
        e.dataTransfer.effectAllowed="move";
        e.dataTransfer.setData("text/plain",tr.getAttribute("data-eq-id"));
      });
      tbody.addEventListener("dragend",()=>{
        tbody.querySelectorAll("tr").forEach(r=>r.classList.remove("dragging","drag-over"));
      });
      tbody.addEventListener("dragover",e=>{
        e.preventDefault();
        const tr = e.target.closest("tr");
        if(!tr||tr.classList.contains("dragging")) return;
        tbody.querySelectorAll(".drag-over").forEach(r=>r.classList.remove("drag-over"));
        tr.classList.add("drag-over");
      });
      tbody.addEventListener("drop",e=>{
        e.preventDefault();
        const dragId = e.dataTransfer.getData("text/plain");
        const dropTr = e.target.closest("tr");
        if(!dropTr) return;
        const dropId = dropTr.getAttribute("data-eq-id");
        if(!dragId||!dropId||dragId===dropId) return;
        const arr = state.equipment;
        const fromIdx = arr.findIndex(i=>i.id===dragId);
        const toIdx = arr.findIndex(i=>i.id===dropId);
        if(fromIdx===-1||toIdx===-1) return;
        const [moved] = arr.splice(fromIdx,1);
        arr.splice(toIdx,0,moved);
        scheduleSave(); rerenderActiveTab();
      });
    }
  }
}

function manageEqCategories(){
  const current = state.equipmentCategories.join(", ");
  const updated = prompt("Edit equipment categories (comma-separated):", current);
  if(updated==null) return;
  const list = updated.split(",").map(s=>s.trim()).filter(Boolean);
  if(list.length===0){ alert("You need at least one category."); return; }
  state.equipmentCategories = list;
  scheduleSave("Categories updated");
  rerenderActiveTab();
}

        if(!dragId||!dropId||dragId===dropId) return;
        const arr = state.chemicals;
        const fromIdx = arr.findIndex(i=>i.id===dragId);
        const toIdx = arr.findIndex(i=>i.id===dropId);
        if(fromIdx===-1||toIdx===-1) return;
        const [moved] = arr.splice(fromIdx,1);
        arr.splice(toIdx,0,moved);
        scheduleSave(); rerenderActiveTab();
      });
    }
  }
}

function renderPracticalTab(){
  const q = getSearchQuery();
  const cats = state.practical.filter(c=>matchesSearch([c.name,c.notes,...(c.items||[]).map(i=>i.name)],q));

  const allNames = [...state.equipment.map(i=>({name:i.name,type:"equipment"})),...state.chemicals.map(i=>({name:i.name,type:"chemical"}))];

  const addBtn = `
    <div class="btn-row" style="margin-bottom:14px;">
      <button class="btn btn-primary" id="addPracticalCatBtn">${ICON.plus} Add practical category</button>
    </div>`;

  let body;
  if(cats.length===0){
    body = addBtn + emptyState("No practical categories found", q?"Try a different search term.":"Add your first category above.");
  }else{
    const readyCount = state.practical.filter(p=>p.readyForExam).length;
    const totalShortages = state.practical.reduce((sum,p)=>sum+checkPracticalStock(p).short,0);
    body = addBtn + `<p class="small-note" style="margin-bottom:12px;">${readyCount} of ${state.practical.length} categories marked exam-ready.${totalShortages>0?` <strong style="color:var(--danger)">${totalShortages} stock shortage${totalShortages>1?"s":""} detected.</strong>`:` <span style="color:var(--ok)">All stock requirements met.</span>`}</p>` +
      cats.map(c=>{
        if(!c.items) c.items=[];
        const stock = checkPracticalStock(c);
        const checked = [c.equipmentAvailable,c.consumablesAvailable,c.readyForExam].filter(Boolean).length;
        let meta;
        if(c.readyForExam) meta = `<span class="badge badge-excellent">Exam ready</span>`;
        else if(stock.short>0) meta = `<span class="badge badge-shortage">${stock.short} shortage${stock.short>1?"s":""}</span>`;
        else meta = `${checked}/3 checked`;

        const itemsUsed = new Set(c.items.map(i=>i.name));
        const available = allNames.filter(a=>!itemsUsed.has(a.name));

        const itemRows = c.items.length ? c.items.map((pi,idx)=>{
          const inv = findInventoryItem(pi.name, pi.type);
          const inStock = inv ? inv.curQty : 0;
          const sufficient = inStock >= pi.qty;
          const unit = inv ? (inv.unit||"") : "";
          return `<div class="plan-item">
            <span class="plan-item-name" title="${escapeHtml(pi.name)}">${escapeHtml(pi.name)}</span>
            <input class="plan-item-qty" type="number" min="1" value="${pi.qty}" data-plan-item-idx="${idx}" title="Quantity needed">
            <span class="plan-item-stock ${sufficient?"ok":"low"}">${inStock}${unit?" "+escapeHtml(unit):""} in stock</span>
            <button class="plan-item-remove" data-plan-remove-idx="${idx}" title="Remove">&times;</button>
          </div>`;
        }).join("") : `<p style="font-size:12.5px;color:var(--text-muted);margin:6px 0;">No items added yet. Add equipment or chemicals this practical requires.</p>`;

        const addRow = `<div class="plan-add-row">
          <select data-plan-add-select><option value="">+ Add item…</option>${available.map(a=>`<option value="${escapeHtml(a.name)}" data-item-type="${a.type}">${escapeHtml(a.name)} (${a.type})</option>`).join("")}</select>
          <input type="number" min="1" value="1" data-plan-add-qty placeholder="Qty">
          <button class="plan-add-btn" data-plan-add-btn>Add</button>
        </div>`;

        const summary = stock.total > 0 ? `<div class="plan-summary">
          <span class="plan-stat"><strong>${stock.total}</strong> items required</span>
          <span class="plan-stat" style="color:var(--ok)"><strong>${stock.ok}</strong> in stock</span>
          ${stock.short>0?`<span class="plan-stat has-shortage"><strong>${stock.short}</strong> short</span>`:""}
        </div>` : "";

        const inner = `
          <div class="checklist-grid">
            <label class="checklist-row"><input type="checkbox" data-pc-field="equipmentAvailable" ${c.equipmentAvailable?"checked":""}> Equipment available</label>
            <label class="checklist-row"><input type="checkbox" data-pc-field="consumablesAvailable" ${c.consumablesAvailable?"checked":""}> Consumables available</label>
            <label class="checklist-row"><input type="checkbox" data-pc-field="readyForExam" ${c.readyForExam?"checked":""}> Ready for examination</label>
          </div>
          <div style="margin-top:10px;">
            <label style="font-size:12px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.3px;">Required items &amp; stock check</label>
            <div class="plan-items">${itemRows}</div>
            ${addRow}
            ${summary}
          </div>
          <div class="field" style="margin-top:10px;">
            <label>Teacher notes</label>
            <textarea class="notes-area" data-pc-field="notes" placeholder="Add notes…">${escapeHtml(c.notes)}</textarea>
          </div>
        `;
        const deleteBtn = `<button class="pc-delete-btn" data-pc-delete title="Delete category" aria-label="Delete category">Delete</button>`;
        return `<div data-pc-id="${c.id}">${subsectionWrap("pc-"+c.id, c.name, meta, inner, deleteBtn)}</div>`;
      }).join("");
  }

  return sectionWrap("sec-practical", ICON.clipboard, "Practical Experiment Planner", `${state.practical.length} categories`, body);
}

function bindPracticalEvents(container){
  const addBtn = container.querySelector("#addPracticalCatBtn");
  if(addBtn) addBtn.addEventListener("click",()=>{
    const name = prompt("New practical category name:");
    if(!name || !name.trim()) return;
    state.practical.push({id:uid("pc"),name:name.trim(),equipmentAvailable:false,consumablesAvailable:false,readyForExam:false,notes:"",items:[]});
    scheduleSave("Category added"); rerenderActiveTab();
  });

  container.querySelectorAll("[data-pc-id]").forEach(wrap=>{
    const id = wrap.getAttribute("data-pc-id");
    const item = state.practical.find(c=>c.id===id);
    if(!item) return;

    // delete button is inside subsection-header — prevent toggle from firing
    const delBtn = wrap.querySelector("[data-pc-delete]");
    if(delBtn) delBtn.addEventListener("click",(e)=>{
      e.stopPropagation();
      if(confirm(`Delete practical category "${item.name}"? This cannot be undone.`)){
        state.practical = state.practical.filter(c=>c.id!==id);
        scheduleSave("Category deleted"); rerenderActiveTab();
      }
    });

    wrap.querySelectorAll("[data-pc-field]").forEach(input=>{
      const field = input.getAttribute("data-pc-field");
      const handler = ()=>{
        if(input.type==="checkbox") item[field]=input.checked;
        else item[field]=input.value;
        scheduleSave();
        if(input.type==="checkbox") rerenderActiveTab(true);
      };
      input.addEventListener("change", handler);
      input.addEventListener("input", handler);
    });

    if(!item.items) item.items=[];

    wrap.querySelectorAll("[data-plan-item-idx]").forEach(input=>{
      input.addEventListener("change",()=>{
        const idx = parseInt(input.getAttribute("data-plan-item-idx"),10);
        if(item.items[idx]) item.items[idx].qty = Math.max(1, parseInt(input.value,10)||1);
        scheduleSave(); rerenderActiveTab(true);
      });
    });

    wrap.querySelectorAll("[data-plan-remove-idx]").forEach(btn=>{
      btn.addEventListener("click",()=>{
        const idx = parseInt(btn.getAttribute("data-plan-remove-idx"),10);
        item.items.splice(idx,1);
        scheduleSave(); rerenderActiveTab(true);
      });
    });

    const addBtn = wrap.querySelector("[data-plan-add-btn]");
    if(addBtn) addBtn.addEventListener("click",()=>{
      const sel = wrap.querySelector("[data-plan-add-select]");
      const qtyInput = wrap.querySelector("[data-plan-add-qty]");
      if(!sel || !sel.value) return;
      const opt = sel.options[sel.selectedIndex];
      const type = opt.getAttribute("data-item-type")||"equipment";
      item.items.push({name:sel.value, type, qty:Math.max(1,parseInt(qtyInput.value,10)||1)});
      scheduleSave(); rerenderActiveTab(true);
    });
  });
}

/* ================================================================
   STOCKTAKE TAB
   ================================================================ */
function renderStocktakeTab(){
  const q = getSearchQuery();
  const filter = ui.stocktakeFilter;

  const eqItems = state.equipment.map(i=>({...i,_type:"equipment"}));
  const chemItems = state.chemicals.map(i=>({...i,_type:"chemical"}));
  let all = [...eqItems,...chemItems].filter(i=>matchesSearch([i.name,i.location,i.supplier,i.category||i.formula],q));

  all = all.filter(i=>{
    const shortage = needsReorder(i);
    const damaged = i._type==="equipment" && (i.condition==="Repair"||i.condition==="Replace");
    const expired = i._type==="chemical" && isExpiringOrExpired(i.expiry).expired;
    const soon = i._type==="chemical" && isExpiringOrExpired(i.expiry).soon;
    if(filter==="shortage") return shortage;
    if(filter==="damaged") return damaged;
    if(filter==="expired") return expired;
    if(filter==="expiring") return soon;
    return true;
  });

  const chips = [
    {key:"all",label:"All items"},
    {key:"shortage",label:"Shortages"},
    {key:"damaged",label:"Damaged"},
    {key:"expired",label:"Expired chemicals"},
    {key:"expiring",label:"Expiring soon"},
  ].map(c=>`<button class="filter-chip ${ui.stocktakeFilter===c.key?"active":""}" data-stocktake-filter="${c.key}">${c.label}</button>`).join("");

  let list;
  if(all.length===0){
    list = emptyState("No items match this view","Try a different filter or search term.");
  }else{
    list = `<div class="stocktake-list">` + all.map(i=>{
      const shortage = needsReorder(i);
      const damaged = i._type==="equipment" && (i.condition==="Repair"||i.condition==="Replace");
      const expired = i._type==="chemical" && isExpiringOrExpired(i.expiry).expired;
      const soon = i._type==="chemical" && isExpiringOrExpired(i.expiry).soon;
      let badge = "";
      if(shortage) badge = `<span class="badge badge-replace">Shortage</span>`;
      else if(damaged) badge = `<span class="badge badge-fair">${escapeHtml(i.condition)}</span>`;
      else if(expired) badge = `<span class="badge badge-high">Expired</span>`;
      else if(soon) badge = `<span class="badge badge-soon">Expiring soon</span>`;
      const rowClass = shortage?"row-shortage":soon&&!expired?"row-expiring-soon":"";
      return `
      <div class="stocktake-item ${rowClass}" data-st-id="${i.id}" data-st-type="${i._type}">
        <span class="st-name">${escapeHtml(i.name||"(unnamed)")}</span>
        <span class="st-loc">${escapeHtml(i.location||"—")}</span>
        ${badge}
        <div class="qty-stepper">
          <button type="button" data-st-step="-1" aria-label="Decrease quantity">−</button>
          <input class="cell-edit" type="number" min="0" data-st-field="curQty" value="${i.curQty}">
          <button type="button" data-st-step="1" aria-label="Increase quantity">+</button>
        </div>
        <span class="text-muted" style="font-size:12px;">/ ${i.reqQty} required</span>
        ${stockBar(i.curQty, i.reqQty)}
      </div>`;
    }).join("") + `</div>`;
  }

  const body = `
    <div class="stocktake-toolbar">${chips}</div>
    ${list}
    <p class="small-note">Use the search bar above to find items quickly. All changes save automatically.</p>
  `;
  return sectionWrap("sec-stocktake", ICON.list, "Stocktake", `${all.length} items in view`, body);
}

function bindStocktakeEvents(container){
  container.querySelectorAll("[data-stocktake-filter]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      ui.stocktakeFilter = btn.getAttribute("data-stocktake-filter");
      saveUI(); rerenderActiveTab();
    });
  });
  container.querySelectorAll("[data-st-id]").forEach(row=>{
    const id = row.getAttribute("data-st-id");
    const type = row.getAttribute("data-st-type");
    const arr = type==="equipment" ? state.equipment : state.chemicals;
    const item = arr.find(i=>i.id===id);
    if(!item) return;
    const input = row.querySelector('[data-st-field="curQty"]');
    const commit = (val)=>{
      item.curQty = Math.max(0, val);
      scheduleSave(); renderDashboard(); rerenderActiveTab(true);
    };
    input.addEventListener("change",()=>commit(parseInt(input.value,10)||0));
    row.querySelectorAll("[data-st-step]").forEach(btn=>{
      btn.addEventListener("click",()=>commit((item.curQty||0)+parseInt(btn.getAttribute("data-st-step"),10)));
    });
  });
}

function renderExpiryCalendar(){
  const month = ui.calendarMonth;
  const year = ui.calendarYear;
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month+1, 0);
  const startDow = firstDay.getDay();
  const daysInMonth = lastDay.getDate();
  const today = new Date();
  const todayStr = today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
  const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  const expiryMap = {};
  state.chemicals.forEach(c=>{
    if(!c.expiry) return;
    const parts = c.expiry.split("-");
    if(parts.length<3) return;
    const ey = parseInt(parts[0],10), em = parseInt(parts[1],10)-1;
    if(ey===year && em===month){
      const day = parseInt(parts[2],10);
      if(!expiryMap[day]) expiryMap[day]=[];
      const exp = isExpiringOrExpired(c.expiry);
      const cls = exp.expired?"expired":exp.soon?"expiring":"ok";
      expiryMap[day].push({name:c.name, cls});
    }
  });

  const dayHeaders = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<div class="calendar-day-header">${d}</div>`).join("");
  let cells = "";
  for(let i=0;i<startDow;i++) cells += `<div class="calendar-day empty"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const dateStr = year+"-"+String(month+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const isToday = dateStr===todayStr;
    const items = expiryMap[d]||[];
    const itemsHtml = items.map(i=>`<div class="calendar-item ${i.cls}" title="${escapeHtml(i.name)}">${escapeHtml(i.name)}</div>`).join("");
    cells += `<div class="calendar-day${isToday?" today":""}"><div class="day-num">${d}</div><div class="calendar-day-items">${itemsHtml}</div></div>`;
  }

  return `
    <div class="report-block">
      <h3>Chemical Expiry Calendar</h3>
      <div class="calendar-nav">
        <button class="btn" id="calPrevBtn" style="padding:4px 10px;">&laquo; Prev</button>
        <h3>${monthNames[month]} ${year}</h3>
        <button class="btn" id="calNextBtn" style="padding:4px 10px;">Next &raquo;</button>
      </div>
      <div class="calendar-grid">
        ${dayHeaders}
        ${cells}
      </div>
      <p class="small-note" style="margin-top:8px;"><span style="color:var(--danger);">&#9632;</span> Expired &nbsp; <span style="color:var(--warn);">&#9632;</span> Expiring within 60 days &nbsp; <span style="color:var(--ok);">&#9632;</span> OK</p>
    </div>`;
}

function bindReportsEvents(container){
  container.querySelector("#exportJsonBtn")?.addEventListener("click",()=>{
    const blob = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href=url; a.download="newberry-house-inventory-backup.json";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showToast("Backup downloaded");
  });
  container.querySelector("#exportCsvAllBtn")?.addEventListener("click",()=>{
    downloadCsv("newberry-house-full-inventory.csv",
      ["Type","Name","Category/Formula","Required","Reorder At","Current","Unit/Condition","Location","Supplier","Notes"],
      [
        ...state.equipment.map(i=>["Equipment",i.name,i.category,i.reqQty,i.reorderAt||0,i.curQty,i.condition,i.location,i.supplier,i.notes]),
        ...state.chemicals.map(i=>["Chemical",i.name,i.formula,i.reqQty,i.reorderAt||0,i.curQty,i.unit,i.location,i.supplier,i.notes]),
      ]
    );
  });
  container.querySelector("#printReportBtn")?.addEventListener("click",()=>window.print());
  container.querySelector("#calPrevBtn")?.addEventListener("click",()=>{
    ui.calendarMonth--;
    if(ui.calendarMonth<0){ ui.calendarMonth=11; ui.calendarYear--; }
    saveUI(); rerenderActiveTab();
  });
  container.querySelector("#calNextBtn")?.addEventListener("click",()=>{
    ui.calendarMonth++;
    if(ui.calendarMonth>11){ ui.calendarMonth=0; ui.calendarYear++; }
    saveUI(); rerenderActiveTab();
  });
}

/* ================================================================
   SETTINGS TAB
   ================================================================ */
function renderSettingsTab(){
  const s = state.settings;
  const body = `
    <div class="form-grid">
      <div class="field">
        <label for="setSchoolName">School Name</label>
        <input type="text" id="setSchoolName" value="${escapeHtml(s.schoolName)}">
      </div>
      <div class="field">
        <label for="setTeacherName">Teacher Name</label>
        <input type="text" id="setTeacherName" value="${escapeHtml(s.teacherName)}" placeholder="e.g. Dr. A. Patel">
      </div>
      <div class="field">
        <label for="setLabName">Laboratory Name</label>
        <input type="text" id="setLabName" value="${escapeHtml(s.labName)}">
      </div>
      <div class="field">
        <label for="setAcademicYear">Academic Year</label>
        <input type="text" id="setAcademicYear" value="${escapeHtml(s.academicYear)}">
      </div>
    </div>

    <hr style="border:none;border-top:1px solid var(--surface-border);margin:22px 0;">
    <h3 style="font-size:14.5px;margin-bottom:10px;">Data Management</h3>
    <div class="btn-row">
      <button class="btn" id="backupDataBtn">${ICON.download} Backup data (JSON)</button>
      <button class="btn" id="restoreDataBtn">${ICON.upload} Restore from backup</button>
      <input type="file" id="restoreFileInput" accept="application/json" class="hidden">
      <button class="btn btn-danger" id="clearDemoBtn">${ICON.trash} Clear all data</button>
    </div>
    <p class="help-text">Backup downloads a complete JSON snapshot. Restore replaces all current data with a saved backup. Clearing removes all items but keeps settings.</p>
  `;
  return sectionWrap("sec-settings", ICON.gear, "Settings", "", body);
}

function bindSettingsEvents(container){
  const map = {setSchoolName:"schoolName",setTeacherName:"teacherName",setLabName:"labName",setAcademicYear:"academicYear"};
  Object.keys(map).forEach(elId=>{
    const el = container.querySelector("#"+elId);
    if(!el) return;
    el.addEventListener("input",()=>{ state.settings[map[elId]]=el.value; scheduleSave(); });
  });

  container.querySelector("#backupDataBtn")?.addEventListener("click",()=>{
    const blob = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download="newberry-house-inventory-backup.json";
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    showToast("Backup downloaded");
  });

  const restoreBtn = container.querySelector("#restoreDataBtn");
  const fileInput = container.querySelector("#restoreFileInput");
  restoreBtn?.addEventListener("click",()=>fileInput.click());
  fileInput?.addEventListener("change",()=>{
    const file = fileInput.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed.equipment || !parsed.chemicals){ alert("This file doesn't look like a valid inventory backup."); return; }
        if(confirm("Restoring will replace all current data. Continue?")){
          state = mergeDefaults(parsed); saveState(); renderDashboard(); rerenderActiveTab();
          showToast("Data restored from backup");
        }
      }catch(e){ alert("Could not read this file as JSON."); }
      fileInput.value="";
    };
    reader.readAsText(file);
  });

  container.querySelector("#clearDemoBtn")?.addEventListener("click",()=>{
    if(confirm("This will remove ALL equipment and chemical items. Your settings will be kept. Continue?")){
      state.equipment=[]; state.chemicals=[]; state.practical=seedPracticalCategories();
      scheduleSave("All items cleared"); renderDashboard(); rerenderActiveTab();
    }
  });
}

/* ================================================================
   SHARED UTILITY
   ================================================================ */
function downloadCsv(filename, header, rows){
  const esc = v => { const s=String(v==null?"":v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const lines = [header.map(esc).join(",")].concat(rows.map(r=>r.map(esc).join(",")));
  const blob = new Blob([lines.join("\n")],{type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  showToast("Downloaded "+filename);
}

/* ================================================================
   TAB ORCHESTRATION
   ================================================================ */
const TABS = [
  {id:"tab-equipment", render:renderEquipmentTab, bind:bindEquipmentEvents},
  {id:"tab-chemicals", render:renderChemicalsTab, bind:bindChemicalsEvents},
  {id:"tab-practical", render:renderPracticalTab, bind:bindPracticalEvents},
  {id:"tab-stocktake", render:renderStocktakeTab, bind:bindStocktakeEvents},
  {id:"tab-orders", render:renderOrdersTab, bind:bindOrdersEvents},
  {id:"tab-reports", render:renderReportsTab, bind:bindReportsEvents},
  {id:"tab-settings", render:renderSettingsTab, bind:bindSettingsEvents},
];

function buildTabsShell(){
  document.getElementById("tabsContainer").innerHTML = TABS.map(t=>`<div class="tab-panel" id="${t.id}" role="tabpanel"></div>`).join("");
}

function rerenderActiveTab(preserveFocus){
  const tabDef = TABS.find(t=>t.id===ui.activeTab) || TABS[0];
  const panel = document.getElementById(tabDef.id);
  if(!panel) return;

  let focusInfo = null;
  if(preserveFocus){
    const active = document.activeElement;
    if(active && panel.contains(active)){
      focusInfo = {
        selector: active.getAttribute("data-eq-field")||active.getAttribute("data-chem-field")||active.getAttribute("data-pc-field")||active.getAttribute("data-st-field"),
        rowId: active.closest("[data-eq-id]")?.getAttribute("data-eq-id")
              ||active.closest("[data-chem-id]")?.getAttribute("data-chem-id")
              ||active.closest("[data-pc-id]")?.getAttribute("data-pc-id")
              ||active.closest("[data-st-id]")?.getAttribute("data-st-id"),
        selectionStart: active.selectionStart, selectionEnd: active.selectionEnd
      };
    }
  }

  panel.innerHTML = tabDef.render();
  tabDef.bind(panel);

  if(focusInfo?.rowId && focusInfo?.selector){
    const sel = `[data-eq-id="${focusInfo.rowId}"] [data-eq-field="${focusInfo.selector}"],`+
                `[data-chem-id="${focusInfo.rowId}"] [data-chem-field="${focusInfo.selector}"],`+
                `[data-pc-id="${focusInfo.rowId}"] [data-pc-field="${focusInfo.selector}"],`+
                `[data-st-id="${focusInfo.rowId}"] [data-st-field="${focusInfo.selector}"]`;
    const el = panel.querySelector(sel);
    if(el){ el.focus(); try{if(focusInfo.selectionStart!=null) el.setSelectionRange(focusInfo.selectionStart,focusInfo.selectionEnd);}catch(e){} }
  }
}

function switchTab(tabId){
  ui.activeTab = tabId;
  saveUI();
  document.querySelectorAll(".global-tab").forEach(btn=>{
    const active = btn.getAttribute("data-tab")===tabId;
    btn.classList.toggle("active", active);
    btn.setAttribute("aria-selected", active);
  });
  document.querySelectorAll(".tab-panel").forEach(panel=>{
    panel.classList.toggle("active", panel.id===tabId);
  });
  rerenderActiveTab();
}

document.getElementById("globalTabs").addEventListener("click",(e)=>{
  const btn = e.target.closest(".global-tab");
  if(btn) switchTab(btn.getAttribute("data-tab"));
});

/* ================================================================
   GLOBAL SEARCH
   ================================================================ */
function updateSearchCount(){
  const q = getSearchQuery();
  const countEl = document.getElementById("searchCount");
  const clearBtn = document.getElementById("searchClearBtn");
  clearBtn.classList.toggle("hidden", !q);
  if(!q){ countEl.textContent=""; return; }
  const eqN = state.equipment.filter(i=>matchesSearch([i.name,i.category,i.location,i.supplier,i.notes,i.condition],q)).length;
  const chemN = state.chemicals.filter(i=>matchesSearch([i.name,i.formula,i.location,i.supplier,i.notes,i.hazard,i.unit],q)).length;
  countEl.textContent = `${eqN+chemN} matches`;
}

let searchDebounce=null;
document.getElementById("globalSearch").addEventListener("input",()=>{
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(()=>{ updateSearchCount(); rerenderActiveTab(); },150);
});

document.getElementById("globalSearch").addEventListener("keydown",(e)=>{
  if(e.key==="Escape"){ clearSearch(); }
});

document.getElementById("searchClearBtn").addEventListener("click",clearSearch);

function clearSearch(){
  document.getElementById("globalSearch").value="";
  updateSearchCount();
  rerenderActiveTab();
}

/* ================================================================
   INIT
   ================================================================ */
function init(){
  state = loadState();
  ui = loadUI();
  applyTheme();
  buildTabsShell();
  renderDashboard();
  switchTab(ui.activeTab);
  updateSearchCount();
  setInterval(renderDashboard, 60000);
}

init();

})();
</script>
