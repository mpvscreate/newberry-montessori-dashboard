<!doctype html>
<html lang="en-ZA">
<head>

<title>Production showcase</title>

<link rel="apple-touch-icon" sizes="180x180" href="icons/productions-apple-180.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap">
<style>
:root{--paper:#fbf6ec;--sheet:#fff;--ink:#221c11;--muted:#6c6250;--line:#ece3cf;--green:#0b7a55;--sky:#2a6b8f;--amber:#e0a020;--red:#b3261e;--shadow:0 1px 2px rgba(70,45,10,.05),0 10px 30px rgba(70,45,10,.08);--display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;--body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--pc:#a65608}
@media (prefers-color-scheme:dark){:root{--paper:#14110c;--sheet:#1e1a13;--ink:#f4ecdc;--muted:#b1a68e;--line:#342e22;--green:#4fd1a1;--sky:#6db7e0;--shadow:0 10px 30px rgba(0,0,0,.4)}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.5 var(--body)}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;margin:0}
main{max-width:760px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom));overflow-x:hidden}
.load,.err{text-align:center;color:var(--muted);padding:80px 16px}
.hero{margin:0 -16px 18px;padding:calc(28px + env(safe-area-inset-top)) 20px 26px;color:#fff;background:linear-gradient(145deg,color-mix(in srgb,var(--pc) 88%,#fff),color-mix(in srgb,var(--pc) 70%,#000));border-radius:0 0 34px 34px;box-shadow:var(--shadow)}
@media (min-width:780px){.hero{margin:16px 0 22px;border-radius:34px}}
.brand{display:flex;align-items:center;gap:10px;font-size:.85rem;opacity:.92;margin-bottom:18px}.brand img{height:30px;width:auto;border-radius:6px}
.hrow{display:flex;align-items:center;gap:14px}.hrow>div:nth-child(2){flex:1;min-width:0}.hrow>.ring{flex:none}.hrow>.hm{flex:1;min-width:0}.hero .hm h1{font-size:clamp(1.3rem,5vw,2.2rem);overflow-wrap:break-word}
.pav{width:56px;height:56px;border-radius:18px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}.pav svg{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hero h1{font-size:clamp(1.5rem,6vw,2.4rem);line-height:1.1;overflow-wrap:anywhere}.hero p{margin:6px 0 0;opacity:.92}
.term{display:inline-block;margin-top:8px;font-size:.8rem;font-weight:600;background:rgba(255,255,255,.2);border-radius:99px;padding:3px 12px}
.ring{width:72px;height:72px;flex:none;margin-left:auto;position:relative}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 1.1rem var(--display)}
.stats{display:grid;grid-template-columns:1fr 1fr 1.7fr;gap:10px;margin-bottom:16px}
.stat{background:var(--sheet);border-radius:20px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}.stat b{display:block;font:700 1.6rem/1.1 var(--display);font-variant-numeric:tabular-nums}.stat b.sm{font-size:1rem;line-height:1.25;overflow-wrap:anywhere}.stat span{font-size:.8rem;color:var(--muted)}
.card{background:var(--sheet);border-radius:26px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}.card h2{font-size:1.2rem;margin-bottom:12px}
.cmps{--x:50%;position:relative;border-radius:18px;overflow:hidden;aspect-ratio:4/3;background:var(--line);-webkit-user-select:none;user-select:none}
.cmps img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cmps .b{clip-path:inset(0 calc(100% - var(--x)) 0 0)}
.cl{position:absolute;top:0;bottom:0;left:var(--x);width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.kn{position:absolute;top:50%;left:var(--x);width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:#fff;color:#221c11;box-shadow:0 2px 10px rgba(0,0,0,.35);display:grid;place-items:center;font-weight:700}
.tg{position:absolute;bottom:10px;background:rgba(0,0,0,.65);color:#fff;border-radius:99px;padding:3px 10px;font-size:.78rem;font-weight:600;pointer-events:none}.tg.l{left:10px}.tg.r{right:10px}
.cmps input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize;touch-action:pan-y}.cmps:focus-within{outline:3px solid var(--green);outline-offset:2px}
.hint{font-size:.82rem;color:var(--muted);margin:8px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.grid button{border:0;padding:0;border-radius:16px;overflow:hidden;aspect-ratio:1;background:var(--line);cursor:pointer;position:relative}.grid img{width:100%;height:100%;object-fit:cover;display:block}
.goal{padding:10px 0;border-top:1px solid var(--line)}.goal:first-of-type{border-top:0}.goal .t{display:flex;justify-content:space-between;gap:10px}.goal .t span{font-weight:600}.goal .t em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;border-radius:99px;background:var(--pc);min-width:0}
.done li{margin:4px 0}.done{padding-left:20px;margin:6px 0 0;color:var(--muted)}
.m3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.m3 div{background:var(--paper);border-radius:16px;padding:10px 12px}.m3 span{display:block;font-size:.78rem;color:var(--muted)}.m3 b{font:700 1.02rem var(--display);font-variant-numeric:tabular-nums}.pos{color:var(--green)}.neg{color:var(--red)}
.chart{display:block;width:100%;height:150px}.chart path{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.keys{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);margin-top:8px}.keys i{display:inline-block;width:16px;border-top:3px solid;vertical-align:middle;margin-right:6px;border-radius:2px}
blockquote{margin:0 0 12px;padding:2px 0 2px 14px;border-left:4px solid var(--pc)}blockquote small{display:block;color:var(--muted);margin-bottom:2px}
.kv{margin:0 0 12px}.kv span{display:block;font-size:.8rem;color:var(--muted)}.kv p{margin:2px 0 0}.sh{font-size:1rem;margin:14px 0 6px}.pl{padding-left:20px;margin:6px 0 0}.pl li{margin:6px 0}.mu{color:var(--muted);font-size:.9rem}.tg2{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tl{list-style:none;margin:0;padding:0}.tl li{padding:10px 0;border-top:1px solid var(--line)}.tl li:first-child{border-top:0}.tl small{display:block;color:var(--muted);margin-bottom:2px}
.tgt{list-style:none;margin:6px 0 0;padding:0;font-size:.9rem;color:var(--muted)}.tgt li{margin:2px 0}.tgt .ok{color:var(--green)}
.bars .r{display:grid;grid-template-columns:minmax(80px,34%) 1fr auto;gap:10px;align-items:center;margin:8px 0;font-size:.9rem}.bars .r .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bars .r .t{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.bars .r .t i{display:block;height:100%;border-radius:99px;background:var(--amber)}.bars .r b{font-variant-numeric:tabular-nums}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:16px}.pc{display:flex;flex-direction:column;background:var(--sheet);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);color:inherit;text-decoration:none}.pc .im{aspect-ratio:16/10;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 88%,#fff),color-mix(in srgb,var(--c) 70%,#000));position:relative;display:grid;place-items:center}.pc .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.pc .im svg{width:40px;height:40px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.pc .bd{padding:12px 14px 14px}.pc h3{font-size:1.05rem}.pc .mt{font-size:.82rem;color:var(--muted);margin-top:2px}.pc .go{display:inline-block;margin-top:8px;font-size:.85rem;font-weight:600;color:var(--green)}.pc .meter i{background:var(--c)}
footer{text-align:center;color:var(--muted);font-size:.82rem;padding:10px 0}
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}.lb[hidden]{display:none}
.lb img{max-width:100%;max-height:78vh;border-radius:14px}.lb p{color:#fff;margin:12px 0 0;text-align:center}
.lb button{position:absolute;border:0;background:rgba(255,255,255,.18);color:#fff;width:48px;height:48px;border-radius:50%;font-size:1.4rem;cursor:pointer}.lb .x{top:calc(12px + env(safe-area-inset-top));right:12px}.lb .p{left:10px;top:50%}.lb .n{right:10px;top:50%}
@media (prefers-reduced-motion:no-preference){.card,.stat{animation:in .4s ease both}@keyframes in{from{opacity:0;transform:translateY(8px)}}}
.hero.hc{position:relative;overflow:hidden;min-height:260px;display:flex;align-items:flex-end}.hbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hero.hc::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.72));z-index:1}.hin{position:relative;z-index:2;width:100%}
.hmeta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:.85rem;opacity:.95}
.play{display:inline-flex;align-items:center;gap:8px;margin-top:16px;border:0;border-radius:99px;padding:11px 20px;font:600 .95rem var(--body);background:#fff;color:#221c11;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.25)}.play svg{width:18px;height:18px;fill:currentColor}
.story{margin-bottom:16px}.st{font-size:1.3rem;margin:4px 2px 12px}
.chs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin:0 -2px;scrollbar-width:none}.chs::-webkit-scrollbar{display:none}
.ch{flex:none;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:99px;padding:7px 15px;font:600 .88rem var(--body);cursor:pointer}.ch[aria-pressed=true]{background:var(--pc);border-color:var(--pc);color:#fff}
.post{background:var(--sheet);border-radius:26px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}.post[hidden]{display:none}.post.pin{border:2px solid color-mix(in srgb,var(--pc) 45%,transparent)}
.post p{margin:6px 0 0;font-size:1.02rem;line-height:1.55;overflow-wrap:anywhere}
.pmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.82rem;color:var(--muted)}.pt{background:var(--paper);border-radius:99px;padding:2px 10px;font-weight:600}.pt.c{color:var(--pc)}
.pm{display:grid;gap:4px;margin-top:12px;border-radius:18px;overflow:hidden}.pm1{grid-template-columns:1fr}.pm2,.pm3,.pm4{grid-template-columns:1fr 1fr}
.pm button{position:relative;border:0;padding:0;background:var(--line);cursor:pointer;aspect-ratio:4/3;overflow:hidden}.pm1 button{aspect-ratio:16/10}.pm3 button:first-child{grid-row:span 2;aspect-ratio:auto}.pm img{width:100%;height:100%;object-fit:cover;display:block}
.pb{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.62);color:#fff;border-radius:99px;padding:1px 8px;font-size:.72rem;line-height:1.5}
.more{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.5);color:#fff;font:700 1.4rem var(--display)}
</style>
</head>
<body>
<main id="app"><p class="load">Loading the showcase…</p></main>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Photo"><button class="x" id="lb-x" aria-label="Close">&times;</button><button class="p" id="lb-p" aria-label="Previous photo">&lsaquo;</button><img id="lb-i" alt=""><p id="lb-c"></p><button class="n" id="lb-n" aria-label="Next photo">&rsaquo;</button></div>
<script>
(function(){
const SB="https://oikwudpqmbnssttatlhc.supabase.co",KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pa3d1ZHBxbWJuc3N0dGF0bGhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxMTMzODEsImV4cCI6MjA5NTY4OTM4MX0.p6I9qlvre5TjF3qOVjAIBus3_PNrbvCF2cMXHe3uiXw";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{v=Number(v);return isFinite(v)?v:0};
const rands=n=>"R "+num(n).toLocaleString("en-ZA",{minimumFractionDigits:2,maximumFractionDigits:2});
const dShort=t=>new Date(t).toLocaleDateString("en-ZA",{day:"numeric",month:"short"});
const tok=(location.hash||"").slice(1).replace(/[^A-Za-z0-9_-]/g,"");
const app=$("#app");
async function rpc(fn,body){const r=await fetch(SB+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});if(!r.ok)throw new Error("http "+r.status);return r.json()}
/* the icon comes from the database, so only plain drawing shapes are let through */
function cleanIcon(markup){
  const ok={path:["d"],circle:["cx","cy","r"],rect:["x","y","width","height","rx","ry"],line:["x1","y1","x2","y2"],polyline:["points"],polygon:["points"],ellipse:["cx","cy","rx","ry"]},NS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(NS,"svg");svg.setAttribute("viewBox","0 0 24 24");svg.setAttribute("aria-hidden","true");
  try{const doc=new DOMParser().parseFromString('<svg xmlns="'+NS+'">'+String(markup||"")+'</svg>',"image/svg+xml");
    [...doc.documentElement.children].forEach(n=>{const t=n.localName;if(!ok[t])return;const e=document.createElementNS(NS,t);ok[t].forEach(a=>{const v=n.getAttribute(a);if(v!==null&&/^[-0-9a-zA-Z.,\s]*$/.test(v))e.setAttribute(a,v)});svg.append(e)})}catch(e){}
  return svg;
}
const imgs={};
async function loadImg(id){if(imgs[id])return imgs[id];try{const u=await rpc("ms_showcase_img",{t:tok,i:id});if(typeof u==="string"&&u.indexOf("data:image/")===0){imgs[id]=u;return u}}catch(e){}return null}
async function fillImgs(root){
  const els=[...root.querySelectorAll("img[data-id]")],q=els.slice();
  const worker=async()=>{while(q.length){const el=q.shift(),u=await loadImg(el.dataset.id);if(u&&el.isConnected){el.src=u;el.removeAttribute("data-id")}}};
  await Promise.all([worker(),worker(),worker(),worker()]);
}
function ringSvg(p,col){const r=34,C=2*Math.PI*r;return '<svg viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="'+r+'" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="9"/><circle cx="42" cy="42" r="'+r+'" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+(C*p/100).toFixed(1)+" "+C.toFixed(1)+'"/></svg>'}
function moneyBlock(m){
  const pf=num(m.inc)-num(m.sp);let chart="";const rows=(m.rows||[]).filter(r=>r&&r.d);
  if(rows.length>=2){
    const W=600,H=170,T=10,B=10,pfs=rows.map(r=>num(r.inc)-num(r.sp)),hi=Math.max(1,num(m.approved),...rows.map(r=>Math.max(num(r.sp),num(r.inc))))*1.06,lo=Math.min(0,...pfs)*1.12;
    const t0=new Date(rows[0].d+"T12:00").getTime(),t1=new Date(rows[rows.length-1].d+"T12:00").getTime()||t0+1;
    const X=d=>((new Date(d+"T12:00").getTime()-t0)/Math.max(1,t1-t0)*(W-4)+2).toFixed(1),Y=v=>(T+(hi-v)/(hi-lo)*(H-T-B)).toFixed(1);
    const ln=f=>rows.map((r,i)=>(i?"L":"M")+X(r.d)+" "+Y(f(r))).join(" ");
    chart='<svg class="chart" viewBox="0 0 '+W+" "+H+'" preserveAspectRatio="none" role="img" aria-label="Money over time">'+(lo<0?'<line x1="0" x2="'+W+'" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="#999" stroke-width="1"/>':"")+(num(m.approved)>0?'<line x1="0" x2="'+W+'" y1="'+Y(num(m.approved))+'" y2="'+Y(num(m.approved))+'" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="6 6"/>':"")+'<path stroke="#2f7fb0" d="'+ln(r=>num(r.inc))+'"/><path stroke="#e0a020" d="'+ln(r=>num(r.sp))+'"/><path stroke="#1f9f78" style="stroke-width:3.4" d="'+ln(r=>num(r.inc)-num(r.sp))+'"/></svg><div class="keys"><span><i style="border-color:#2f7fb0"></i>Money in</span><span><i style="border-color:#e0a020"></i>Money spent</span><span><i style="border-color:#1f9f78"></i>'+(pf>=0?"Profit":"Loss")+"</span>"+(num(m.approved)>0?'<span><i style="border-color:#8a8f98;border-top-style:dashed;border-top-width:2px"></i>Budget</span>':"")+"</div>";
  }
  return '<section class="card"><h2>Money</h2><div class="m3"><div><span>Money in</span><b>'+rands(m.inc)+'</b></div><div><span>Spent</span><b>'+rands(m.sp)+'</b></div><div><span>'+(pf>=0?"Profit":"Loss")+'</span><b class="'+(pf>=0?"pos":"neg")+'">'+rands(Math.abs(pf))+"</b></div></div>"+chart+"</section>";
}
function renderSchool(d){
  document.documentElement.style.setProperty("--pc","#a65608");document.title=(d.title||"Production teams")+" · Showcase";
  const items=Array.isArray(d.items)?d.items:[],pct=Math.max(0,Math.min(100,Math.round(num(d.pct))));
  let h='<header class="hero"><div class="brand"><img src="icons/productions-96.png" alt="" height="30"><span>Newberry House Middle School</span></div><div class="hrow"><div class="hm"><h1>'+esc(d.title||"Our production teams")+"</h1><p>"+num(d.count)+" team"+(num(d.count)===1?"":"s")+' learning by doing</p></div><div class="ring" role="img" aria-label="'+pct+' percent complete on average">'+ringSvg(pct)+"<b>"+pct+"%</b></div></div></header>";
  h+='<div class="stats"><div class="stat"><b>'+num(d.done)+"</b><span>goals done</span></div><div class=\"stat\"><b>"+num(d.open)+"</b><span>still to do</span></div><div class=\"stat\"><b>"+num(d.students)+"</b><span>students</span></div></div>";
  h+='<div class="pgrid">'+items.map(i=>{const col=/^#[0-9a-fA-F]{3,8}$/.test(i.color||"")?i.color:"#a65608",link=/^[A-Za-z0-9_-]{20,}$/.test(i.link||"")?i.link:"",p=Math.max(0,Math.min(100,Math.round(num(i.pct))));
    const inner='<div class="im" data-ic="'+esc(i.id)+'">'+(i.cover?'<img data-id="'+esc(i.cover.id)+'" alt="'+esc(i.cover.cap||i.name)+'">':"")+'</div><div class="bd"><h3>'+esc(i.name)+'</h3><div class="meter"><i style="width:'+p+'%"></i></div><div class="mt">'+p+"% · "+num(i.done)+" done · "+num(i.open)+" to do"+(num(i.students)?" · "+num(i.students)+" student"+(num(i.students)===1?"":"s"):"")+"</div>"+(i.desc?'<div class="mt">'+esc(i.desc)+"</div>":"")+(link?'<span class="go">See their page &rarr;</span>':"")+"</div>";
    return link?'<a class="pc" style="--c:'+col+'" href="#'+link+'">'+inner+"</a>":'<div class="pc" style="--c:'+col+'">'+inner+"</div>"}).join("")+"</div>";
  h+="<footer>Made by the production teams"+(d.updated?" · Updated "+esc(new Date(d.updated).toLocaleDateString("en-ZA",{day:"numeric",month:"long",year:"numeric"})):"")+"<br>Questions about this page? Please contact the school.</footer>";
  app.innerHTML=h;
  items.forEach(i=>{const box=app.querySelector('[data-ic="'+i.id.replace(/[^A-Za-z0-9_-]/g,"")+'"]');if(box&&!i.cover)box.append(cleanIcon(i.icon))});
  fillImgs(app);
}
function render(d){
  if(d&&d.kind==="school")return renderSchool(d);
  const col=/^#[0-9a-fA-F]{3,8}$/.test(d.color||"")?d.color:"#a65608";
  document.documentElement.style.setProperty("--pc",col);document.title=(d.name||"Production")+" · Showcase";
  const photos=Array.isArray(d.photos)?d.photos:[],byId={};photos.forEach(p=>byId[p.id]=p);
  const posts=Array.isArray(d.posts)?d.posts:[],chs=Array.isArray(d.chapters)?d.chapters:[];
  const cover=d.cover&&byId[d.cover]?d.cover:"";
  /* the viewing order: post photos first (pinned and newest), then any other approved photos */
  const seq=[],seen=new Set();
  posts.forEach(po=>(po.m||[]).forEach(id=>{if(byId[id]&&!seen.has(id)){seen.add(id);seq.push({id,cap:byId[id].cap||po.txt||"",t:po.t})}}));
  photos.slice().reverse().forEach(p=>{if(!seen.has(p.id)){seen.add(p.id);seq.push({id:p.id,cap:p.cap||"",t:p.t})}});
  const idx={};seq.forEach((x,i)=>idx[x.id]=i);
  const fd=t=>{try{return new Date(t).toLocaleDateString("en-ZA",{day:"numeric",month:"long",year:"numeric"})}catch(e){return""}};
  let h='<header class="hero'+(cover?" hc":"")+'">'+(cover?'<img class="hbg" data-id="'+esc(cover)+'" alt="">':"")+'<div class="hin"><div class="brand"><img src="icons/productions-96.png" alt="" height="30"><span>Newberry House Middle School · Production teams</span></div><div class="hrow"><div class="pav" id="pav"></div><div><h1>'+esc(d.name)+"</h1>"+(d.term?'<span class="term">'+esc(d.term)+"</span>":"")+"</div></div>"+(d.desc?"<p>"+esc(d.desc)+"</p>":"")+'<div class="hmeta"><span>'+esc(d.team||"")+"</span>"+(posts.length?"<span>"+posts.length+" post"+(posts.length===1?"":"s")+"</span>":"")+(seq.length?"<span>"+seq.length+" photo"+(seq.length===1?"":"s")+"</span>":"")+"</div>"+(seq.length?'<button class="play" id="play" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>Play slideshow</button>':"")+"</div></header>";
  const kv=(k,v)=>v?'<div class="kv"><span>'+esc(k)+"</span><p>"+esc(v).replace(/\n/g,"<br>")+"</p></div>":"";
  /* Story */
  const postHtml=po=>{const ms=(po.m||[]).filter(id=>byId[id]),ch=chs.find(c=>c.id===po.ch);
    return '<article class="post'+(po.pin?" pin":"")+'" data-ch="'+esc(po.ch||"")+'"><div class="pmeta"><span>'+esc(dShort(po.t))+"</span>"+(po.pin?'<span class="pt">Pinned</span>':"")+(ch?'<span class="pt c">'+esc(ch.name)+"</span>":"")+"</div>"+(po.txt?"<p>"+esc(po.txt).replace(/\n/g,"<br>")+"</p>":"")+(ms.length?'<div class="pm pm'+Math.min(ms.length,4)+'">'+ms.slice(0,4).map((id,i)=>'<button type="button" data-p="'+idx[id]+'" aria-label="Open photo '+(i+1)+' of '+ms.length+'"><img data-id="'+esc(id)+'" alt="'+esc(byId[id].cap||"Production photo")+'">'+(byId[id].v?'<span class="pb" aria-hidden="true">&#9654;</span>':"")+(i===3&&ms.length>4?'<span class="more">+'+(ms.length-4)+"</span>":"")+"</button>").join("")+"</div>":"")+"</article>"};
  if(posts.length){
    h+='<section class="story" aria-label="Our story"><h2 class="st">Our story</h2>'+(chs.length?'<div class="chs" role="group" aria-label="Chapters"><button type="button" class="ch" data-c="" aria-pressed="true">All</button>'+chs.map(c=>'<button type="button" class="ch" data-c="'+esc(c.id)+'" aria-pressed="false">'+esc(c.name)+"</button>").join("")+"</div>":"")+'<div id="posts">'+posts.map(postHtml).join("")+"</div></section>";
  }else if(seq.length){
    h+='<section class="card"><h2>Photos</h2><div class="grid">'+seq.map((p,i)=>'<button data-p="'+i+'" aria-label="Open photo '+(i+1)+'"><img data-id="'+esc(p.id)+'" alt="">'+(byId[p.id]&&byId[p.id].v?'<span class="pb" aria-hidden="true">&#9654;</span>':"")+"</button>").join("")+"</div></section>";
  }
  /* pages published before the story update still carry the old updates list */
  if((d.updates||[]).length&&!posts.length)h+='<section class="card"><h2>Our story</h2><ul class="tl">'+d.updates.map(u=>"<li><small>"+esc(dShort(u.t))+"</small>"+esc(u.txt).replace(/\n/g,"<br>")+"</li>").join("")+"</ul></section>";
  /* Plan */
  if(d.plan){const P=d.plan,pr=P.proposal||{};let b="";
    if(pr.title)b+='<h3 class="sh" style="margin-top:0">'+esc(pr.title)+"</h3>"+kv("The need",pr.need)+kv("What we will make, do or provide",pr.make)+kv("Who benefits",pr.who)+kv("How we will know it worked",pr.success)+(pr.due?'<p class="tg2">Target date: '+esc(fd(pr.due+"T12:00"))+"</p>":"");
    b+=kv("What our community needs",P.community)+kv("What we noticed",P.noticed)+kv("Our chosen idea",P.chosen)+kv("What success looks like",P.successTxt);
    if((P.roles||[]).length)b+='<h3 class="sh">Roles</h3><ul class="pl">'+P.roles.map(r=>"<li><b>"+esc(r.role)+"</b>"+(r.who?" · "+esc(r.who):"")+"</li>").join("")+"</ul>";
    if((P.risks||[]).length)b+='<h3 class="sh">Staying safe</h3><ul class="pl">'+P.risks.map(r=>"<li><b>"+esc(r.risk)+"</b>"+(r.manage?'<br><span class="mu">'+esc(r.manage)+"</span>":"")+"</li>").join("")+"</ul>";
    if(b)h+='<section class="card"><h2>Our plan</h2>'+b+"</section>";
  }
  /* Money */
  if(d.money){h+=moneyBlock(d.money);
    const sp=(d.money.spend||[]).filter(x=>x&&num(x.v)>0),mx=Math.max(1,...sp.map(x=>num(x.v)));
    if(sp.length>1)h+='<section class="card"><h2>Where the money went</h2><div class="bars">'+sp.map(x=>'<div class="r"><span class="n">'+esc(x.l)+'</span><span class="t"><i style="width:'+(num(x.v)/mx*100).toFixed(1)+'%"></i></span><b>'+rands(x.v)+"</b></div>").join("")+"</div></section>";
    const pl=(d.money.planned||[]).filter(x=>x&&x.item);
    if(pl.length)h+='<section class="card"><h2>Planned costs</h2><div class="bars">'+pl.map(x=>'<div class="r" style="grid-template-columns:1fr auto"><span class="n">'+esc(x.item)+"</span><b>"+rands(x.total)+"</b></div>").join("")+"</div></section>";
  }
  /* Wrap-up */
  const L=d.learned;
  if(L){let b="";
    b+=(L.chosen?kv("Our idea and why it matters",L.chosen):"")+kv("What we achieved",L.achieved)+kv("How our result compares with what we planned",L.compare)+kv("How we worked together",L.shared)+kv("What we would change next time",L.change)+(L.completed?kv("Project completed",L.completed):"")+(L.remaining?kv("Work still to do",L.remaining):"");
    if((L.refl||[]).length)b+='<h3 class="sh">What each of us learned</h3>'+L.refl.map(r=>'<blockquote><small>'+esc(r.who)+"</small>"+[r.contrib,r.skill?"Skill: "+r.skill:"",r.challenge?"Challenge: "+r.challenge:""].filter(Boolean).map(x=>esc(x)).join("<br>")+"</blockquote>").join("");
    if(b)h+='<section class="card"><h2>Wrap-up</h2>'+b+"</section>";
  }
  h+="<footer>Made by the production team"+(d.updated?" · Updated "+esc(fd(d.updated)):"")+"<br>Questions about this page? Please contact the school.</footer>";
  app.innerHTML=h;
  const pav=$("#pav");if(pav)pav.append(cleanIcon(d.icon));
  /* chapters filter the story */
  app.querySelectorAll(".ch").forEach(b=>b.onclick=()=>{app.querySelectorAll(".ch").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));const c=b.dataset.c;app.querySelectorAll("#posts .post").forEach(a=>{a.hidden=!!c&&a.dataset.ch!==c})});
  /* lightbox and slideshow */
  let cur=0,timer=0;const lb=$("#lb"),stop=()=>{if(timer){clearInterval(timer);timer=0}},
    show=async i=>{if(!seq.length)return;cur=(i+seq.length)%seq.length;const p=seq[cur],u=await loadImg(p.id);$("#lb-i").src=u||"";$("#lb-i").alt=p.cap||"Production photo";$("#lb-c").textContent=p.cap||"";lb.hidden=false},
    close=()=>{stop();lb.hidden=true};
  app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{stop();show(+b.dataset.p);$("#lb-x").focus()});
  const pl=$("#play");if(pl)pl.onclick=()=>{stop();show(0);$("#lb-x").focus();timer=setInterval(()=>show(cur+1),4500)};
  $("#lb-x").onclick=close;$("#lb-p").onclick=()=>{stop();show(cur-1)};$("#lb-n").onclick=()=>{stop();show(cur+1)};
  lb.onclick=e=>{if(e.target===lb)close()};
  document.onkeydown=e=>{if(lb.hidden)return;if(e.key==="Escape")close();else if(e.key==="ArrowLeft"){stop();show(cur-1)}else if(e.key==="ArrowRight"){stop();show(cur+1)}};
  fillImgs(app);
}
window.addEventListener("hashchange",()=>location.reload());
(async function(){
  if(tok.length<20){app.innerHTML='<p class="err">This showcase link is not complete. Please ask for the link again.</p>';return}
  try{const d=await rpc("ms_showcase_get",{t:tok});
    if(!d||typeof d!=="object"){app.innerHTML='<p class="err">This showcase is not available. It may have been turned off.</p>';return}
    render(d);
  }catch(e){app.innerHTML='<p class="err">Could not load the showcase. Please check your internet and try again.</p>'}
})();
})();
</script>
</body>
