const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

function wireMics(root){root.querySelectorAll("[data-mic]").forEach(b=>{
  const field=b.parentElement.querySelector("textarea,input[type=text]");
  b.onclick=()=>{
    if(listening){listening.stop();return}
    const r=new SR();r.lang=navigator.language||"en-ZA";r.interimResults=true;r.continuous=true;
    const base=field.value?field.value.trimEnd()+" ":"";
    r.onresult=e=>{let t="";for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;field.value=base+t;autosize(field)};
    r.onend=()=>{listening=null;b.classList.remove("on");b.setAttribute("aria-label","Dictate with your voice");if(field.value.trim()&&field.value.trim()!==base.trim())field.dispatchEvent(new CustomEvent("voicedone",{bubbles:true}))};
    r.onerror=e=>toast(e.error==="not-allowed"?"Allow microphone access to dictate.":"Voice stopped: "+e.error);
    listening=r;b.classList.add("on");b.setAttribute("aria-label","Stop dictating");r.start();
  }})}

const dayLabel=t=>{const d=new Date(t),n=new Date(),a=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime(),b=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime(),df=Math.round((b-a)/864e5);return df===0?"Today":df===1?"Yesterday":d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"short"})};
function storyItems(p){
  const it=[];
  p.log.forEach(l=>it.push({t:l.t,k:"log",l}));
  mediaOf(p).filter(m=>m.tag!=="receipt").forEach(m=>it.push({t:m.t,k:"media",m}));
  (p.weeks||[]).forEach(w=>it.push({t:dtOf(w.date,w.id),k:"sess",w}));
  (p.exp||[]).forEach(e=>it.push({t:dtOf(e.date,e.id),k:"exp",e}));
  (p.inc||[]).forEach(e=>it.push({t:dtOf(e.date,e.id),k:"inc",e}));
  if(p.prop&&p.prop.status==="approved"&&p.prop.approvedOn)it.push({t:dtOf(p.prop.approvedOn),k:"approved",p});
  p.goals.forEach(g=>{
    if(g.done&&g.doneAt)it.push({t:g.doneAt,k:"goal",g});
    (g.targets||[]).forEach(tg=>{if(tg.done&&tg.doneAt&&!(g.done&&g.doneAt&&Math.abs(g.doneAt-tg.doneAt)<3000))it.push({t:tg.doneAt,k:"target",g,tg})});

}

/* ---------- v3: talk to the app (voice and typed commands) ---------- */
const STOPW=new Set("the a an to in of for and on at my our please".split(" "));
const normT=s=>String(s||"").toLowerCase().replace(/[^a-z0-9\u00e0-\u00ff\s]/g," ").replace(/\s+/g," ").trim();
const tokOf=s=>normT(s).split(" ").filter(w=>w&&!STOPW.has(w));
const like=(a,b)=>a===b||(a.length>3&&b.length>3&&(a.startsWith(b)||b.startsWith(a)));
function overlapScore(title,q){const A=tokOf(title),B=tokOf(q);if(!A.length||!B.length)return 0;let n=0;B.forEach(w=>{if(A.some(x=>like(x,w)))n++});return n/Math.max(A.length,B.length)}
const cap1=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
function parseCommand(text){
  const raw=normT(text);if(!raw)return{kind:"none"};
  const words=raw.split(" ");let best=null,bs=0;
  prods().forEach(p=>{const nt=tokOf(p.name);if(!nt.length)return;const hit=nt.filter(w=>words.some(x=>like(x,w))).length/nt.length;if(hit>bs){bs=hit;best=p}});
  if(bs<.5)best=null;
  let rest=raw;
  if(best)tokOf(best.name).forEach(w=>{rest=rest.replace(new RegExp("\\b"+w.replace(/[^a-z0-9\u00e0-\u00ff]/g,"")+"\\w*"),"")});
  rest=rest.replace(/\s+/g," ").trim();
  let rr=String(text).toLowerCase();if(best)tokOf(best.name).forEach(w=>{rr=rr.replace(new RegExp("\\b"+w.replace(/[^a-z0-9\u00e0-\u00ff]/g,"")+"\\w*"),"")});
  rr=rr.replace(/^[\s,:;.\-]+/,"").replace(/\s+/g," ").trim();
  const bk=parseBookCommand(rr,best);if(bk)return bk;
  const tick=rest.match(/^(?:target\s+)?(?:tick|ticked|done|finished|finish|completed|complete|check off|mark)\s+(?:the\s+|target\s+|as\s+)?(.+)$/)||rest.match(/^(?:target\s+)?(.+?)\s+(?:is\s+|are\s+)?(?:done|finished|completed|complete)$/);
  if(tick){

const NW={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};
const isNW=w=>w.replace(/-/g," ").split(" ").every(x=>x in NW);
function wordsToNum(t){let total=0,cur=0,found=false;for(const w of t.toLowerCase().replace(/-/g," ").split(/\s+/)){if(w in NW){cur+=NW[w];found=true}else if(w==="hundred"&&found){cur=(cur||1)*100}else if(w==="thousand"&&found){total+=(cur||1)*1000;cur=0}else if(w==="and"&&found){continue}else if(found)break}return found?total+cur:null}
function numFromSpeech(t){const m=String(t).replace(/(\d)\s(?=\d{3}\b)/g,"$1").match(/(\d+(?:[.,]\d{1,2})?)/);if(m)return parseFloat(m[1].replace(",","."));const w=wordsToNum(String(t));return w==null?0:w}
function amountFrom(text){
  const t=String(text).toLowerCase().replace(/(\d)\s(?=\d{3}\b)/g,"$1"),m=t.match(/(?:\br\s*)?(\d+(?:[.,]\d{1,2})?)\s*(?:rands?\b|\br\b)?/);
  if(m)return{amount:parseFloat(m[1].replace(",",".")),rest:(t.slice(0,m.index)+" "+t.slice(m.index+m[0].length)).replace(/\s+/g," ").trim()};
  const ws=t.split(/\s+/);let i=0;while(i<ws.length&&!(isNW(ws[i])||ws[i]==="hundred"||ws[i]==="thousand"))i++;
  if(i<ws.length){let j=i;while(j<ws.length&&(isNW(ws[j])||["hundred","thousand","and"].includes(ws[j])))j++;const v=wordsToNum(ws.slice(i,j).join(" "));if(v!=null)return{amount:v,rest:[...ws.slice(0,i),...ws.slice(j)].join(" ").replace(/\brands?\b/g,"").replace(/\s+/g," ").trim()}}

const titleCase=s=>s.replace(/\b\w/g,c=>c.toUpperCase());
const OPEN_MAP=[[/plan|team|member|roles|ideas|proposal|resources|design/,"plan","team","Plan"],[/work|goals|action|milestone/,"work","plan","Action plan"],[/session|weekly|week/,"work","sess","Weekly records"],[/evidence|completed/,"work","evid","Completed work"],[/expense|spending|spent/,"money","exp","Expenditure"],[/income|sales/,"money","inc","Income"],[/money|budget|finance/,"money","bud","Money"],[/wrap|review|reflection|handover|hand over/,"wrap","rev","Wrap-up"],[/story|diary|updates/,"story","","Story"]];

  prods().forEach(p=>{

function wireKiosk(){
  stopKiosk();
  const ph=S.media.filter(m=>!m.del&&m.type!=="video").sort((a,b)=>b.t-a.t).slice(0,14);let i=0;
  const clock=()=>{const e=$("#k-clock");if(e)e.textContent=new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"})+" · "+tmOf(Date.now())};
  clock();kioskTimers.push(setInterval(clock,15000));
  const show=async()=>{const m=ph[i%ph.length],img=$("#k-img");if(!img||!m)return;const u=await loadMedia(m.id);if(!u)return;img.style.opacity=0;setTimeout(()=>{const cp=$("#k-cap");if(!cp||!img.isConnected)return;img.src=u;img.style.opacity=1;const p=P(m.pid);cp.innerHTML=`<b>${esc(p?p.name:"")}</b>${m.cap?" · "+esc(m.cap):""}`},350);i++};
  if(ph.length){show();kioskTimers.push(setInterval(show,7000))}
  const modes=[...(ph.length?["photo"]:[]),"week",...(prods().some(p=>{const b=bud(p);return b.income||b.spent})?["money"]:[])];let mi=0;
  const setMode=()=>{const pane=$("#k-pane"),pn=$("#k-panel");if(!pane||!pn)return;const k=modes[mi%modes.length];if(k==="photo"){pane.classList.remove("kpanel-on");pn.hidden=true}else{pn.innerHTML=kioskPanel(k);pn.hidden=false;pane.classList.add("kpanel-on")}};
  if(modes.length>1||modes[0]!=="photo"){setMode();if(modes.length>1)kioskTimers.push(setInterval(()=>{mi++;setMode()},12000))}
  kioskTimers.push(setInterval(()=>{if(route==="display"){const y=i;const bars=document.querySelectorAll(".k-card");if(bars.length!==prods().length)render()}},30000));
  const out=()=>{stopKiosk();try{document.fullscreenElement&&document.exitFullscreen()}catch{}nav("more")};
  $("#k-x").onclick=out;
  document.addEventListener("keydown",function k(e){if(route!=="display"){document.removeEventListener("keydown",k);return}if(e.key==="Escape"){document.removeEventListener("keydown",k);out()}});
  if(navigator.wakeLock){navigator.wakeLock.request("screen").then(l=>wakeLock=l).catch(()=>{})}
}
function startKiosk(){try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{})}catch{}nav("display")}

function showUpdate(){if(document.getElementById("upd"))return;const b=document.createElement("div");b.id="upd";b.className="upd";b.setAttribute("role","status");b.innerHTML='<span>A new version is ready.</span><button class="btn small primary" id="upd-go" type="button">Update</button>';document.body.append(b);
  document.getElementById("upd-go").onclick=async()=>{try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));const rg=await navigator.serviceWorker.getRegistrations();await Promise.all(rg.map(g=>g.unregister()))}catch{}location.reload()}}
async function checkUpdate(){try{const r=await fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"});if(!r.ok)return;const t=await r.text(),m=t.match(/const APP_VER="([^"]+)"/);if(!m||m[1]!==APP_VER)showUpdate()}catch{}}

const toNum=v=>{const n=parseFloat(String(v==null?"":v).replace(/\s/g,"").replace(",","."));return isFinite(n)?n:0};

function formSheet({title,fields,data,onSave,onDelete,done}){
  const v=JSON.parse(JSON.stringify(data||{}));
  const fh=f=>{
    const id="f-"+f.k,val=v[f.k];
    if(f.t==="head")return `<h3 class="sub-h">${esc(f.l)}</h3>`;
    if(f.t==="note")return `<p class="hint" style="margin:0 0 8px">${esc(f.l)}</p>`;
    const lab=`<label class="f" for="${id}">${esc(f.l)}</label>`;
    if(f.t==="area")return lab+`<div class="row"><textarea class="t ta" rows="2" id="${id}" placeholder="${esc(f.ph||"")}">${esc(val||"")}</textarea>${micBtn()}</div>`;
    if(f.t==="text")return lab+`<div class="row"><input class="t" id="${id}" type="text" value="${esc(val||"")}" placeholder="${esc(f.ph||"")}">${f.mic===false?"":micBtn()}</div>`+(f.sug?`<div class="chips fsug" data-for="${id}" style="margin-top:8px">${f.sug.map(o=>`<button type="button" class="chip" data-s="${esc(o)}">${esc(o)}</button>`).join("")}</div>`:"");
    if(f.t==="num")return lab+`<div class="row"><input class="t" id="${id}" data-num="1" type="text" inputmode="decimal" value="${val==null?"":esc(val)}" placeholder="${esc(f.ph||"0")}">${micBtn()}</div>`;
    if(f.t==="date")return lab+`<input class="t" id="${id}" type="date" value="${esc(val||"")}">`;
    if(f.t==="select")return lab+`<div class="chips fsel" id="${id}" role="group" aria-label="${esc(f.l)}">${f.o.map(o=>`<button type="button" class="chip" data-v="${esc(o)}" aria-pressed="${val===o}">${esc(o)}</button>`).join("")}</div>`;
    if(f.t==="chips")return lab+(f.o.length?`<div class="chips fmul" id="${id}" role="group" aria-label="${esc(f.l)}">${f.o.map(o=>`<button type="button" class="chip" data-v="${esc(o)}" aria-pressed="${(val||[]).includes(o)}">${esc(o)}</button>`).join("")}</div>`:`<p class="hint">${esc(f.empty||"Add team members first.")}</p>`);
    if(f.t==="switch")return `<div class="row between" style="margin-top:14px"><b>${esc(f.l)}</b><button type="button" role="switch" class="sw" id="${id}" aria-label="${esc(f.l)}" aria-checked="${!!val}"><i></i></button></div>`;
    if(f.t==="photo")return lab+`<div class="row"><button type="button" class="btn small" id="${id}-b">${ic("camera")}${esc(f.btn||"Add photo")}</button><span class="small muted" id="${id}-s">${val?"Photo attached":""}</span></div><input type="file" accept="image/*" id="${id}-f" class="sr" tabindex="-1" aria-label="${esc(f.l)}">`;
    if(f.t==="rows")return lab+`<div id="${id}"></div><button class="btn small" type="button" id="${id}-add" style="margin-top:4px">${ic("plus")}Add row</button>`;
    return "";
  };
  sheet(title,fields.map(fh).join("")+`<p class="err" id="fs-err" role="alert" hidden></p><div class="row" style="margin-top:22px">${onDelete?`<button class="btn danger" id="fs-del" type="button">${ic("trash")}Delete</button>`:""}<span class="grow"></span><button class="btn primary" id="fs-ok" type="button">${esc(done||"Done")}</button></div>`,(d,close)=>{
    wireMics(d);d.querySelectorAll(".ta").forEach(autosize);
    d.addEventListener("voicedone",e=>{const t=e.target;if(t.dataset&&t.dataset.num){const n=numFromSpeech(t.value);t.value=n?String(n):""}});
    d.querySelectorAll(".fsel").forEach(g=>g.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const was=b.getAttribute("aria-pressed")==="true";g.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed",String(!was))}));
    d.querySelectorAll(".fmul .chip").forEach(b=>b.onclick=()=>b.setAttribute("aria-pressed",String(b.getAttribute("aria-pressed")!=="true")));
    d.querySelectorAll(".fsug").forEach(g=>g.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{const i=d.querySelector("#"+g.dataset.for);i.value=b.dataset.s;i.focus()}));
    d.querySelectorAll('.sw[id^="f-"]').forEach(b=>b.onclick=()=>b.setAttribute("aria-checked",String(b.getAttribute("aria-checked")!=="true")));
    fields.filter(f=>f.t==="photo").forEach(f=>{const id="f-"+f.k;d.querySelector("#"+id+"-b").onclick=()=>d.querySelector("#"+id+"-f").click();
      d.querySelector("#"+id+"-f").onchange=async e=>{const ids=await addFilesIds(f.pid,e.target.files,f.tag);if(ids.length){v[f.k]=ids[0];d.querySelector("#"+id+"-s").textContent="Photo attached"}}});
    const rowsState={};
    fields.filter(f=>f.t==="rows").forEach(f=>{
      const id="f-"+f.k;rowsState[f.k]=(v[f.k]||[]).map(r=>({...r}));if(!rowsState[f.k].length)rowsState[f.k].push({});
      const pull=()=>d.querySelectorAll("#"+id+" .frow").forEach((el,i)=>{f.cols.forEach(c=>{rowsState[f.k][i][c.k]=el.querySelector('[data-c="'+c.k+'"]').value})});
      const draw=()=>{d.querySelector("#"+id).innerHTML=rowsState[f.k].map((r,i)=>`<div class="frow">${f.cols.map(c=>`<input class="t" data-c="${c.k}" type="text" value="${esc(r[c.k]||"")}" placeholder="${esc(c.l)}" aria-label="${esc(c.l)} ${i+1}">`).join("")}<button type="button" class="x sm frm" data-i="${i}" aria-label="Remove row ${i+1}">${ic("x")}</button></div>`).join("");
        d.querySelectorAll("#"+id+" .frm").forEach(b=>b.onclick=()=>{pull();rowsState[f.k].splice(+b.dataset.i,1);if(!rowsState[f.k].length)rowsState[f.k].push({});draw()})};
      draw();d.querySelector("#"+id+"-add").onclick=()=>{pull();rowsState[f.k].push({});draw();const ins=d.querySelectorAll("#"+id+" .frow");ins[ins.length-1].querySelector("input").focus()};
      f._pull=pull;
    });
    const err=m=>{const e=d.querySelector("#fs-err");e.textContent=m;e.hidden=!m};
    d.querySelector("#fs-ok").onclick=()=>{
      for(const f of fields){const id="f-"+f.k,el=d.querySelector("#"+id);if(!el&&f.t!=="photo"&&f.t!=="rows")continue;
        if(f.t==="area"||f.t==="text"||f.t==="date")v[f.k]=el.value.trim();
        else if(f.t==="num")v[f.k]=el.value.trim();
        else if(f.t==="select"){const b=el.querySelector('[aria-pressed="true"]');v[f.k]=b?b.dataset.v:""}
        else if(f.t==="chips")v[f.k]=[...el.querySelectorAll('[aria-pressed="true"]')].map(b=>b.dataset.v);
        else if(f.t==="switch")v[f.k]=el.getAttribute("aria-checked")==="true";
        else if(f.t==="rows"){f._pull();v[f.k]=rowsState[f.k].filter(r=>Object.values(r).some(x=>String(x||"").trim()))}
        if(f.req&&!String(v[f.k]==null?"":v[f.k]).trim()){err(f.req===true?"Please fill in "+f.l.toLowerCase()+".":f.req);el&&el.focus&&el.focus();return}
      }
      if(listening)listening.stop();
      if(onSave(v)===false)return;
      close();
    };
    if(onDelete)d.querySelector("#fs-del").onclick=()=>{onDelete();close()};
  });
}
async function addFilesIds(pid,files,tag){
  const ids=[];
  for(const f of files){
    const vid=f.type.startsWith("video/");if(vid&&f.size>MAXVID){toast(`Video too large. Keep clips under ${MAXVID_MB} MB.`);continue}
    const b=vid?f:await toBlob(f);if(!b){toast("Couldn't read that file.");continue}
    const id=uid();try{await mPut(id,b)}catch{toast("No space to store this on the device.");continue}
    S.media.push({id,pid,type:vid?"video":"photo",cap:"",tag:tag||"",t:Date.now(),by:who(),del:false,u:Date.now()});ids.push(id);
  }
  return ids;
}

/* ---------- Work tab ---------- */
function workTab(p){
  const wk=[...p.weeks].sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))),done=[];
  p.goals.forEach(g=>(g.targets||[]).forEach(t=>{if(t.done)done.push({g,t})}));
  done.sort((a,b)=>(b.t.doneAt||0)-(a.t.doneAt||0));
  const nT=p.goals.reduce((a,g)=>a+(g.targets||[]).length,0),dT=done.length;
  const plan=`<div class="row between" style="margin-bottom:10px"><span class="small muted">${p.goals.length} milestone${p.goals.length===1?"":"s"} · ${dT} of ${nT} tasks complete</span><button class="btn small primary" id="addg2">${ic("plus")}Milestone</button></div>${goalsHTML(p,false)}${txtCard(p,"deps","What must happen first and what depends on another task","Tap to write")}`;
  const dots=Array.from({length:9},(_,i)=>`<span class="dot9 ${i<wk.length?"on":""}" aria-hidden="true"></span>`).join("");
  const sess=`<div class="row" style="margin-bottom:10px"><div class="dots9" role="img" aria-label="${wk.length} of 9 weekly records">${dots}</div><span class="small muted grow">${wk.length} of 9 weeks recorded</span></div><div class="bk-list">${wk.map(w=>bkRow("sess:"+w.id,esc(w.label||"Session"),w.spent?rands(toNum(w.spent)):"",`${dShort(w.date)} · ${(w.present||[]).length} present${w.recorder?" · "+esc(w.recorder):""}`)).join("")}</div>${addBtn("sess:new","Record a session")}`;
  const ev=`<p class="small muted" style="margin:0 0 8px">Check the quality of finished tasks and keep evidence: a photo, a sample or feedback.</p>${done.length?`<div class="bk-list">${done.map(({g,t})=>bkRow("evid:"+g.id+"."+t.id,esc(t.title),t.chk?stp(true,"Checked by "+esc(t.chk)):stp(false,"Needs checking"),`${esc(g.title)}${t.doneAt?" · "+dShort(new Date(t.doneAt).toISOString().slice(0,10)):""}`)).join("")}</div>`:`<div class="empty" style="padding:10px 0">Finish a task and it appears here for checking.</div>`}${txtCard(p,"served","Feedback from the people our work served or customers","Tap to write")}`;
  return voiceBar(p,"work")+readyCard(p)+acc(p,"plan","target","Action plan",`${p.goals.length} milestone${p.goals.length===1?"":"s"}`,stp(nT>0&&dT===nT,nT?`${dT}/${nT} done`:"To do"),plan)+
    acc(p,"sess","calendar","Weekly records",`${wk.length} of 9 recorded`,stp(wk.length>0,wk.length?wk.length+" saved":"To do"),sess)+
    acc(p,"evid","check","Completed work and evidence",`${done.filter(x=>x.t.chk).length} of ${dT} checked`,stp(dT>0&&done.every(x=>x.t.chk),dT?`${done.filter(x=>x.t.chk).length}/${dT} checked`:"None yet"),ev);
}

const CPAL=["#e0a020","#2f7fb0","#1f9f78","#c0553d","#7a5ab5","#8a8f98"];
function moneyLine(p,b,print){
  const days=[...new Set([...p.exp,...p.inc].filter(e=>e.date).map(e=>e.date))].sort();
  if(days.length<2)return null;
  const sumTo=(arr,d)=>arr.filter(e=>e.date&&e.date<=d).reduce((x,e)=>x+toNum(e.amount),0);
  const rows=days.map(d=>{const sp=sumTo(p.exp,d),inc=sumTo(p.inc,d);return{d,sp,inc,pf:inc-sp}});

function donutSvg(sl,size=140){

async function exportBook(p){

  p.goals.forEach(g=>(g.targets||[]).forEach(t=>{if(t.ev)ids.add(t.ev)}));
  for(const id of ids)imgs[id]=await blobData(id);
  const html=bookHTML(p,imgs),root=document.createElement("div");
  root.className="ed bookview";root.setAttribute("role","dialog");root.setAttribute("aria-modal","true");root.setAttribute("aria-label","Project book");
  root.innerHTML=`<div class="ed-top"><button class="x" id="bk-x" aria-label="Close project book">${ic("x")}</button><h2>Project book</h2><button class="btn primary small" id="bk-p">${ic("printer")}Print or PDF</button></div><iframe id="bk-f" title="Project book preview" class="bk-frame"></iframe><div class="bk-bar"><button class="btn small" id="bk-d">${ic("download")}Download file</button><span class="small muted">Tip: choose Save as PDF in the print window.</span></div>`;

const BOOK_KEYS=["info","txt","roles","ideas","res","risks","prop","bud","exp","inc","weeks","refl","hand","rev","minfo"];
function weekMoney(p,ds){
  const end=new Date((ds||todayStr())+"T23:59:59").getTime(),start=end-7*864e5+1,at=e=>e.date?new Date(e.date+"T12:00").getTime():0;
  const ex=p.exp.filter(e=>{const t=at(e);return t>=start&&t<=end}),inc=p.inc.filter(e=>{const t=at(e);return t>=start&&t<=end});
  return{spent:ex.reduce((a,e)=>a+toNum(e.amount),0),income:inc.reduce((a,e)=>a+toNum(e.amount),0),receipts:ex.map(e=>e.receipt).filter(Boolean).join(", ")};
}

function scan(){

/* media: photos and videos live in IndexedDB on the device and in the "ms-media" bucket (under the school space) */
const mdb=()=>new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error("no storage"));const r=indexedDB.open("ms-prod-media",1);r.onupgradeneeded=()=>r.result.createObjectStore("media");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const mPut=async(id,b)=>{const d=await mdb();return new Promise((res,rej)=>{const t=d.transaction("media","readwrite");t.objectStore("media").put(b,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})};
const mGet=async id=>{const d=await mdb();return new Promise((res,rej)=>{const q=d.transaction("media").objectStore("media").get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})};
const mDel=async id=>{const d=await mdb();return new Promise(res=>{const t=d.transaction("media","readwrite");t.objectStore("media").delete(id);t.oncomplete=res;t.onerror=res})};

/* ---------- app lock (PIN) ---------- */
const PINK="ms-prod-pin",USERK="ms-prod-user",RESETK="ms-prod-pinreset";
const getPin=()=>{try{const p=JSON.parse(localStorage.getItem(PINK));return p&&p.n===PINLEN?p:null}catch{return null}};
const checkPin=async pin=>{const pk=getPin();return !!pk&&(await hashPin(pin,pk.salt))===pk.h};
async function hashPin(pin,salt){
  const s=salt+":"+pin;
  if(crypto.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}

}
function pinPad({title,sub,cancel,forgot,onDone}){
  document.getElementById("lock")?.remove();
  const l=document.createElement("div");l.id="lock";l.setAttribute("role","dialog");l.setAttribute("aria-modal","true");l.setAttribute("aria-label",title);
  let v="",busy=false,fails=0,until=0;
  const draw=(msg,bad)=>{
    l.innerHTML=`<div class="lk-card"><div class="avatar" style="margin:0 auto;width:64px;height:64px">${ic("lock","lg")}</div><h2 style="margin-top:12px">${esc(title)}</h2>
    <p class="lk-s ${bad?"bad":""}" role="status" aria-live="polite">${esc(msg||sub||"")}</p>
    <div class="lk-dots" aria-hidden="true">${Array.from({length:PINLEN},(_,i)=>i).map(i=>`<i class="${i<v.length?"on":""}"></i>`).join("")}</div>
    <div class="lk-pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-k="${n}">${n}</button>`).join("")}<button class="ghost" tabindex="-1" aria-hidden="true"></button><button type="button" data-k="0">0</button><button type="button" data-k="b" aria-label="Delete last digit">${ic("backspace")}</button></div>
    <p style="margin:14px 0 0">${forgot?`<button class="linkbtn" type="button" id="lk-f">Forgot PIN?</button>`:""}${cancel?`<button class="linkbtn" type="button" id="lk-c">Cancel</button>`:""}</p></div>`;
    l.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>key(b.dataset.k));
    l.querySelector("#lk-f")&&(l.querySelector("#lk-f").onclick=forgot);l.querySelector("#lk-c")&&(l.querySelector("#lk-c").onclick=()=>{l.remove();removeEventListener("keydown",kd)});
  };
  async function key(k){
    if(busy)return;
    if(Date.now()<until){draw("Too many tries. Wait a moment.",true);return}
    if(k==="b")v=v.slice(0,-1);else if(v.length<PINLEN)v+=k;
    if(v.length<PINLEN){draw();return}

    else{fails++;if(fails>=5){until=Date.now()+30000;fails=0}draw(r||"That PIN isn't right.",true);fb("err")}
  }
  const kd=e=>{if(/INPUT|TEXTAREA/.test((e.target&&e.target.tagName)||""))return;if(/^\d$/.test(e.key))key(e.key);else if(e.key==="Backspace")key("b")};
  addEventListener("keydown",kd);draw();document.body.append(l);l.querySelector("[data-k]").focus();
}

function forgotPin(){

  if(document.getElementById("lkreset"))return;

  document.body.append(o);

/* returns [from,to] in ms, or null when the dates still need choosing */
function repRange(k,m){
  const s=new Date();s.setHours(0,0,0,0);const dow=(s.getDay()+6)%7,mon=s.getTime()-dow*864e5,end=new Date();end.setHours(23,59,59,999);const E=end.getTime();
  if(k==="this")return[mon,E];if(k==="last")return[mon-7*864e5,mon-1];
  if(k==="d30")return[E-30*864e5+1,E];
  if(k==="year")return[new Date(s.getFullYear(),0,1).getTime(),E];
  if(k==="term"){const t=getTerm();return t&&t.from<=t.to?[dstart(t.from),Math.min(dend(t.to),E)]:null}
  if(k==="custom")return m&&m.cf&&m.ct&&m.cf<=m.ct?[dstart(m.cf),dend(m.ct)]:null;
  return[E-7*864e5+1,E];
}
const dmy=t=>new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short"});
const dmy2=t=>new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
function repStats(p,from,to){
  const list=p?[p]:prods(),inR=t=>t>=from&&t<=to;
  const items=list.map(q=>({name:q.name,color:q.color,pct:prodPct(q),done:q.goals.filter(g=>g.done&&inR(g.doneAt||0)).length,
    notes:q.log.filter(l=>inR(l.t)).length+q.goals.reduce((a,g)=>a+g.comments.filter(c=>inR(c.t)).length,0),
    photos:S.media.filter(m=>m.pid===q.id&&!m.del&&inR(m.t)).length,spent:(q.exp||[]).filter(e=>e.date&&inR(new Date(e.date+"T12:00").getTime())).reduce((a,e)=>a+toNum(e.amount),0),inc:(q.inc||[]).filter(e=>e.date&&inR(new Date(e.date+"T12:00").getTime())).reduce((a,e)=>a+toNum(e.amount),0),
    hl:[...q.goals.filter(g=>g.done&&inR(g.doneAt||0)).map(g=>({t:g.doneAt,s:"Goal done: "+g.title})),...q.goals.flatMap(g=>(g.targets||[]).filter(t=>t.done&&inR(t.doneAt||0)&&!(g.done&&inR(g.doneAt||0))).map(t=>({t:t.doneAt,s:"Target done: "+t.title+" ("+g.title+")"}))),...q.log.filter(l=>inR(l.t)).map(l=>({t:l.t,s:l.text})),...q.goals.flatMap(g=>g.comments.filter(c=>inR(c.t)).map(c=>({t:c.t,s:g.title+": "+c.text})))]}));
  const sum=k=>items.reduce((a,i)=>a+i[k],0);
  return{from,to,p,items,done:sum("done"),spent:sum("spent"),income:sum("inc"),notes:sum("notes"),photos:sum("photos"),pct:items.length?Math.round(items.reduce((a,i)=>a+i.pct,0)/items.length):0,
    long:(to-from)>8*864e5,hl:items.flatMap(i=>i.hl.map(h=>({...h,n:items.length>1?i.name:""}))).sort((a,b)=>b.t-a.t).slice(0,12)};
}
function repText(st){
  const head=`${st.long?"Progress report":"Weekly update"}, ${dmy2(st.from)} to ${dmy2(st.to)}`;
  const top=st.p?`${st.p.name}: ${st.pct}% complete.`:`All productions: ${st.pct}% complete on average.`;
  const nums=`${st.done} goal${st.done===1?"":"s"} finished, ${st.photos} new photo${st.photos===1?"":"s"} or video${st.photos===1?"":"s"}, ${st.notes} update${st.notes===1?"":"s"}.`;
  const money=(st.spent||st.income)?`Money: spent ${rands(st.spent)}, income ${rands(st.income)}.`:"";
  const hl=st.hl.length?"Highlights:\n"+st.hl.slice(0,st.long?8:4).map(h=>"- "+(h.n?h.n+": ":"")+h.s).join("\n"):"Nothing logged in this period yet.";
  const rows=st.p?"":"\n\n"+st.items.map(i=>`${i.name}: ${i.pct}%`).join("\n");
  return [head,top,nums,money].filter(Boolean).join("\n")+rows+"\n\n"+hl+"\n\nNewberry Middle School Project";
}
async function repCard(st){
  const W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");
  try{await Promise.all([document.fonts.load('700 120px "Bricolage Grotesque"'),document.fonts.load('600 40px "Instrument Sans"')])}catch{}
  const D='"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif',B='"Instrument Sans",system-ui,sans-serif';
  const rr=(x,y,w,h,r)=>{g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()};
  const wrap=(t,x,y,mw,lh,max)=>{const w=t.split(/\s+/);let line="",n=0;for(const word of w){const test=line?line+" "+word:word;if(g.measureText(test).width>mw&&line){if(++n>=max){g.fillText(line+"…",x,y);return y+lh}g.fillText(line,x,y);y+=lh;line=word}else line=test}g.fillText(line,x,y);return y+lh};
  g.fillStyle="#fbf6ec";g.fillRect(0,0,W,H);
  const gr=g.createLinearGradient(0,0,W,520);gr.addColorStop(0,"#c46a0d");gr.addColorStop(1,"#8a4505");g.fillStyle=gr;
  g.beginPath();g.moveTo(0,0);g.lineTo(W,0);g.lineTo(W,440);g.arcTo(W,520,W-80,520,80);g.lineTo(80,520);g.arcTo(0,520,0,440,80);g.closePath();g.fill();
  g.fillStyle="#fff";g.font=`700 42px ${D}`;g.fillText("Newberry Middle School Project",60,100);
  g.globalAlpha=.88;g.font=`500 34px ${B}`;g.fillText(`${st.long?"Progress report":"Weekly update"} · ${st.long?dmy2(st.from)+" to "+dmy2(st.to):dmy(st.from)+" to "+dmy(st.to)}`,60,150);g.globalAlpha=1;
  g.font=`700 84px ${D}`;g.fillText(st.p?st.p.name:"All productions",60,270);
  g.font=`700 190px ${D}`;g.fillText(st.pct+"%",56,450);const nw=g.measureText(st.pct+"%").width;
  g.font=`600 54px ${B}`;g.fillText("complete",56+nw+28,420);
  g.fillStyle="rgba(255,255,255,.3)";rr(60,480,960,14,7);g.fill();g.fillStyle="#fff";rr(60,480,Math.max(14,960*st.pct/100),14,7);g.fill();
  const tile=(x,w,label,val,y=1110)=>{g.fillStyle="#fff";rr(x,y,w,150,26);g.fill();g.strokeStyle="#ece3cf";g.lineWidth=2;g.stroke();g.fillStyle="#6c6250";g.font=`600 28px ${B}`;g.fillText(label,x+28,y+48);g.fillStyle="#221c11";g.font=`700 56px ${D}`;g.fillText(String(val),x+28,y+118)};
  const w3=(960-36)/3;tile(60,w3,"Goals done",st.done);tile(60+w3+18,w3,"Updates",st.notes);tile(60+2*(w3+18),w3,"Photos & video",st.photos);
  if(st.p){
    g.fillStyle="#221c11";g.font=`700 44px ${D}`;g.fillText("Highlights",60,610);let y=670;g.fillStyle="#221c11";g.font=`500 34px ${B}`;
    if(!st.hl.length){g.fillStyle="#6c6250";g.fillText("Nothing logged in this period yet.",60,y)}
    st.hl.slice(0,(st.spent||st.income)?2:4).forEach(h=>{g.fillStyle=st.p.color;g.beginPath();g.arc(72,y-10,9,0,7);g.fill();g.fillStyle="#221c11";y=wrap(h.s,100,y,920,44,2)+22});
  }else{
    const n=st.items.length,money=!!(st.spent||st.income),rh=Math.min(54,(money?310:480)/Math.max(1,n)),fs1=Math.round(Math.min(30,rh*.72));let y=585;
    st.items.forEach(i=>{g.fillStyle="#221c11";g.font=`600 ${fs1}px ${B}`;g.fillText(i.name,60,y+rh*.55);g.fillStyle="#ece3cf";rr(420,y+rh*.55-22,520,18,9);g.fill();g.fillStyle=i.color;rr(420,y+rh*.55-22,Math.max(18,520*i.pct/100),18,9);g.fill();g.fillStyle="#6c6250";g.font=`600 ${Math.min(28,fs1)}px ${B}`;g.textAlign="right";g.fillText(i.pct+"%",1020,y+rh*.55);g.textAlign="left";y+=rh});
  }
  if(st.spent||st.income){
    g.save();const y0=910,mx=Math.max(st.spent,st.income,1),pf=st.income-st.spent;

    const bar=(lab,v,col,yy)=>{g.fillStyle="#6c6250";g.font=`600 26px ${B}`;g.textAlign="left";g.fillText(lab,88,yy+8);g.fillStyle="#ece3cf";rr(214,yy-14,380,22,11);g.fill();g.fillStyle=col;rr(214,yy-14,Math.max(22,380*v/mx),22,11);g.fill();g.fillStyle="#221c11";g.font=`700 26px ${B}`;g.fillText(rands(v),610,yy+8)};
    bar("Income",st.income,"#2f7fb0",y0+100);bar("Spent",st.spent,"#e0a020",y0+144);
    g.textAlign="right";g.fillStyle=pf>=0?"#0b6a4c":"#b3261e";g.font=`700 40px ${D}`;g.fillText(rands(Math.abs(pf)),992,y0+106);g.fillStyle="#6c6250";g.font=`600 24px ${B}`;g.fillText(pf>=0?"Profit":"Loss",992,y0+142);g.restore();
  }

function reportSheet(p){
  const m={k:"last7",cf:"",ct:todayStr(),blob:null,url:null,text:"",msg:"",tok:0};
  const PER=[["last7","7 days"],["this","This week"],["last","Last week"],["d30","30 days"],["term","This term"],["year","This year"],["custom","Custom"]];
  sheet("Report",`<div id="wr"></div>`,(sh,close)=>{
    const root=sh.querySelector("#wr");
    const dates=()=>{
      if(m.k==="term"){const t0=getTerm()||{from:"",to:""},t={from:m.ta!==undefined?m.ta:t0.from,to:m.tb!==undefined?m.tb:t0.to};return`<div class="row" style="margin:-4px 0 14px;align-items:flex-end"><div class="grow"><label class="f" for="d-a" style="margin:0 0 4px">Term starts</label><input class="t" type="date" id="d-a" value="${t.from}"></div><div class="grow"><label class="f" for="d-b" style="margin:0 0 4px">Term ends</label><input class="t" type="date" id="d-b" value="${t.to}"></div></div>`}
      if(m.k==="custom")return`<div class="row" style="margin:-4px 0 14px;align-items:flex-end"><div class="grow"><label class="f" for="d-a" style="margin:0 0 4px">From</label><input class="t" type="date" id="d-a" value="${m.cf}" max="${todayStr()}"></div><div class="grow"><label class="f" for="d-b" style="margin:0 0 4px">To</label><input class="t" type="date" id="d-b" value="${m.ct}" max="${todayStr()}"></div></div>`;
      return"";
    };
    const draw=()=>{
      root.innerHTML=`<div class="chips" role="group" aria-label="Period" style="margin:10px 0 14px">${PER.map(([k,l])=>`<button class="chip" data-k="${k}" aria-pressed="${m.k===k}">${l}</button>`).join("")}</div>${dates()}
      <div class="rep">${m.url?`<img src="${m.url}" alt="Report card">`:`<p class="muted">${esc(m.msg||"Making your card…")}</p>`}</div>
      <label class="f" for="rt">Message</label><textarea class="t" id="rt" rows="8">${esc(m.text)}</textarea>
      <div class="row wr" style="margin-top:14px"><button class="btn primary grow" id="rs" ${m.blob?"":"disabled"}>${ic("share")}Share</button><button class="btn" id="rd" ${m.blob?"":"disabled"}>${ic("download")}Save image</button><button class="btn" id="rc" ${m.text?"":"disabled"}>${ic("copy")}Copy text</button></div>`;
      root.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{m.k=b.dataset.k;build()});
      const da=root.querySelector("#d-a"),db=root.querySelector("#d-b");
      if(da&&db){const ch=()=>{if(m.k==="term"){m.ta=da.value;m.tb=db.value;if(da.value&&db.value)try{localStorage.setItem(TERMK,JSON.stringify({from:da.value,to:db.value}))}catch{}}else{m.cf=da.value;m.ct=db.value}build()};da.onchange=db.onchange=ch}
      root.querySelector("#rt").oninput=e=>{m.text=e.target.value};
      const file=()=>new File([m.blob],"productions-report.png",{type:"image/png"});
      root.querySelector("#rs").onclick=async()=>{try{if(navigator.canShare?.({files:[file()]}))await navigator.share({files:[file()],text:m.text});else if(navigator.share)await navigator.share({text:m.text});else toast("Sharing isn't available here. Use Save image.")}catch{}};
      root.querySelector("#rd").onclick=()=>{const a=document.createElement("a");a.href=m.url;a.download="productions-report.png";a.click()};
      root.querySelector("#rc").onclick=()=>navigator.clipboard.writeText(m.text).then(()=>toast("Copied."),()=>toast("Couldn't copy."));
    };
    const build=async()=>{const tok=++m.tok;m.blob=null;if(m.url){URL.revokeObjectURL(m.url);m.url=null}
      const r=repRange(m.k,m);
      if(!r){m.text="";m.msg=m.k==="term"?"Choose the dates your term starts and ends.":m.cf&&m.ct&&m.cf>m.ct?"The start date must be before the end date.":"Choose the first and last day for your report.";draw();return}
      m.msg="";const st=repStats(p,r[0],r[1]);m.text=repText(st);draw();
      const b=await repCard(st);if(tok!==m.tok)return;m.blob=b;m.url=URL.createObjectURL(b);draw()};
    build();
  });
}

(function(){const ind=document.createElement("div");ind.className="ptr";ind.setAttribute("aria-hidden","true");ind.innerHTML='<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>';document.body.append(ind);
