<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{scroll-padding-bottom:120px}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.5 var(--body);-webkit-font-smoothing:antialiased}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  body{padding-left:var(--rail)}

.s2{grid-column:span 2}.s4{grid-column:1/-1}
.tile.hero{background:linear-gradient(150deg,#c46a0d 0%,#a65608 55%,#8a4505 100%);color:#fff;border-color:transparent;box-shadow:0 12px 36px var(--glow)}
.tile.hero .lbl,.tile.hero .sub{color:rgba(255,255,255,.85)}.tile.hero .lbl .i{color:#fff}
.tile.hero .big{font-size:clamp(3.4rem,13vw,4.6rem)}
.tile.green{background:linear-gradient(160deg,var(--green-soft),var(--sheet) 70%)}
.tile.sky{background:linear-gradient(160deg,var(--sky-soft),var(--sheet) 70%)}
.tile.warm{background:linear-gradient(160deg,var(--accent-soft),var(--sheet) 70%)}
.meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:auto}.meter i{display:block;height:100%;border-radius:99px;background:var(--green);transition:width .4s}
.tile.hero .meter{background:rgba(255,255,255,.3)}.tile.hero .meter i{background:#fff}

.btn:active{transform:scale(.98)}

.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 2px 6px var(--glow-soft),0 6px 22px var(--glow)}
.btn.danger{color:var(--red)}.btn.block{width:100%}.btn.small{padding:6px 14px;min-height:44px;font-size:.92rem;border-radius:13px}

.segc button{border:0;background:none;border-radius:12px;min-height:44px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.segc button[aria-pressed=true]{background:var(--sheet);color:var(--accent);box-shadow:0 2px 10px var(--glow-soft)}
@media (max-width:420px){.segc button span{display:none}}
label.f{display:block;font-weight:600;font-size:.9rem;margin:16px 0 6px}
.err{font-size:.875rem;color:var(--red);margin:6px 0 0}
.t{width:100%;max-width:100%;padding:12px 14px;border:1.5px solid var(--field);border-radius:13px;background:var(--sheet);min-height:48px;font-size:1rem}
.t:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--glow-soft)}
textarea.t{min-height:90px;resize:vertical}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;text-align:left}
input[type=range]{width:100%;height:36px;accent-color:var(--accent)}
.mic{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--field);background:var(--sheet);display:grid;place-items:center;cursor:pointer;flex:none;color:var(--accent)}
.mic.on{background:var(--red);border-color:var(--red);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--glow-soft)}}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--green-soft);color:var(--green);white-space:nowrap}
.pill.type{background:var(--accent-soft);color:var(--accent)}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.hgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (min-width:640px){.hgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.hcard{background:var(--sheet);border:1px solid var(--line);border-radius:24px;padding:14px;box-shadow:var(--shadow);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:stretch;color:inherit;transition:box-shadow .25s,transform .08s}
.hcard:active{transform:scale(.985)}@media (hover:hover){.hcard:hover{box-shadow:0 0 0 4px var(--glow-soft),var(--shadow)}}
.hcard .avatar{width:56px;height:56px;border-radius:18px;background:color-mix(in srgb,var(--pc) 16%,var(--sheet));color:var(--pc)}
.hcard .avatar .i{width:1.7rem;height:1.7rem}
.hcard b{font:700 1.1rem var(--display);letter-spacing:-.02em}
.hcard .meter i{background:var(--pc)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}.list li:first-child{border-top:0}
.empty{text-align:center;padding:26px 12px;color:var(--muted)}.empty .i{color:var(--accent);margin-bottom:8px}.empty h3{color:var(--ink);font-size:1.25rem;margin-bottom:6px}
.goal.done h3{text-decoration:line-through;color:var(--muted)}
.tick{width:32px;height:32px;border-radius:50%;border:2px solid var(--field);background:none;display:grid;place-items:center;flex:none;cursor:pointer;color:transparent;padding:0}
.tick[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 0 0 4px var(--glow-green)}
.cm{border-left:3px solid var(--accent);padding:2px 0 2px 10px;margin:8px 0}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.photos button{padding:0;border:0;background:none;border-radius:16px;overflow:hidden;aspect-ratio:1;cursor:pointer}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--field);background:var(--sheet);border-radius:99px;padding:8px 16px;cursor:pointer;font-weight:500;min-height:44px}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;box-shadow:0 3px 14px var(--glow)}

.swatches{display:flex;flex-wrap:wrap;gap:10px}

.iconpick{display:flex;flex-wrap:wrap;gap:8px}

.iconpick button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.scrim{position:fixed;left:0;right:0;top:0;height:100dvh;background:rgba(25,15,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sheet);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:28px 28px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out;overscroll-behavior:contain}

@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.photos button{position:relative}
.photos video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.vb{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp figure{margin:0;position:relative;border-radius:16px;overflow:hidden;aspect-ratio:1;background:var(--line)}
.cmp img{width:100%;height:100%;object-fit:cover;display:block}
.cmp figcaption{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;border-radius:99px;padding:3px 10px;font-size:.78rem;font-weight:600}

.lk-card{width:100%;max-width:340px;text-align:center;margin:auto}
.lk-s{min-height:1.5em;margin:6px 0 0;color:var(--muted)}.lk-s.bad{color:var(--red);font-weight:600}
.lk-dots{display:flex;gap:14px;justify-content:center;margin:20px 0 24px;min-height:18px}
.lk-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--field);transition:background .15s,box-shadow .2s}

.lk-pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;justify-content:center}
.lk-pad button{width:76px;height:76px;border-radius:50%;border:1.5px solid var(--line);background:var(--sheet);font:600 1.7rem var(--display);cursor:pointer;display:grid;place-items:center}

.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer;padding:10px 4px;min-height:44px}
.rep img{display:block;width:100%;border-radius:18px;box-shadow:var(--shadow)}
.chips .chip{padding:8px 14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* media: photos and videos live in IndexedDB on the device and in the shared "flock-media" bucket (under ms/) */
const mdb=()=>new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error("no storage"));const r=indexedDB.open("ms-prod-media",1);r.onupgradeneeded=()=>r.result.createObjectStore("media");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const mPut=async(id,b)=>{const d=await mdb();return new Promise((res,rej)=>{const t=d.transaction("media","readwrite");t.objectStore("media").put(b,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})};
const mGet=async id=>{const d=await mdb();return new Promise((res,rej)=>{const q=d.transaction("media").objectStore("media").get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})};
const mDel=async id=>{const d=await mdb();return new Promise(res=>{const t=d.transaction("media","readwrite");t.objectStore("media").delete(id);t.oncomplete=res;t.onerror=res})};
const mcache=new Map(),MAXVID=45*1024*1024;
async function loadMedia(id){
  if(mcache.has(id))return mcache.get(id);
  let b=await mGet(id).catch(()=>null);
  if(!b&&user&&sb){const{data}=await sb.storage.from("flock-media").download("ms/"+id).catch(()=>({}));if(data){b=data;mPut(id,b).catch(()=>{})}}
  if(!b)return null;const u=URL.createObjectURL(b);mcache.set(id,u);return u;
}
async function pushMedia(){
  sm.up=sm.up||{};
  for(const m of S.media){
    if(m.del||sm.up[m.id])continue;const b=await mGet(m.id).catch(()=>null);if(!b)continue;
    const{error}=await sb.storage.from("flock-media").upload("ms/"+m.id,b,{upsert:true,contentType:b.type||"application/octet-stream"});
    if(error)throw error;sm.up[m.id]=1;
  }
}
function hydrate(root=document){root.querySelectorAll("[data-mid]").forEach(async el=>{const u=await loadMedia(el.dataset.mid);if(u)el.src=u})}
async function migrateMedia(){let n=0;for(const m of S.media){if(!m.data)continue;try{const b=await (await fetch(m.data)).blob();await mPut(m.id,b);delete m.data;m.type=m.type||"photo";n++}catch{}}if(n){save();if(!isOpen())render()}}
function toBlob(file){return new Promise(res=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(res,"image/jpeg",.75)};im.onerror=()=>res(null);im.src=u})}

let mview="grid";
const mediaOf=p=>S.media.filter(m=>m.pid===p.id&&!m.del).sort((a,b)=>b.t-a.t);
const mthumb=m=>`<button data-m="${m.id}" aria-label="Open ${m.type==="video"?"video":"photo"} ${esc(m.cap||"")}">${m.type==="video"?`<video data-mid="${m.id}" muted playsinline preload="metadata"></video><span class="vb">${ic("play","sm")}</span>`:`<img data-mid="${m.id}" alt="${esc(m.cap||"Photo")}" loading="lazy">`}</button>`;
function weekStart(t){const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}

      Object.entries(g).sort((a,b)=>b[0]-a[0]).map(([w,l])=>`<div class="card"><h2>Week of ${new Date(+w).toLocaleDateString(undefined,{day:"numeric",month:"short"})}</h2><div class="small muted" style="margin:-6px 0 10px">${l.length} item${l.length>1?"s":""}</div><div class="photos">${l.map(mthumb).join("")}</div></div>`).join("");

/* ---------- app lock (PIN) ---------- */
const PINK="ms-prod-pin",USERK="ms-prod-user",RESETK="ms-prod-pinreset";
const getPin=()=>{try{return JSON.parse(localStorage.getItem(PINK))}catch{return null}};
async function hashPin(pin,salt){
  const s=salt+":"+pin;
  if(crypto.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return "d"+h;
}
function pinPad({title,sub,cancel,forgot,onDone}){
  document.getElementById("lock")?.remove();
  const l=document.createElement("div");l.id="lock";l.setAttribute("role","dialog");l.setAttribute("aria-modal","true");l.setAttribute("aria-label",title);
  let v="",busy=false,fails=0,until=0;
  const draw=(msg,bad)=>{
    l.innerHTML=`<div class="lk-card"><div class="avatar" style="margin:0 auto;width:64px;height:64px">${ic("lock","lg")}</div><h2 style="margin-top:12px">${esc(title)}</h2>
    <p class="lk-s ${bad?"bad":""}" role="status" aria-live="polite">${esc(msg||sub||"")}</p>
    <div class="lk-dots" aria-hidden="true">${[0,1,2,3].map(i=>`<i class="${i<v.length?"on":""}"></i>`).join("")}</div>
    <div class="lk-pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-k="${n}">${n}</button>`).join("")}<button class="ghost" tabindex="-1" aria-hidden="true"></button><button type="button" data-k="0">0</button><button type="button" data-k="b" aria-label="Delete last digit">${ic("backspace")}</button></div>
    <p style="margin:14px 0 0">${forgot?`<button class="linkbtn" type="button" id="lk-f">Forgot PIN?</button>`:""}${cancel?`<button class="linkbtn" type="button" id="lk-c">Cancel</button>`:""}</p></div>`;
    l.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>key(b.dataset.k));
    l.querySelector("#lk-f")&&(l.querySelector("#lk-f").onclick=forgot);l.querySelector("#lk-c")&&(l.querySelector("#lk-c").onclick=()=>{l.remove();removeEventListener("keydown",kd)});
  };
  async function key(k){
    if(busy)return;
    if(Date.now()<until){draw("Too many tries. Wait a moment.",true);return}
    if(k==="b")v=v.slice(0,-1);else if(v.length<4)v+=k;
    if(v.length<4){draw();return}
    draw();busy=true;const r=await onDone(v);busy=false;v="";
    if(r==="ok"){l.remove();removeEventListener("keydown",kd)}
    else if(r&&typeof r==="object"){title=r.title;sub=r.sub;draw()}
    else{fails++;if(fails>=5){until=Date.now()+30000;fails=0}draw(r||"That PIN isn't right.",true);navigator.vibrate&&navigator.vibrate(120)}
  }
  const kd=e=>{if(/^\d$/.test(e.key))key(e.key);else if(e.key==="Backspace")key("b")};
  addEventListener("keydown",kd);draw();document.body.append(l);l.querySelector("[data-k]").focus();
}
function lockNow(){
  const pk=getPin();if(!pk||document.getElementById("lock"))return;
  pinPad({title:"Enter your PIN",sub:"MS Productions is locked",forgot:forgotPin,onDone:async pin=>(await hashPin(pin,pk.salt))===pk.h?"ok":"That PIN isn't right."});
}
async function forgotPin(){
  if(!navigator.onLine||!window.supabase){toast("Connect to the internet to reset your PIN.");return}
  if(!confirm("Sign out and sign in again with your staff account to remove the PIN?"))return;
  try{localStorage.setItem(RESETK,"1");localStorage.removeItem(USERK)}catch{}
  document.getElementById("lock")?.remove();user=null;try{await sb.auth.signOut()}catch{}render();
}
function setPin(){
  const salt=uid();let first=null;
  const step=(title,sub)=>pinPad({title,sub,cancel:true,onDone:async pin=>{
    if(!first){first=pin;return{title:"Confirm your PIN",sub:"Enter the same 4 digits again"}}
    if(pin!==first){first=null;return{title:"Choose a PIN",sub:"They didn't match. Try again"}}
    localStorage.setItem(PINK,JSON.stringify({salt,h:await hashPin(pin,salt)}));toast("PIN is on.");render();return"ok"}});
  step("Choose a PIN","4 digits to open the app");
}
function removePinThenSet(){const pk=getPin();pinPad({title:"Enter your PIN",sub:"to change it",cancel:true,onDone:async pin=>{if((await hashPin(pin,pk.salt))!==pk.h)return"That PIN isn't right.";setTimeout(setPin,0);return"ok"}})}
function removePin(){const pk=getPin();pinPad({title:"Enter your PIN",sub:"to turn it off",cancel:true,onDone:async pin=>{if((await hashPin(pin,pk.salt))!==pk.h)return"That PIN isn't right.";localStorage.removeItem(PINK);toast("PIN removed.");render();return"ok"}})}
let hiddenAt=0;
document.addEventListener("visibilitychange",()=>{if(document.hidden)hiddenAt=Date.now();else if(getPin()&&hiddenAt&&Date.now()-hiddenAt>60000)lockNow()});

/* ---------- weekly report card (image + message) ---------- */
function repRange(k){
  const s=new Date();s.setHours(0,0,0,0);const dow=(s.getDay()+6)%7,mon=s.getTime()-dow*864e5,end=new Date();end.setHours(23,59,59,999);
  if(k==="this")return[mon,end.getTime()];if(k==="last")return[mon-7*864e5,mon-1];return[end.getTime()-7*864e5+1,end.getTime()];
}
const dmy=t=>new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short"});
function repStats(p,from,to){
  const list=p?[p]:prods(),inR=t=>t>=from&&t<=to;
  const items=list.map(q=>({name:q.name,color:q.color,pct:prodPct(q),done:q.goals.filter(g=>g.done&&inR(g.doneAt||0)).length,
    notes:q.log.filter(l=>inR(l.t)).length+q.goals.reduce((a,g)=>a+g.comments.filter(c=>inR(c.t)).length,0),
    photos:S.media.filter(m=>m.pid===q.id&&!m.del&&inR(m.t)).length,
    hl:[...q.goals.filter(g=>g.done&&inR(g.doneAt||0)).map(g=>({t:g.doneAt,s:"Done: "+g.title})),...q.log.filter(l=>inR(l.t)).map(l=>({t:l.t,s:l.text})),...q.goals.flatMap(g=>g.comments.filter(c=>inR(c.t)).map(c=>({t:c.t,s:g.title+": "+c.text})))]}));
  const sum=k=>items.reduce((a,i)=>a+i[k],0);
  return{from,to,p,items,done:sum("done"),notes:sum("notes"),photos:sum("photos"),pct:items.length?Math.round(items.reduce((a,i)=>a+i.pct,0)/items.length):0,
    hl:items.flatMap(i=>i.hl.map(h=>({...h,n:items.length>1?i.name:""}))).sort((a,b)=>b.t-a.t).slice(0,4)};
}
function repText(st){
  const head=`Weekly update, ${dmy(st.from)} to ${dmy(st.to)}`;
  const top=st.p?`${st.p.name}: ${st.pct}% complete.`:`All productions: ${st.pct}% complete on average.`;
  const nums=`${st.done} goal${st.done===1?"":"s"} finished, ${st.photos} new photo${st.photos===1?"":"s"} or video${st.photos===1?"":"s"}, ${st.notes} update${st.notes===1?"":"s"}.`;
  const hl=st.hl.length?"Highlights:\n"+st.hl.map(h=>"- "+(h.n?h.n+": ":"")+h.s).join("\n"):"Nothing logged this week yet.";
  const rows=st.p?"":"\n\n"+st.items.map(i=>`${i.name}: ${i.pct}%`).join("\n");
  return [head,top,nums].join("\n")+rows+"\n\n"+hl+"\n\nNewberry Middle School Project";
}
async function repCard(st){
  const W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");
  try{await Promise.all([document.fonts.load('700 120px "Bricolage Grotesque"'),document.fonts.load('600 40px "Instrument Sans"')])}catch{}
  const D='"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif',B='"Instrument Sans",system-ui,sans-serif';
  const rr=(x,y,w,h,r)=>{g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()};
  const wrap=(t,x,y,mw,lh,max)=>{const w=t.split(/\s+/);let line="",n=0;for(const word of w){const test=line?line+" "+word:word;if(g.measureText(test).width>mw&&line){if(++n>=max){g.fillText(line+"…",x,y);return y+lh}g.fillText(line,x,y);y+=lh;line=word}else line=test}g.fillText(line,x,y);return y+lh};
  g.fillStyle="#fbf6ec";g.fillRect(0,0,W,H);
  const gr=g.createLinearGradient(0,0,W,520);gr.addColorStop(0,"#c46a0d");gr.addColorStop(1,"#8a4505");g.fillStyle=gr;
  g.beginPath();g.moveTo(0,0);g.lineTo(W,0);g.lineTo(W,440);g.arcTo(W,520,W-80,520,80);g.lineTo(80,520);g.arcTo(0,520,0,440,80);g.closePath();g.fill();
  g.fillStyle="#fff";g.font=`700 42px ${D}`;g.fillText("Newberry Middle School Project",60,100);
  g.globalAlpha=.88;g.font=`500 34px ${B}`;g.fillText(`Weekly update · ${dmy(st.from)} to ${dmy(st.to)}`,60,150);g.globalAlpha=1;
  g.font=`700 84px ${D}`;g.fillText(st.p?st.p.name:"All productions",60,270);
  g.font=`700 190px ${D}`;g.fillText(st.pct+"%",56,450);const nw=g.measureText(st.pct+"%").width;
  g.font=`600 54px ${B}`;g.fillText("complete",56+nw+28,420);
  g.fillStyle="rgba(255,255,255,.3)";rr(60,480,960,14,7);g.fill();g.fillStyle="#fff";rr(60,480,Math.max(14,960*st.pct/100),14,7);g.fill();
  const tile=(x,w,label,val,y=1110)=>{g.fillStyle="#fff";rr(x,y,w,150,26);g.fill();g.strokeStyle="#ece3cf";g.lineWidth=2;g.stroke();g.fillStyle="#6c6250";g.font=`600 28px ${B}`;g.fillText(label,x+28,y+48);g.fillStyle="#221c11";g.font=`700 56px ${D}`;g.fillText(String(val),x+28,y+118)};
  const w3=(960-36)/3;tile(60,w3,"Goals done",st.done);tile(60+w3+18,w3,"Updates",st.notes);tile(60+2*(w3+18),w3,"Photos & video",st.photos);
  if(st.p){
    g.fillStyle="#221c11";g.font=`700 44px ${D}`;g.fillText("Highlights",60,610);let y=670;g.fillStyle="#221c11";g.font=`500 34px ${B}`;
    if(!st.hl.length){g.fillStyle="#6c6250";g.fillText("Nothing logged this week yet.",60,y)}
    st.hl.forEach(h=>{g.fillStyle=st.p.color;g.beginPath();g.arc(72,y-10,9,0,7);g.fill();g.fillStyle="#221c11";y=wrap(h.s,100,y,920,44,2)+22});
  }else{
    const n=st.items.length,rh=Math.min(54,480/Math.max(1,n));let y=585;
    st.items.forEach(i=>{g.fillStyle="#221c11";g.font=`600 30px ${B}`;g.fillText(i.name,60,y+rh*.55);g.fillStyle="#ece3cf";rr(420,y+rh*.55-22,520,18,9);g.fill();g.fillStyle=i.color;rr(420,y+rh*.55-22,Math.max(18,520*i.pct/100),18,9);g.fill();g.fillStyle="#6c6250";g.font=`600 28px ${B}`;g.textAlign="right";g.fillText(i.pct+"%",1020,y+rh*.55);g.textAlign="left";y+=rh});
  }
  g.fillStyle="#6c6250";g.font=`500 30px ${B}`;g.textAlign="center";g.fillText("Learning by doing, together",W/2,1318);
  return new Promise(r=>c.toBlob(r,"image/png"));
}
function reportSheet(p){
  const m={k:"last7",blob:null,url:null,text:"",edited:false,tok:0};
  sheet("Weekly report",`<div id="wr"></div>`,(sh,close)=>{
    const root=sh.querySelector("#wr");
    const draw=()=>{
      root.innerHTML=`<div class="chips" role="group" aria-label="Period" style="margin:10px 0 14px">${[["last7","Last 7 days"],["this","This week"],["last","Last week"]].map(([k,l])=>`<button class="chip" data-k="${k}" aria-pressed="${m.k===k}">${l}</button>`).join("")}</div>
      <div class="rep">${m.url?`<img src="${m.url}" alt="Weekly report card">`:`<p class="muted">Making your card…</p>`}</div>
      <label class="f" for="rt">Message</label><textarea class="t" id="rt" rows="8">${esc(m.text)}</textarea>
      <div class="row wr" style="margin-top:14px"><button class="btn primary grow" id="rs" ${m.blob?"":"disabled"}>${ic("share")}Share</button><button class="btn" id="rd" ${m.blob?"":"disabled"}>${ic("download")}Save image</button><button class="btn" id="rc">${ic("copy")}Copy text</button></div>`;
      root.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{m.k=b.dataset.k;build()});
      root.querySelector("#rt").oninput=e=>{m.text=e.target.value};
      const file=()=>new File([m.blob],"productions-weekly.png",{type:"image/png"});
      root.querySelector("#rs").onclick=async()=>{try{if(navigator.canShare?.({files:[file()]}))await navigator.share({files:[file()],text:m.text});else if(navigator.share)await navigator.share({text:m.text});else toast("Sharing isn't available here. Use Save image.")}catch{}};
      root.querySelector("#rd").onclick=()=>{const a=document.createElement("a");a.href=m.url;a.download="productions-weekly.png";a.click()};
      root.querySelector("#rc").onclick=()=>navigator.clipboard.writeText(m.text).then(()=>toast("Copied."),()=>toast("Couldn't copy."));
    };
    const build=async()=>{const tok=++m.tok;m.blob=null;if(m.url){URL.revokeObjectURL(m.url);m.url=null}const[f,t]=repRange(m.k),st=repStats(p,f,t);m.text=repText(st);draw();
      const b=await repCard(st);if(tok!==m.tok)return;m.blob=b;m.url=URL.createObjectURL(b);draw()};
    build();
  });
}
