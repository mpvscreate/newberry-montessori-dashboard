<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem("flock-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}try{if(JSON.parse(localStorage.getItem("flock-lock")).hash)document.documentElement.classList.add("locked")}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Newberry Flock</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/flock-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/flock-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/flock-apple-180.png">
<link rel="manifest" href="manifest-flock.webmanifest">
<meta name="theme-color" content="#fbf6ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14110c" media="(prefers-color-scheme: dark)">
<meta name="application-name" content="Newberry Flock">
<meta name="apple-mobile-web-app-title" content="&#x2800;">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap">
<style>
:root{
  --paper:#fbf6ec; --sheet:#ffffff; --ink:#221c11; --muted:#6c6250; --line:#ece3cf; --field:#8f846c;
  --accent:#a65608; --accent-ink:#fff; --accent-soft:#fbe8cc; --accent-2:#e8943a;
  --green:#276b36; --green-soft:#e2f1e3; --red:#b3261e; --red-soft:#fbe5e2; --amber:#8a5a00; --amber-soft:#fbf0d2; --sky:#2a6b8f; --sky-soft:#e0eff6;
  --glow:rgba(166,86,8,.36); --glow-soft:rgba(166,86,8,.16); --glow-green:rgba(39,107,54,.28);
  --shadow:0 1px 2px rgba(70,45,10,.05),0 10px 30px rgba(70,45,10,.07);
  --display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --rail:236px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#14110c; --sheet:#1e1a13; --ink:#f4ecdc; --muted:#b1a68e; --line:#342e22; --field:#7d7258;
  --accent:#f2a54f; --accent-ink:#1d1203; --accent-soft:#3b2a12; --accent-2:#f6c07f;
  --green:#8fd29a; --green-soft:#1f3322; --red:#f4a99d; --red-soft:#3d201c; --amber:#f0c978; --amber-soft:#3a2e14; --sky:#8cc6e4; --sky-soft:#1b2f3a;
  --glow:rgba(242,165,79,.4); --glow-soft:rgba(242,165,79,.2); --glow-green:rgba(143,210,154,.28);   --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#14110c; --sheet:#1e1a13; --ink:#f4ecdc; --muted:#b1a68e; --line:#342e22; --field:#7d7258;
  --accent:#f2a54f; --accent-ink:#1d1203; --accent-soft:#3b2a12; --accent-2:#f6c07f;
  --green:#8fd29a; --green-soft:#1f3322; --red:#f4a99d; --red-soft:#3d201c; --amber:#f0c978; --amber-soft:#3a2e14; --sky:#8cc6e4; --sky-soft:#1b2f3a;
  --glow:rgba(242,165,79,.4); --glow-soft:rgba(242,165,79,.2); --glow-green:rgba(143,210,154,.28);   --shadow:none; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{scroll-padding-bottom:120px}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.5 var(--body);-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-variation-settings:"opsz" 48;letter-spacing:-.025em;line-height:1.08;margin:0;font-weight:700;text-wrap:balance}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px;box-shadow:0 0 0 6px var(--glow-soft)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;left:12px;top:-60px;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;z-index:100;text-decoration:none;font-weight:600}.skip:focus{top:12px}
.i{width:1.25em;height:1.25em;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.22em}
.i.lg{width:1.6em;height:1.6em}.i.xl{width:2.5em;height:2.5em;stroke-width:1.5}.i.sm{width:1em;height:1em}
.muted{color:var(--muted)}.small{font-size:.875rem}
.eyebrow{font:600 .72rem/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 130px}
main:focus{outline:none}
.row{display:flex;align-items:center;gap:12px}.wr{flex-wrap:wrap}.grow{flex:1;min-width:0}.between{justify-content:space-between}

/* header + nav */
header.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
header.top img{width:44px;height:44px;border-radius:12px;object-fit:cover}
header.top h1{font-size:1.45rem}
.page-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}
.page-h h2{font-size:clamp(1.6rem,5vw,2.1rem)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--sheet) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs button{position:relative;flex:1;border:0;background:none;padding:8px 2px;border-radius:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;font-weight:600;cursor:pointer;min-height:56px;transition:box-shadow .25s,background .15s}
nav.tabs button .i{width:1.5rem;height:1.5rem}
nav.tabs button[aria-current=page]{color:var(--accent);background:var(--accent-soft);box-shadow:0 4px 16px var(--glow-soft)}
nav.tabs .dot{position:absolute;top:6px;left:50%;margin-left:8px;width:9px;height:9px;border-radius:50%;background:var(--red)}
@media (min-width:900px){
  body{padding-left:var(--rail)}
  nav.tabs{top:0;right:auto;width:var(--rail);flex-direction:column;gap:4px;border-top:0;border-right:1px solid var(--line);padding:84px 12px 12px}
  nav.tabs button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:1rem;padding:12px 14px;min-height:48px}
  header.top{position:fixed;left:16px;top:16px;margin:0;z-index:21}header.top h1{font-size:1.2rem}
  .wrap{padding-top:28px;padding-bottom:60px}
}
@media (hover:hover){nav.tabs button:hover:not([aria-current]){background:var(--accent-soft);color:var(--accent)}}

/* bento */
.qa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 14px}
.qa button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:84px;padding:12px 6px;border-radius:22px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);font:700 .95rem var(--body);cursor:pointer;box-shadow:var(--shadow);text-align:center;transition:transform .08s,box-shadow .25s}
.qa button:active{transform:scale(.97)}
.qa button.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 2px 6px var(--glow-soft),0 6px 22px var(--glow)}
.qa button small{font:500 .74rem var(--body);opacity:.8}
.qa button.done{border-color:var(--green);color:var(--green)}
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (min-width:720px){.bento{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}}
.tile{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:26px;padding:16px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:6px;min-height:132px;overflow:hidden;color:inherit}
button.tile{cursor:pointer;transition:transform .08s,box-shadow .25s}button.tile:active{transform:scale(.985)}
@media (hover:hover){button.tile:hover{box-shadow:0 0 0 4px var(--glow-soft),var(--shadow)}}
.tile .lbl{display:flex;align-items:center;gap:7px;font-size:.82rem;font-weight:600;color:var(--muted)}
.tile .lbl .i{color:var(--accent)}
.tile .big{font:700 clamp(1.9rem,6vw,2.5rem)/1 var(--display);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.tile .sub{font-size:.82rem;color:var(--muted)}
.s2{grid-column:span 2}.s4{grid-column:1/-1}.r2{grid-row:span 2}
.tile.hero{background:linear-gradient(150deg,#c46a0d 0%,#a65608 55%,#8a4505 100%);color:#fff;border-color:transparent;box-shadow:0 12px 36px var(--glow)}
.tile.hero .lbl,.tile.hero .sub{color:rgba(255,255,255,.85)}.tile.hero .lbl .i{color:#fff}
.tile.hero .big{font-size:clamp(3.4rem,13vw,4.6rem)}
.tile.warm{background:linear-gradient(160deg,var(--accent-soft),var(--sheet) 70%)}
.tile.green{background:linear-gradient(160deg,var(--green-soft),var(--sheet) 70%)}
.tile.sky{background:linear-gradient(160deg,var(--sky-soft),var(--sheet) 70%)}
.tile.alert{background:linear-gradient(160deg,var(--red-soft),var(--sheet) 70%)}
.ringbox{position:relative;width:84px;height:84px;margin-top:auto}
.ringbox .c{position:absolute;inset:0;display:grid;place-items:center;font:700 1.15rem var(--display);letter-spacing:-.02em}
.chip-d{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:600;background:rgba(255,255,255,.2);color:#fff;width:fit-content}
.bars{display:flex;align-items:flex-end;gap:7px;height:78px;margin-top:auto}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.bars i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:rgba(255,255,255,.4);min-height:4px}
.bars div.now i{background:#fff}.bars span{font-size:.65rem;color:rgba(255,255,255,.8)}
.meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:auto}.meter i{display:block;height:100%;border-radius:99px;background:var(--green)}
.meter.low i{background:var(--red)}.meter.mid i{background:var(--accent-2)}

.card{background:var(--sheet);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.card>h2,.card>.row>h2{font-size:1.2rem;margin-bottom:10px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--field);background:var(--sheet);border-radius:15px;padding:11px 18px;font-weight:600;cursor:pointer;min-height:48px;transition:box-shadow .25s,transform .08s,background .15s,border-color .2s}
.btn:active{transform:scale(.98)}
@media (hover:hover){.btn:hover{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow-soft),0 4px 18px var(--glow-soft)}}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 2px 6px var(--glow-soft),0 6px 22px var(--glow)}
.btn.good{background:var(--green-soft);color:var(--green);border-color:transparent}
.btn.danger{color:var(--red)}
.btn.grow{flex:1 1 auto;min-width:max-content}
.btn.small{padding:6px 14px;min-height:44px;font-size:.92rem;border-radius:13px}.btn.block{width:100%}.btn.icon{padding:0;width:44px}
.btn.ghost{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.5);color:#fff}
.btn[disabled]{opacity:.55;box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin-inline:-16px;padding:2px 16px 6px;scrollbar-width:none}.chips.scroll::-webkit-scrollbar{display:none}.chips.scroll .chip{flex:none}
@media (min-width:640px){.chips.scroll{flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0}}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer;padding:10px 4px;min-height:44px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--field);background:var(--sheet);border-radius:99px;padding:8px 16px;cursor:pointer;font-weight:500;min-height:44px;transition:box-shadow .25s,border-color .2s}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;box-shadow:0 3px 14px var(--glow)}
@media (hover:hover){.chip:hover{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow-soft)}}
.segc{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--accent-soft);border-radius:16px;padding:4px;margin-bottom:14px}
.segc button{border:0;background:none;border-radius:12px;min-height:44px;font-weight:600;color:var(--muted);cursor:pointer}
.segc button[aria-pressed=true]{background:var(--sheet);color:var(--accent);box-shadow:0 2px 10px var(--glow-soft)}
label.f{display:block;font-weight:600;font-size:.9rem;margin:16px 0 6px}
.hint{font-size:.85rem;color:var(--muted);margin:4px 0 0}
.err{font-size:.875rem;color:var(--red);margin:6px 0 0;display:flex;gap:6px;align-items:center}
.t{width:100%;max-width:100%;padding:12px 14px;border:1.5px solid var(--field);border-radius:13px;background:var(--sheet);min-height:48px;font-size:1rem}
.t:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--glow-soft)}.t[aria-invalid=true]{border-color:var(--red)}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--field);background:var(--sheet);cursor:pointer;display:grid;place-items:center;flex:none}
.stepper button:active{transform:scale(.94)}
.stepper input{width:100%;text-align:center;font:700 2.3rem var(--display);letter-spacing:-.03em;border:0;background:none;min-width:0}
.total{display:flex;justify-content:space-between;align-items:baseline;background:var(--paper);padding:14px 16px;border-radius:16px;margin:16px 0 12px}
.total b{font:700 1.9rem var(--display);letter-spacing:-.03em}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--green-soft);color:var(--green);white-space:nowrap}
.pill.watch{background:var(--amber-soft);color:var(--amber)}.pill.unwell{background:var(--red-soft);color:var(--red)}.pill.gone{background:var(--line);color:var(--muted)}.pill.type{background:var(--accent-soft);color:var(--accent)}.pill.sky{background:var(--sky-soft);color:var(--sky)}
.warn{display:flex;gap:8px;background:var(--amber-soft);padding:10px 12px;border-radius:12px;font-size:.9rem;margin-top:10px}.warn .i{color:var(--accent);margin-top:2px}

/* lists + hens */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.list li:first-child{border-top:0}.list li .grow{flex:1 1 9rem;overflow-wrap:anywhere}.list li .end{margin-left:auto;text-align:right}
.list li.tap{cursor:pointer;border-radius:12px}
.crop{position:relative;width:min(100%,320px);aspect-ratio:1;margin:12px auto 0;border-radius:24px;overflow:hidden;background:#000;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.crop:active{cursor:grabbing}.crop canvas{width:100%;height:100%;display:block}
.cropring{position:absolute;inset:0;pointer-events:none;border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.85)}
input.zoom{flex:1;min-width:0;accent-color:var(--accent);height:32px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none;overflow:hidden;font:700 1.1rem var(--display)}
.avatar img{width:100%;height:100%;object-fit:cover}.avatar.green{background:var(--green-soft);color:var(--green)}
.amt{font:700 1.1rem var(--display);white-space:nowrap}
.hgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.hgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.hcard{background:var(--sheet);border:1px solid var(--line);border-radius:24px;padding:14px;box-shadow:var(--shadow);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:flex-start;color:inherit;transition:box-shadow .25s,transform .08s}
.hcard:active{transform:scale(.985)}@media (hover:hover){.hcard:hover{box-shadow:0 0 0 4px var(--glow-soft),var(--shadow)}}
.hcard .avatar{width:64px;height:64px;font-size:1.5rem}.hcard b{font:700 1.15rem var(--display);letter-spacing:-.02em}
.empty{text-align:center;padding:26px 12px;color:var(--muted)}.empty .i{color:var(--accent);margin-bottom:8px}.empty h3{color:var(--ink);font-size:1.25rem;margin-bottom:6px}
.task{display:flex;align-items:center;gap:12px;width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:16px;padding:10px 12px;min-height:56px;cursor:pointer;text-align:left;transition:box-shadow .25s,border-color .2s,background .2s}
.task .tick{width:30px;height:30px;border-radius:50%;border:2px solid var(--field);display:grid;place-items:center;flex:none;color:transparent}
.task[aria-pressed=true]{background:var(--green-soft);border-color:transparent}
.task[aria-pressed=true] .tick{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 0 0 4px var(--glow-green)}
.task .tl{flex:1;font-weight:600}.task .tl small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.kgbox{display:flex;align-items:center;gap:6px;margin:6px 0 2px 42px}.kgbox input{width:90px}
.tasks{display:grid;gap:8px}

/* sheet */
.scrim{position:fixed;left:0;right:0;top:0;height:100dvh;background:rgba(25,15,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sheet);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:28px 28px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out;overscroll-behavior:contain}
.sheet:focus{outline:none}.sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}.sheet .hd h2{font-size:1.5rem}
.sheet .foot{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:var(--sheet);padding:12px 0 calc(18px + env(safe-area-inset-bottom));margin-bottom:calc(-18px - env(safe-area-inset-bottom))}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:28px}}
.x{border:0;background:var(--paper);width:44px;height:44px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
#toasts{position:fixed;left:0;right:0;bottom:92px;display:flex;justify-content:center;z-index:60;pointer-events:none;padding:0 12px}
@media (min-width:900px){#toasts{bottom:24px;padding-left:var(--rail)}}
.toast{pointer-events:auto;background:var(--ink);color:var(--paper);padding:12px 12px 12px 18px;border-radius:16px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 28px rgba(0,0,0,.3);max-width:min(92vw,480px);animation:up .2s ease-out}
.toast button{background:none;border:0;color:inherit;font-weight:700;cursor:pointer;padding:10px 12px;border-radius:10px;text-decoration:underline;min-height:44px}

/* fab */
html{overscroll-behavior-y:contain}
#ptr{position:fixed;top:calc(env(safe-area-inset-top,0px) + 4px);left:50%;transform:translate(-50%,-60px);opacity:0;z-index:60;width:44px;height:44px;border-radius:50%;background:var(--sheet);color:var(--accent);border:1px solid var(--line);box-shadow:var(--shadow),0 4px 16px var(--glow-soft);display:grid;place-items:center;pointer-events:none;transition:transform .2s,opacity .2s}
#ptr.ready{background:var(--accent);color:var(--accent-ink)}
#ptr.spin{opacity:1;animation:ptrspin .9s linear infinite}
@keyframes ptrspin{to{rotate:360deg}}
@media (prefers-reduced-motion:reduce){#ptr.spin{animation:none}}
.fab-wrap{position:fixed;left:16px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:30;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
@media (min-width:900px){.fab-wrap{left:calc(var(--rail) + 28px);bottom:28px}}
.fab{width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 5px var(--glow-soft),0 6px 22px var(--glow);transition:transform .2s,box-shadow .25s}
.fab .i{width:24px;height:24px;stroke-width:2}.fab[aria-expanded=true]{transform:rotate(45deg)}
.fab-menu{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.fab-item{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:99px;background:var(--sheet);color:var(--ink);padding:0 20px 0 14px;min-height:52px;font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.25);animation:up .15s ease-out}.fab-item .i{color:var(--accent)}
.fab-scrim{position:fixed;inset:0;z-index:29;background:rgba(25,15,0,.35)}
.note-card{display:flex;gap:10px;background:var(--sky-soft);border-radius:16px;padding:12px 14px;font-size:.88rem;margin-bottom:12px}.note-card .i{color:var(--sky);margin-top:2px}
.gd{background:var(--sheet);border:1px solid var(--line);border-radius:20px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.gd.urgent{border-color:var(--red)}
.gd summary{list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:14px 48px 14px 16px;cursor:pointer;min-height:60px;position:relative}
.gd summary::-webkit-details-marker{display:none}
.gd summary .chv{position:absolute;right:16px;top:50%;margin-top:-.62em;transition:transform .2s;color:var(--muted)}
.gd[open] summary .chv{transform:rotate(90deg)}
.gname{flex-basis:100%;font:700 1.1rem var(--display);letter-spacing:-.02em}
.gbody{padding:0 16px 16px}
.gh{display:flex;gap:8px;align-items:center;font:700 .95rem var(--display);margin:16px 0 6px;color:var(--accent)}
.gbody{max-width:68ch}.gl{margin:0;padding-left:20px}.gl li{margin:5px 0}.gl.vet li::marker{color:var(--red)}
.mthumb{aspect-ratio:4/3;border-radius:20px;overflow:hidden;background:var(--accent-soft)}
.mthumb img,.mthumb video{display:block;width:100%;height:100%;object-fit:cover;background:#000}
.mmiss{height:100%;display:grid;place-content:center;justify-items:center;gap:6px;color:var(--muted);text-align:center;padding:12px}
.pickbox{width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;padding:26px 14px;border:2px dashed var(--field);border-radius:20px;background:var(--paper);color:var(--accent);cursor:pointer}
.pickbox b{color:var(--ink);font:700 1.1rem var(--display)}
@media (hover:hover){.pickbox:hover{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow-soft)}}
.msgprev{background:var(--paper);border-radius:16px;padding:12px 14px;white-space:pre-line;font-size:.95rem;border-left:4px solid var(--green)}
.sync{display:inline-flex;align-items:center;gap:5px;font:600 .8rem var(--body);color:var(--muted);background:none;border:0;cursor:pointer;padding:4px 0;min-height:32px}
.sync.ok{color:var(--green)}.sync.error,.sync.offline{color:var(--red)}
.locked #app,.locked nav.tabs,.locked .fab-wrap{visibility:hidden}
html.privacy #app{filter:blur(22px)}
#lock{position:fixed;inset:0;z-index:120;background:var(--paper);display:flex;align-items:center;justify-content:center;overflow:auto;padding:20px}
#lock[hidden]{display:none}
.lk-card{width:100%;max-width:340px;text-align:center;margin:auto}
.lk-card img{width:72px;height:72px;border-radius:18px}
.lk-s{min-height:1.5em;margin:6px 0 0;color:var(--muted)}.lk-s.bad{color:var(--red);font-weight:600}
.lk-lenrow{display:flex;gap:8px;justify-content:center;margin-top:10px}
.lk-dots{display:flex;gap:14px;justify-content:center;margin:20px 0 24px;min-height:18px}
.lk-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--field);transition:background .15s,box-shadow .2s}
.lk-dots i.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--glow-soft)}
.lk-dots.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.lk-pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;justify-content:center}
.lk-pad button{width:76px;height:76px;border-radius:50%;border:1.5px solid var(--line);background:var(--sheet);font:600 1.7rem var(--display);cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow);transition:box-shadow .25s,transform .08s}
.lk-pad button:active{transform:scale(.94);box-shadow:0 0 0 6px var(--glow-soft)}
.lk-pad .ghost{visibility:hidden;box-shadow:none}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--sheet);color:var(--accent);cursor:pointer;display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.iconbtn[hidden]{display:none}
@media (min-width:900px){header.top .iconbtn{display:none}}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.themeopt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 8px;border:1.5px solid var(--field);border-radius:20px;background:var(--sheet);cursor:pointer;text-align:center;color:var(--ink);transition:box-shadow .25s,border-color .2s}
.themeopt .i{color:var(--accent)}.themeopt b{font:700 1rem var(--display)}
.themeopt[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 4px var(--glow-soft)}
.cbars{display:grid;gap:14px}
.cbar{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline}
.cbar .tr{grid-column:1/-1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.cbar .tr i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent-2),var(--accent))}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<a class="skip" href="#view">Skip to content</a>
<div class="wrap" id="app">
  <header class="top"><img src="newberry-house-logo.webp" alt="" onerror="this.style.display='none'"><div class="grow"><h1>Newberry Flock</h1><div class="small muted"><span id="today"></span> · <button class="sync" id="sync" type="button" aria-label="Cloud sync status"></button></div></div>
    <button class="iconbtn" id="themebtn" type="button"></button>
    <button class="iconbtn" id="lockbtn" type="button" hidden aria-label="Lock the app"><svg class="i" aria-hidden="true"><use href="#i-lock"/></svg></button></header>
  <main id="view" tabindex="-1"></main>
</div>
<nav class="tabs" aria-label="Main"></nav>
<div class="fab-wrap" id="fab-wrap">
  <div class="fab-menu" id="fab-menu" hidden></div>
  <button class="fab" id="fab" aria-label="Quick actions" aria-expanded="false" aria-controls="fab-menu"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg></button>
</div>
<div id="lock" role="dialog" aria-modal="true" aria-labelledby="lk-t" hidden>
  <div class="lk-card">
    <div id="lk-padpanel">
      <img src="icons/flock-192.png" alt="" width="72" height="72">
      <h2 id="lk-t" style="margin-top:12px">Enter your PIN</h2>
      <p class="lk-s" id="lk-s" role="status" aria-live="polite"></p>
      <div class="lk-lenrow" id="lk-lenrow" hidden><button class="chip" data-len="4" type="button">4 digits</button><button class="chip" data-len="6" type="button">6 digits</button></div>
      <div class="lk-dots" id="lk-dots" role="img"></div>
      <div class="lk-pad">
        <button type="button" data-k="1" aria-label="1">1</button><button type="button" data-k="2" aria-label="2">2</button><button type="button" data-k="3" aria-label="3">3</button><button type="button" data-k="4" aria-label="4">4</button><button type="button" data-k="5" aria-label="5">5</button><button type="button" data-k="6" aria-label="6">6</button><button type="button" data-k="7" aria-label="7">7</button><button type="button" data-k="8" aria-label="8">8</button><button type="button" data-k="9" aria-label="9">9</button>
        <button type="button" class="ghost" tabindex="-1" aria-hidden="true"></button>
        <button type="button" data-k="0" aria-label="0">0</button>
        <button type="button" data-k="b" aria-label="Delete the last digit"><svg class="i" aria-hidden="true"><use href="#i-backspace"/></svg></button>
      </div>
      <p style="margin:14px 0 0"><button class="linkbtn" id="lk-forgot" type="button">Forgot PIN?</button><button class="linkbtn" id="lk-cancel" type="button" hidden>Cancel</button></p>
    </div>
    <div id="lk-fp" hidden>
      <h2 id="lk-fpt">Forgot your PIN?</h2><p class="muted" id="lk-fpm"></p>
      <form id="lk-form" novalidate style="text-align:left">
        <label class="f" for="lk-em">Email</label><input id="lk-em" class="t" type="email" autocomplete="username" inputmode="email">
        <label class="f" for="lk-pw">Password</label><input id="lk-pw" class="t" type="password" autocomplete="current-password">
        <p class="err" id="lk-err" role="alert" hidden></p>
        <button class="btn primary block" id="lk-go" style="margin-top:16px">Sign in and remove the PIN</button>
      </form>
      <button class="btn block danger" id="lk-erase" type="button" style="margin-top:12px"></button>
      <button class="linkbtn" id="lk-back" type="button" style="margin-top:6px">Back</button>
    </div>
  </div>
</div>
<div id="layer"></div>
<div id="toasts" aria-live="polite"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" id="sprite"></svg>

const verSig=async()=>{try{const r=await fetch(location.pathname,{method:"HEAD",cache:"no-store"});return r.headers.get("etag")||r.headers.get("last-modified")||r.headers.get("content-length")||""}catch{return""}};

  t.innerHTML=`<span>A new version of the app is ready.</span><button type="button">Update</button>`;
  t.querySelector("button").onclick=()=>location.reload();$("#toasts").replaceChildren(t)}

  if(refreshing)return;refreshing=true;const el=$("#ptr");el.classList.add("spin");el.style.transform="translate(-50%,56px)";
  const t0=Date.now();
  try{await syncNow()}catch{}
  render();

  await new Promise(r=>setTimeout(r,Math.max(0,700-(Date.now()-t0))));
  el.classList.remove("spin");el.style.transform="";el.style.opacity="";refreshing=false;
  if(nv)updateNotice();else{crow();toast(user?"Synced. Everything is up to date.":"Refreshed. You have the latest version.")}
}
(()=>{const el=document.createElement("div");el.id="ptr";el.setAttribute("aria-hidden","true");el.innerHTML=ic("down");document.body.append(el);
  let y0=null,pull=0;const T=70,blocked=()=>document.body.classList.contains("lock")||refreshing;
  addEventListener("touchstart",e=>{y0=(scrollY<=0&&!blocked()&&e.touches.length===1)?e.touches[0].clientY:null;pull=0},{passive:true});
  addEventListener("touchmove",e=>{if(y0===null)return;const dy=e.touches[0].clientY-y0;
    if(dy<=0||scrollY>0){if(pull>0){pull=0;el.style.transform="";el.style.opacity=""}return}
    if(dy>8&&e.cancelable)e.preventDefault();
    pull=Math.min(dy*.5,96);el.style.opacity=Math.min(1,pull/40);el.style.transform=`translate(-50%,${pull-8}px) rotate(${pull>=T/1.4?180:0}deg)`;
    el.classList.toggle("ready",pull>=T/1.4)},{passive:false});
  const end=()=>{if(y0===null)return;const go=pull>=T/1.4;y0=null;el.classList.remove("ready");if(go)refreshApp();else{el.style.transform="";el.style.opacity=""}pull=0};
  addEventListener("touchend",end);addEventListener("touchcancel",end);
})();

  const W=640,H=150,max=Math.max(10,...vals)*1.1,step=W/(vals.length-1||1);

function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.dataset.tab===tab?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
  const cp=checksProgress(today()),dl=minDaysLeft();
  $("#cdot").hidden=!(attention().length||(dl!==null&&dl<S.settings.lowFeedDays));
  document.title=`${TABS.find(t=>t[0]===tab)[1]} · Newberry Flock`;
  const v=$("#view");v.innerHTML=({home,hens,eggs,care,updates,more})[tab]();
  v.querySelectorAll("[data-act]").forEach(el=>el.addEventListener("click",()=>act(el.dataset.act,el.dataset.id,el)));
  v.querySelectorAll("li.tap").forEach(el=>el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();el.click()}}));
  if(tab==="updates")hydrateMedia();
  /* keep the chosen filter visible inside swipeable chip rows */
  v.querySelectorAll(".chips.scroll").forEach(row=>{const on=row.querySelector('[aria-pressed="true"]');if(on&&row.scrollWidth>row.clientWidth)row.scrollLeft=on.offsetLeft-(row.clientWidth-on.offsetWidth)/2});
  const gs=v.querySelector("#gsearch");if(gs)gs.oninput=()=>{guideQ=gs.value;const p=gs.selectionStart;render();const n=$("#gsearch");n.focus();n.setSelectionRange(p,p)};
  v.querySelectorAll("details[data-gid]").forEach(d=>d.addEventListener("toggle",()=>{d.open?guideOpen.add(d.dataset.gid):guideOpen.delete(d.dataset.gid)}));
  v.querySelectorAll("[data-fedkg]").forEach(el=>el.addEventListener("change",()=>setFed(el.dataset.fedkg,el.value)));
  v.querySelectorAll("[data-fedfeed]").forEach(el=>el.addEventListener("change",()=>{const c=checkOf(careDate,el.dataset.fedfeed);setCheck(el.dataset.fedfeed,{feed:el.value});render()}));
  v.querySelectorAll("[data-cnote]").forEach(el=>el.addEventListener("change",()=>setCheck(el.dataset.cnote,{note:el.value.trim()})));
}

function act(a,id){
  const A={
    go:()=>go(id),gofeed:()=>{careSub="feed";go("care")},gosales:()=>{eggSub="sales";go("eggs")},
    logeggs:()=>eggSheet(),sound:()=>{try{localStorage.setItem(SND_KEY,soundOn()?"off":"on")}catch{}render();if(soundOn())cluck(3,.12)},quickcare:()=>quickCare(),sell:()=>sellSheet(),buy:()=>purchaseSheet(),newhen:()=>henForm(),hen:()=>henDetail(id),
    hfst:()=>{henFilter.st=id;render()},
    eggsub:()=>{eggSub=id;render()},caresub:()=>{careSub=id;render()},

function quickCare(){const t=today(),co=S.coops[0].id;careDate=t;const c=checkOf(t,co);

  const kg=c.lastKg||lastKg(co);

const BREEDS=["Rhode Island Red","Sussex","Leghorn","Orpington","Plymouth Rock","Australorp","Boschveld","Koekoek","Bantam","Mixed breed"];
/* hen sounds: a soft synthesised cluck, no audio files */
const SND_KEY="flock-sound",soundOn=()=>{try{return localStorage.getItem(SND_KEY)!=="off"}catch{return true}};
let AC,chickBuf=null,chickLoad=null;
/* the real recording (sounds/chicken.mp3) is played in short slices; the synthesised sounds below are the fallback */
function loadChicken(){
  if(chickLoad||!soundOn())return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    chickLoad=fetch("sounds/chicken.mp3").then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()}).then(ab=>AC.decodeAudioData(ab)).then(b=>{chickBuf=b}).catch(()=>{chickLoad=null})}catch{}
}
function playChicken(from,to){
  if(!chickBuf||!AC)return false;
  try{if(AC.state==="suspended")AC.resume();
    const t=AC.currentTime+.01,dur=Math.min(to,chickBuf.duration)-from,src=AC.createBufferSource(),g=AC.createGain();
    src.buffer=chickBuf;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1,t+.02);g.gain.setValueAtTime(1,t+dur-.1);g.gain.linearRampToValueAtTime(0,t+dur);
    src.connect(g);g.connect(AC.destination);src.start(t,from,dur);return true}catch{return false}
}
let moneyBuf=null,moneyLoad=null;
function loadMoney(){
  if(moneyLoad||!soundOn())return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    moneyLoad=fetch("sounds/money.mp3").then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()}).then(ab=>AC.decodeAudioData(ab)).then(b=>{moneyBuf=b}).catch(()=>{moneyLoad=null})}catch{}
}
/* played when eggs are sold: the recorded cash sound, or two bright tones if it hasn't loaded */
function kaching(){
  if(!soundOn())return;
  loadMoney();
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
    const t=AC.currentTime+.02;
    if(moneyBuf){const src=AC.createBufferSource(),g=AC.createGain();src.buffer=moneyBuf;g.gain.setValueAtTime(1,t);g.gain.setValueAtTime(1,t+moneyBuf.duration-.08);g.gain.linearRampToValueAtTime(0,t+moneyBuf.duration);src.connect(g);g.connect(AC.destination);src.start(t);return}
    [[0,1318.5],[.09,1975.5]].forEach(([d,fr])=>{const o=AC.createOscillator(),g=AC.createGain();o.type="triangle";o.frequency.value=fr;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.25,t+d+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d+.5);o.connect(g);g.connect(AC.destination);o.start(t+d);o.stop(t+d+.52)})
  }catch{}
}
function cluck(n=1,gap=.14){
  if(!soundOn())return;
  loadChicken();if(playChicken(...(n>=3?[1.25,3.1]:[0,.75])))return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
    const t0=AC.currentTime+.02;
    for(let i=0;i<n;i++){const t=t0+i*gap,last=i===n-1&&n>1,o=AC.createOscillator(),fl=AC.createBiquadFilter(),g=AC.createGain(),base=360+Math.random()*70;
      o.type="sawtooth";o.frequency.setValueAtTime(base*(last?2:1.5),t);o.frequency.exponentialRampToValueAtTime(base*.7,t+(last?.16:.09));
      fl.type="bandpass";fl.frequency.value=950;fl.Q.value=2.2;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(last?.26:.2,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+(last?.2:.11));
      o.connect(fl);fl.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.22)}
  }catch{}
}
/* rooster: cock-a-doodle-doo, four sliding notes with a little wobble */
function crow(){
  if(!soundOn())return;
  loadChicken();if(playChicken(3,4.95))return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
    const t0=AC.currentTime+.03;
    const note=(at,f0,f1,dur,vol)=>{const t=t0+at,o=AC.createOscillator(),lfo=AC.createOscillator(),lg=AC.createGain(),a=AC.createBiquadFilter(),b=AC.createBiquadFilter(),g=AC.createGain();
      o.type="sawtooth";o.frequency.setValueAtTime(f0,t);o.frequency.linearRampToValueAtTime(f1,t+dur);
      lfo.frequency.value=26;lg.gain.value=f0*.035;lfo.connect(lg);lg.connect(o.frequency);
      a.type="bandpass";a.frequency.value=1250;a.Q.value=3;b.type="peaking";b.frequency.value=2700;b.gain.value=7;

/* photo framing: the picture is drawn "cover" into a square, then zoomed and shifted; offsets are fractions of the frame */
const cropMax=(img,z)=>{const m=Math.min(img.width,img.height);return[(img.width/m*z-1)/2,(img.height/m*z-1)/2]};
function cropDraw(ctx,img,size,z,ox,oy){
  const base=size/Math.min(img.width,img.height)*z,dw=img.width*base,dh=img.height*base,mx=(dw-size)/2,my=(dh-size)/2;
  ctx.fillStyle="#000";ctx.fillRect(0,0,size,size);
  ctx.drawImage(img,(size-dw)/2+Math.max(-mx,Math.min(mx,ox*size)),(size-dh)/2+Math.max(-my,Math.min(my,oy*size)),dw,dh);
}

async function pull(){
  if(!user||pulling)return;pulling=true;

      let q=sb.from("flock_records").select("kind,id,data,deleted,u,updated_at").order("updated_at",{ascending:true}).limit(1000);
      if(from)q=q.gte("updated_at",from);
      const{data,error}=await q;if(error)throw error;
      if(!data.length)break;
      if(applyRemote(data))changed=true;
      max=data.at(-1).updated_at;if(data.length<1000)break;from=max;
    }
    if(max)sm.lastPull=max;persistSync();
    if(changed){try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}render()}
    if(syncState!=="syncing")setSync("ok");

const EXP_CATS=["Vet & medicine","Bedding & supplies","Equipment","Coop & repairs","Setup: coop & fencing","Setup: hens & chicks","Other"];
const isSetup=c=>/^Setup/.test(c||"");
let profPeriod="month";
const PERIODS=[["month","This month"],["last","Last month"],["d90","90 days"],["all","All time"]];
function periodRange(k){
  const t=today(),d=new Date();
  if(k==="month")return[iso(new Date(d.getFullYear(),d.getMonth(),1)),t];
  if(k==="last")return[iso(new Date(d.getFullYear(),d.getMonth()-1,1)),iso(new Date(d.getFullYear(),d.getMonth(),0))];
  if(k==="d90")return[addDays(t,-89),t];
  return["0000-00-00","9999-12-31"];
}
function periodStats(from,to){
  const inR=d=>d>=from&&d<=to;
  const sales=S.sales.filter(s=>inR(s.date)),income=sum(sales,saleTotal);
  /* feed is counted as it is used (kg fed x your average price per kg); if no feeding is logged, bags count when bought */
  let feed=0,usedAny=false;
  for(const f of S.feeds){
    const kg=sum(Object.entries(S.checks).filter(([d])=>inR(d)),([,cs])=>sum(Object.values(cs),c=>c.fed&&(c.feed===f.id||!c.feed&&f.id===S.feeds[0]?.id)?+c.fed:0));
    const bags=S.purchases.filter(p=>p.feed===f.id),bought=sum(bags,p=>+p.kg||0),paid=sum(bags,p=>+p.cost||0);

const clampM=m=>Math.min(70,Math.max(5,+m||30));
function priceSuggest(cost){
  const st=S.settings,m=clampM(st.targetMargin)/100,step=+st.priceRound||5,d=Math.min(50,Math.max(0,+st.restDiscount||0))/100;
  const ind=ceilTo(cost/(1-m),step),rest=Math.max(Math.round(ind*(1-d)/step)*step,ceilTo(cost*1.05,step));
  return{ind,rest,m,step,d};
}
const marginOf=(price,cost)=>price>0?(price-cost)/price:-1;
function belowCost(price){
  const c=costBasis().cost;if(c===null||!(price>0)||price>=c)return "";
  return `<div class="warn" role="alert">${ic("alert")}<span>${money(price)} is below what a dozen costs you (about ${money(c)}). You’d lose ${money(c-price)} on every dozen.</span></div>`;
}
function costHint(){
  const b=costBasis();if(b.cost===null)return "";
  const sg=priceSuggest(b.cost);
  return `<p class="hint">A dozen costs you about ${money(b.cost)} to produce. For a ${Math.round(sg.m*100)}% margin you’d charge about ${money(sg.ind)}. See Eggs, Profit for details.</p>`;
}
function priceCard(){
  const b=costBasis(),st=S.settings,opt=(k,vals,cur,fmt)=>vals.map(v=>`<button class="chip" style="min-height:40px;padding:4px 14px" data-act="setpm" data-id="${k}:${v}" aria-pressed="${+cur===v}">${fmt(v)}</button>`).join("");
  if(b.cost===null){
    return `<section class="card"><h2>Price check</h2><p class="muted" style="margin:0">To see whether your prices make money, the app needs your costs. Log feed bought in Care, Feed, tick “Fed” with kilograms in Daily checks, and add other costs here. Then it works out what a dozen costs you and suggests prices.</p></section>`;
  }
  const sg=priceSuggest(b.cost),rows=[["ind","Individuals",st.price,sg.ind],["rest","Restaurants",st.priceRest,sg.rest]];
  const row=([k,l,now,sug])=>{
    const mg=marginOf(now,b.cost),ok=now>=sug*0.97,loss=now<b.cost;
    const pill=loss?`<span class="pill unwell">${ic("alert","sm")}Losing ${money(b.cost-now)} a dozen</span>`:ok?`<span class="pill">${ic("check","sm")}On target · ${Math.round(mg*100)}% margin</span>`:`<span class="pill watch">Thin margin · ${Math.round(mg*100)}%</span>`;
    return `<li style="align-items:flex-start"><div class="grow"><b>${l}</b><div class="small muted" style="margin:2px 0 6px">You charge ${money(now)} a dozen</div>${pill}${ok?"":`<div style="margin-top:10px"><button class="btn small primary" data-act="applyprice" data-id="${k}">Charge ${money(sug)} instead</button><div class="small muted" style="margin-top:4px">Suggested for a ${Math.round(sg.m*100)}% margin${k==="rest"?", after the restaurant discount":""}</div></div>`}</div></li>`;
  };
  return `<section class="card"><h2>Price check</h2>
    <p style="margin:0 0 4px">A dozen costs you about <b>${money(b.cost)}</b> to produce.</p>
    <p class="hint" style="margin:0 0 8px">Based on the last ${b.days} day${b.days===1?"":"s"}: ${num(b.dozLaid,1)} dozen laid, ${money(b.costs)} of costs.${b.days<14?" It gets more accurate with more days of data.":" One-off costs, like a big vet bill, raise it for a while."}</p>
    <ul class="list">${rows.map(row).join("")}</ul>
    <details style="margin-top:8px"><summary style="cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center">Pricing settings</summary>
      <div class="eyebrow" style="margin:8px 0 6px">Profit margin I want</div><div class="chips">${opt("m",[20,30,40,50],st.targetMargin,v=>v+"%")}</div>
      <div class="eyebrow" style="margin:12px 0 6px">Restaurant discount</div><div class="chips">${opt("d",[0,10,15,20],st.restDiscount,v=>v+"%")}</div>
      <div class="eyebrow" style="margin:12px 0 6px">Round prices up to the nearest</div><div class="chips">${opt("r",[1,5,10],st.priceRound,v=>"R"+v)}</div>
      <p class="hint">Margin means the share of the price that is profit. A 30% margin on a R70 dozen is R21 profit.</p></details></section>`;
}
function applyPrice(k){
  const b=costBasis();if(b.cost===null)return;const sg=priceSuggest(b.cost),key=k==="ind"?"price":"priceRest",old=S.settings[key],nv=k==="ind"?sg.ind:sg.rest;
  S.settings={...S.settings,[key]:nv};save();render();
  toast(`${k==="ind"?"Individual":"Restaurant"} price is now ${money(nv)} a dozen.`,()=>{S.settings={...S.settings,[key]:old}});
}
function setPriceOpt(spec){
  const[k,v]=spec.split(":"),key={m:"targetMargin",d:"restDiscount",r:"priceRound"}[k];
  S.settings={...S.settings,[key]:+v};save();render();
}

  sheet("Prices & alerts",`<form id="f"><label class="f" for="cn">Coop name</label><input id="cn" class="t" maxlength="40" value="${esc(S.coops[0].name)}"><label class="f" for="p1">Price per dozen, individuals (R)</label><input id="p1" class="t" type="number" inputmode="decimal" step="1" min="0" value="${S.settings.price}">
  <label class="f" for="p2">Price per dozen, restaurants (R)</label><input id="p2" class="t" type="number" inputmode="decimal" step="1" min="0" value="${S.settings.priceRest}">
  ${costHint()}
  <label class="f" for="p3">Warn me when feed will last fewer than (days)</label><input id="p3" class="t" type="number" inputmode="numeric" min="1" value="${S.settings.lowFeedDays}">
  <h3 style="margin-top:22px;font-size:1.1rem">WhatsApp updates</h3>
  <label class="f" for="sg">Sign-off added to every update</label><input id="sg" class="t" maxlength="80" value="${esc(S.settings.signature)}" placeholder="e.g. Newberry Middle School Project">
  <label class="f" for="gl">WhatsApp group or channel link <span class="muted">(optional)</span></label><input id="gl" class="t" type="url" inputmode="url" value="${esc(S.settings.groupLink)}" placeholder="https://chat.whatsapp.com/…"><p class="hint">Adds an “Open our WhatsApp group” button on the Updates screen.</p>
  <div class="foot"><button class="btn primary block">Save</button></div></form>`,(sh,close)=>{
    sh.querySelector("#f").onsubmit=e=>{e.preventDefault();const gl=sh.querySelector("#gl").value.trim();if(gl&&!/^https:\/\//i.test(gl)){toast("The WhatsApp link must start with https://");return}S.coops[0].name=sh.querySelector("#cn").value.trim()||S.coops[0].name;S.settings={...S.settings,price:+sh.querySelector("#p1").value||0,priceRest:+sh.querySelector("#p2").value||0,lowFeedDays:Math.max(1,+sh.querySelector("#p3").value||7),signature:sh.querySelector("#sg").value.trim(),groupLink:gl};save();close();render();toast("Saved.")};
  });
}
function dataSheet(){
  sheet("Backup & data",`<p class="muted" style="margin:6px 0 14px">Everything is stored on this device. A backup lets you move it to another phone or recover it. Photos and videos in Updates stay on this device and aren’t in the backup file.</p>
  <div class="tasks"><button class="btn block" id="bk">${ic("download")}Download backup (JSON)</button><button class="btn block" id="cs">${ic("download")}Export sales (CSV)</button><button class="btn block" id="ce">${ic("download")}Export egg log (CSV)</button><button class="btn block" id="rs">${ic("upload")}Restore from backup</button><button class="btn block danger" id="rm">${ic("trash")}Erase everything</button></div>`,(sh,close)=>{
    sh.querySelector("#bk").onclick=()=>dl("flock-backup-"+today()+".json",JSON.stringify(S),"application/json");
    sh.querySelector("#cs").onclick=()=>csv("flock-sales-"+today()+".csv",[["Date","Customer","Eggs","Price per dozen (ZAR)","Total (ZAR)","Paid"],...S.sales.map(s=>[s.date,custName(s.cust),s.eggs,s.price,saleTotal(s).toFixed(2),s.paid?"yes":"no"])]);
    sh.querySelector("#ce").onclick=()=>csv("flock-eggs-"+today()+".csv",[["Date","Coop","Eggs","Cracked"],...S.eggs.map(e=>[e.date,coopName(e.coop),e.count,e.cracked||0])]);
    sh.querySelector("#rs").onclick=()=>{const i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=async()=>{try{const d=JSON.parse(await i.files[0].text());if(!d.hens||!d.eggs)throw 0;close();confirmSheet("Restore this backup?","This replaces everything currently in the app."+(user?" Cloud sync is on, so it also replaces the shared data for all staff.":""),"Restore",()=>{S={...DEF(),...d};save();render();toast("Backup restored.")})}catch{toast("That file isn’t a Newberry Flock backup.")}};i.click()};
    sh.querySelector("#rm").onclick=()=>{close();confirmSheet("Erase everything?","All hens, eggs, sales and records on this device are deleted. Download a backup first if unsure."+(user?" Cloud sync is on, so this also deletes the shared data for every staff member.":""),"Erase all",()=>{S=DEF();save();mClear().catch(()=>{});mediaCache.forEach((o,k)=>dropMedia(k));render();toast("All data erased.")})};
  });
}
function dl(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function csv(name,rows){dl(name,"﻿"+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n"),"text/csv")}

function sample(){
  S=DEF();S.coops=[{id:"c1",name:"Main coop"}];
  const names=[["Henrietta","Rhode Island Red","c1"],["Pearl","Sussex","c1"],["Daisy","Leghorn","c1"],["Goldie","Orpington","c1"],["Clucky","Boschveld","c1"],["Ginger","Rhode Island Red","c1"],["Mabel","Plymouth Rock","c1"],["Peaches","Koekoek","c1"]];
  S.hens=names.map(([name,breed,coop],i)=>({id:"h"+i,name,breed,coop,born:addDays(today(),-300-i*20),status:"healthy",note:"",photo:null}));
  S.hens[3].status="watch";S.hens[6].status="unwell";
  S.health=[{id:"x1",hen:"h6",type:"illness",text:"Quiet and off her food. Moved to the small pen and checked the comb.",date:addDays(today(),-1)},{id:"x3",hen:"h6",type:"treatment",text:"Electrolytes and probiotic in the water while she recovers",product:"Electrolytes + probiotic",hold:3,holdUntil:addDays(today(),1),date:addDays(today(),-2)},{id:"x2",hen:"h3",type:"checkup",text:"Slightly pale comb. Keep an eye on her this week.",date:addDays(today(),-3)}];
  S.customers=[{id:"k1",type:"restaurant",name:"Blue Door Café",phone:""},{id:"k2",type:"restaurant",name:"Maple Street Diner",phone:""},{id:"k3",type:"individual",name:"Mrs. Naidoo",phone:""}];
  S.feeds=[{id:"f1",name:"Organic layer pellets"}];
  S.purchases=[{id:"p1",date:addDays(today(),-20),feed:"f1",kg:25,cost:410,supplier:"Farm Co-op",organic:true,cert:"ORG-2291"},{id:"p2",date:addDays(today(),-4),feed:"f1",kg:25,cost:420,supplier:"Farm Co-op",organic:true,cert:"ORG-2307"}];
  for(let i=20;i>=0;i--){const d=addDays(today(),-i);
    {const n=S.hens.filter(h=>["healthy","watch"].includes(h.status)&&Math.random()<.82).length;if(n)S.eggs.push({id:uid(),date:d,coop:"c1",count:n,cracked:Math.random()<.25?1:0})}
    S.checks[d]={c1:{fed:1,feed:"f1",water:true,clean:i%3!==0,secure:true,health:i!==0}};
    if(i===0)S.checks[d].c1={fed:1,feed:"f1",water:true};
    if(i%5===0)S.sales.push({id:uid(),date:d,cust:"k1",eggs:12,price:45,paid:i>3});
    if(i%7===0)S.sales.push({id:uid(),date:d,cust:"k3",eggs:6,price:55,paid:true});}
  save();render();toast("Sample data loaded.");
}
