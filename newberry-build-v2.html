<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem("build2-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);else if(t!=="auto")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Newberry Build 2</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/build-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/build-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/build-apple-180.png">
<link rel="manifest" href="manifest-build2.webmanifest">
<meta name="theme-color" content="#fbf6ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14110c" media="(prefers-color-scheme: dark)">
<meta name="application-name" content="Newberry Build 2">
<meta name="apple-mobile-web-app-title" content="&#x2800;">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap">
<style>
/* Copied from newberry-flock.html. Tokens, base, layout, components. Reuse as is; add page-specific rules below it. */
:root{
  --paper:#fbf6ec; --sheet:#ffffff; --ink:#221c11; --muted:#6c6250; --line:#ece3cf; --field:#8f846c;
  --accent:#a65608; --accent-ink:#fff; --accent-soft:#fbe8cc; --accent-2:#e8943a;
  --green:#276b36; --green-soft:#e2f1e3; --red:#b3261e; --red-soft:#fbe5e2; --amber:#8a5a00; --amber-soft:#fbf0d2; --sky:#2a6b8f; --sky-soft:#e0eff6;
  --glow:rgba(166,86,8,.36); --glow-soft:rgba(166,86,8,.16); --glow-green:rgba(39,107,54,.28);
  --shadow:0 1px 2px rgba(70,45,10,.05),0 10px 30px rgba(70,45,10,.07);
  --c1:#1f78b4; --c2:#c4600a;
  --display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --rail:236px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#14110c; --sheet:#1e1a13; --ink:#f4ecdc; --muted:#b1a68e; --line:#342e22; --field:#7d7258;
  --accent:#f2a54f; --accent-ink:#1d1203; --accent-soft:#3b2a12; --accent-2:#f6c07f;
  --green:#8fd29a; --green-soft:#1f3322; --red:#f4a99d; --red-soft:#3d201c; --amber:#f0c978; --amber-soft:#3a2e14; --sky:#8cc6e4; --sky-soft:#1b2f3a;
  --glow:rgba(242,165,79,.4); --glow-soft:rgba(242,165,79,.2); --glow-green:rgba(143,210,154,.28);   --shadow:none; --c1:#3b93de; --c2:#c9701a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#14110c; --sheet:#1e1a13; --ink:#f4ecdc; --muted:#b1a68e; --line:#342e22; --field:#7d7258;
  --accent:#f2a54f; --accent-ink:#1d1203; --accent-soft:#3b2a12; --accent-2:#f6c07f;
  --green:#8fd29a; --green-soft:#1f3322; --red:#f4a99d; --red-soft:#3d201c; --amber:#f0c978; --amber-soft:#3a2e14; --sky:#8cc6e4; --sky-soft:#1b2f3a;
  --glow:rgba(242,165,79,.4); --glow-soft:rgba(242,165,79,.2); --glow-green:rgba(143,210,154,.28);   --shadow:none; --c1:#3b93de; --c2:#c9701a; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{scroll-padding-bottom:120px}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.5 var(--body);-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-variation-settings:"opsz" 48;letter-spacing:-.025em;line-height:1.08;margin:0;font-weight:700;text-wrap:balance}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px;box-shadow:0 0 0 6px var(--glow-soft)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;left:12px;top:-60px;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;z-index:100;text-decoration:none;font-weight:600}.skip:focus{top:12px}
.i{width:1.25em;height:1.25em;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.22em}
.i.lg{width:1.6em;height:1.6em}.i.xl{width:2.5em;height:2.5em;stroke-width:1.5}.i.sm{width:1em;height:1em}
.muted{color:var(--muted)}.small{font-size:.875rem}
.eyebrow{font:600 .72rem/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 130px}
main:focus{outline:none}
.row{display:flex;align-items:center;gap:12px}.wr{flex-wrap:wrap}.grow{flex:1;min-width:0}.between{justify-content:space-between}

/* header + nav */
header.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
header.top img{width:44px;height:44px;border-radius:12px;object-fit:cover}
header.top h1{font-size:1.45rem}
.page-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}
.page-h h2{font-size:clamp(1.6rem,5vw,2.1rem)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--sheet) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs button{position:relative;flex:1;border:0;background:none;padding:8px 2px;border-radius:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;font-weight:600;cursor:pointer;min-height:56px;transition:box-shadow .25s,background .15s}
nav.tabs button .i{width:1.5rem;height:1.5rem}
nav.tabs button[aria-current=page]{color:var(--accent);background:var(--accent-soft);box-shadow:0 4px 16px var(--glow-soft)}
nav.tabs .dot{position:absolute;top:6px;left:50%;margin-left:8px;width:9px;height:9px;border-radius:50%;background:var(--red)}
@media (min-width:900px){
  body{padding-left:var(--rail)}
  nav.tabs{top:0;right:auto;width:var(--rail);flex-direction:column;gap:4px;border-top:0;border-right:1px solid var(--line);padding:84px 12px 12px}
  nav.tabs button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:1rem;padding:12px 14px;min-height:48px}
  header.top{position:fixed;left:16px;top:16px;margin:0;z-index:21}header.top h1{font-size:1.2rem}
  .wrap{padding-top:28px;padding-bottom:60px}
}
@media (hover:hover){nav.tabs button:hover:not([aria-current]){background:var(--accent-soft);color:var(--accent)}}

/* bento */
.qa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 14px}
.qa button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:84px;padding:12px 6px;border-radius:22px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);font:700 .95rem var(--body);cursor:pointer;box-shadow:var(--shadow);text-align:center;transition:transform .08s,box-shadow .25s}
.qa button:active{transform:scale(.97)}
.qa button.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 2px 6px var(--glow-soft),0 6px 22px var(--glow)}
.qa button small{font:500 .74rem var(--body);opacity:1;color:var(--muted)}.qa button.main small{color:inherit;opacity:.92}.qa button.done small{color:var(--green)}
.qa button.done{border-color:var(--green);color:var(--green)}
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (min-width:720px){.bento{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}}
.tile{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:26px;padding:16px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:6px;min-height:132px;overflow:hidden;color:inherit}
button.tile{cursor:pointer;transition:transform .08s,box-shadow .25s}button.tile:active{transform:scale(.985)}
@media (hover:hover){button.tile:hover{box-shadow:0 0 0 4px var(--glow-soft),var(--shadow)}}
.tile .lbl{display:flex;align-items:center;gap:7px;font-size:.82rem;font-weight:600;color:var(--muted)}
.tile .lbl .i{color:var(--accent)}
.tile .big{font:700 clamp(1.9rem,6vw,2.5rem)/1 var(--display);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.tile .sub{font-size:.82rem;color:var(--muted)}
.s2{grid-column:span 2}.s4{grid-column:1/-1}.r2{grid-row:span 2}
.tile.hero{background:linear-gradient(150deg,#a85408 0%,#984c07 55%,#7f4004 100%);color:#fff;border-color:transparent;box-shadow:0 12px 36px var(--glow)}
.tile.hero .lbl,.tile.hero .sub{color:rgba(255,255,255,.93)}.tile.hero .lbl .i{color:#fff}
.tile.hero .big{font-size:clamp(3.4rem,13vw,4.6rem)}
.tile.warm{background:linear-gradient(160deg,var(--accent-soft),var(--sheet) 70%)}
.tile.green{background:linear-gradient(160deg,var(--green-soft),var(--sheet) 70%)}
.tile.sky{background:linear-gradient(160deg,var(--sky-soft),var(--sheet) 70%)}
.tile.alert{background:linear-gradient(160deg,var(--red-soft),var(--sheet) 70%)}
.ringbox{position:relative;width:84px;height:84px;margin-top:auto}
.ringbox .c{position:absolute;inset:0;display:grid;place-items:center;font:700 1.15rem var(--display);letter-spacing:-.02em}
.chip-d{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:600;background:rgba(255,255,255,.2);color:#fff;width:fit-content}
.bars{display:flex;align-items:flex-end;gap:7px;height:78px;margin-top:auto}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.bars i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:rgba(255,255,255,.4);min-height:4px}
.bars div.now i{background:#fff}.bars span{font-size:.65rem;color:rgba(255,255,255,.8)}
.meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:auto}.meter i{display:block;height:100%;border-radius:99px;background:var(--green)}
.meter.low i{background:var(--red)}.meter.mid i{background:var(--accent-2)}

.card{background:var(--sheet);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.card>h2,.card>.row>h2{font-size:1.2rem;margin-bottom:10px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--field);background:var(--sheet);border-radius:15px;padding:11px 18px;font-weight:600;cursor:pointer;min-height:48px;transition:box-shadow .25s,transform .08s,background .15s,border-color .2s}
.btn:active{transform:scale(.98)}
@media (hover:hover){.btn:hover{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow-soft),0 4px 18px var(--glow-soft)}}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 2px 6px var(--glow-soft),0 6px 22px var(--glow)}
.btn.good{background:var(--green-soft);color:var(--green);border-color:transparent}
.btn.danger{color:var(--red)}
.btn.grow{flex:1 1 auto;min-width:max-content}
.btn.small{padding:6px 14px;min-height:44px;font-size:.92rem;border-radius:13px}.btn.block{width:100%}.btn.icon{padding:0;width:44px;flex:none}
.btn.ghost{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.5);color:#fff}
.btn[disabled]{opacity:.55;box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin-inline:-16px;padding:2px 16px 6px;scrollbar-width:none}.chips.scroll::-webkit-scrollbar{display:none}.chips.scroll .chip{flex:none}
@media (min-width:640px){.chips.scroll{flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0}}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer;padding:10px 4px;min-height:44px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--field);background:var(--sheet);border-radius:99px;padding:8px 16px;cursor:pointer;font-weight:500;min-height:44px;transition:box-shadow .25s,border-color .2s}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;box-shadow:0 3px 14px var(--glow)}
@media (hover:hover){.chip:hover{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow-soft)}}
.segc{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--accent-soft);border-radius:16px;padding:4px;margin-bottom:14px}
.segc button{border:0;background:none;border-radius:12px;min-height:44px;font-weight:600;color:var(--muted);cursor:pointer}
.segc button[aria-pressed=true]{background:var(--sheet);color:var(--accent);box-shadow:0 2px 10px var(--glow-soft)}
label.f{display:block;font-weight:600;font-size:.9rem;margin:16px 0 6px}
.hint{font-size:.85rem;color:var(--muted);margin:4px 0 0}
.err{font-size:.875rem;color:var(--red);margin:6px 0 0;display:flex;gap:6px;align-items:center}
.t{width:100%;max-width:100%;padding:12px 14px;border:1.5px solid var(--field);border-radius:13px;background:var(--sheet);min-height:48px;font-size:1rem}
.t:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--glow-soft)}.t[aria-invalid=true]{border-color:var(--red)}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--field);background:var(--sheet);cursor:pointer;display:grid;place-items:center;flex:none}
.stepper button:active{transform:scale(.94)}
.stepper input{width:100%;text-align:center;font:700 2.3rem var(--display);letter-spacing:-.03em;border:0;background:none;min-width:0;min-height:48px}
.total{display:flex;justify-content:space-between;align-items:baseline;background:var(--paper);padding:14px 16px;border-radius:16px;margin:16px 0 12px}
.total b{font:700 1.9rem var(--display);letter-spacing:-.03em}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--green-soft);color:var(--green);white-space:nowrap}
.pill.watch{background:var(--amber-soft);color:var(--amber)}.pill.unwell{background:var(--red-soft);color:var(--red)}.pill.gone{background:var(--line);color:var(--muted)}.pill.type{background:var(--accent-soft);color:color-mix(in srgb,var(--accent) 78%,var(--ink))}.pill.sky{background:var(--sky-soft);color:var(--sky)}
.warn{display:flex;gap:8px;background:var(--amber-soft);padding:10px 12px;border-radius:12px;font-size:.9rem;margin-top:10px}.warn .i{color:var(--accent);margin-top:2px}

/* lists + hens */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:nowrap}
.list li:first-child{border-top:0}.list li .grow{flex:1 1 0;min-width:0;overflow-wrap:anywhere}.list li>.btn,.list li .end,.list li .amt{flex:none}.list li .end{margin-left:auto;text-align:right}
.list li.tap{cursor:pointer;border-radius:12px}
.crop{position:relative;width:min(100%,320px);aspect-ratio:1;margin:12px auto 0;border-radius:24px;overflow:hidden;background:#000;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.crop:active{cursor:grabbing}.crop canvas{width:100%;height:100%;display:block}
.cropring{position:absolute;inset:0;pointer-events:none;border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.85)}
input.zoom{flex:1;min-width:0;accent-color:var(--accent);height:32px}
.chart{display:block;width:100%;height:auto;touch-action:pan-y;overflow:visible}
.chart text{font-family:var(--body);fill:var(--muted);font-size:12px}
.chart .grid{stroke:var(--line);stroke-width:1}.chart .base{stroke:var(--field);stroke-width:1}
.chart .hl{fill:var(--accent-soft);opacity:.55}
.chart .c1{fill:var(--c1)}.chart .c2{fill:var(--c2)}
.chart .pline{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chart .pdot{fill:var(--ink);stroke:var(--sheet);stroke-width:2}
.chart .eb{fill:var(--accent);opacity:.28}.chart .al{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart .adot{fill:var(--accent);stroke:var(--sheet);stroke-width:2}
.chart .val{fill:var(--ink);font-weight:700;font-size:13px}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;margin:2px 0 8px;font-size:.85rem;color:var(--muted)}
.lg span{display:inline-flex;align-items:center;gap:6px}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px}
.lg i.ln{height:3px;width:16px;border-radius:2px}
.chart-read{min-height:2.6em;margin:6px 0 0;font-size:.92rem;line-height:1.35}
.chart-read b{font-weight:700}
table.dt{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:8px}table.dt th,table.dt td{padding:6px 4px;text-align:right;border-top:1px solid var(--line)}table.dt th:first-child,table.dt td:first-child{text-align:left}
details.tv summary{cursor:pointer;color:var(--muted);font-size:.85rem;margin-top:8px;min-height:32px;display:flex;align-items:center}
.list li.rowtap{cursor:pointer}.list li.rowtap:active{opacity:.75}
.streak{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media (max-width:420px){.streak{grid-template-columns:1fr}}
.pop{position:fixed;z-index:90;background:var(--sheet);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 36px rgba(0,0,0,.35);padding:6px;min-width:150px;animation:up .12s ease-out}
.pop button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--ink);font:600 1rem var(--body);padding:0 14px;min-height:48px;border-radius:12px;cursor:pointer;text-align:left}
.pop button:hover,.pop button:focus-visible{background:var(--accent-soft)}.pop button.danger{color:var(--red)}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none;overflow:hidden;font:700 1.2rem var(--display)}
.avatar img{width:100%;height:100%;object-fit:cover}.avatar.green{background:var(--green-soft);color:var(--green)}
.amt{font:700 1.1rem var(--display);white-space:nowrap}
.hgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.hgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.hcard{background:var(--sheet);border:1px solid var(--line);border-radius:24px;padding:14px;box-shadow:var(--shadow);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:flex-start;color:inherit;transition:box-shadow .25s,transform .08s}
.hcard:active{transform:scale(.985)}@media (hover:hover){.hcard:hover{box-shadow:0 0 0 4px var(--glow-soft),var(--shadow)}}
.hcard .avatar{width:64px;height:64px;font-size:1.5rem}.hcard b{font:700 1.15rem var(--display);letter-spacing:-.02em}
.empty{text-align:center;padding:26px 12px;color:var(--muted)}.empty .i{color:var(--accent);margin-bottom:8px}.empty h3{color:var(--ink);font-size:1.25rem;margin-bottom:6px}
.task{display:flex;align-items:center;gap:12px;width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:16px;padding:10px 12px;min-height:56px;cursor:pointer;text-align:left;transition:box-shadow .25s,border-color .2s,background .2s}
.task .tick{width:30px;height:30px;border-radius:50%;border:2px solid var(--field);display:grid;place-items:center;flex:none;color:transparent}
.task[aria-pressed=true]{background:var(--green-soft);border-color:transparent}
.task[aria-pressed=true] .tick{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 0 0 4px var(--glow-green)}
.task .tl{flex:1;font-weight:600}.task .tl small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.kgbox{display:flex;align-items:center;gap:6px;margin:6px 0 2px 42px}.kgbox input{width:90px}
.tasks{display:grid;gap:8px}

/* sheet */

.mtile .more{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;font:700 1.6rem var(--display);z-index:2}
.egrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.egrid.empty{grid-template-columns:1fr}

#lbx{position:fixed;inset:0;z-index:95;background:rgba(8,6,3,.96);display:grid;place-items:center}
#lbx .lb-body{display:grid;place-items:center;width:100%;max-height:78vh}#lbx img,#lbx video{max-width:100vw;max-height:78vh;object-fit:contain;display:block}

function longPress(el,fn){
  let t=null,sx=0,sy=0;
  el.addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY;clearTimeout(t);t=setTimeout(()=>{el._lp=true;buzz(15);fn()},480)});
  const stop=()=>clearTimeout(t);

async function progressCard(){

  x.strokeStyle="#fff";x.beginPath();x.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.max(.001,p));x.stroke();
  x.textAlign="center";x.font=F(700,78);x.fillText(Math.round(p*100)+"%",cx,cy-44);x.textAlign="left";

  lines.forEach((t,i)=>{x.font=F(i?500:700,i?36:46);x.fillText(fit(t,W-420),380,285+i*64)});
  const ids=logsNewest().flatMap(l=>l.media||[]).slice(0,4),pw=484,ph=300;
  for(let i=0;i<4;i++){
    const X=64+(i%2)*(pw+24),Y=620+Math.floor(i/2)*(ph+24);x.save();rr(X,Y,pw,ph,28);x.clip();x.fillStyle="rgba(255,255,255,.1)";x.fillRect(X,Y,pw,ph);
    if(ids[i]){const b=await mGet(ids[i]).catch(()=>null);if(b){try{const bm=await createImageBitmap(b),k=Math.max(pw/bm.width,ph/bm.height),w=bm.width*k,h=bm.height*k;x.drawImage(bm,X+(pw-w)/2,Y+(ph-h)/2,w,h);bm.close?.()}catch{}}}
    else if(i===0){x.fillStyle="rgba(255,255,255,.7)";x.font=F(500,30);x.fillText("Photos will show here",X+28,Y+ph/2-15)}
    x.restore();
  }

  x.font=F(500,34);nextUp().slice(0,3).forEach((n,i)=>{x.fillText(fit("• "+n.title,W-128),64,1330+i*52)});
  x.globalAlpha=.7;x.font=F(500,26);x.fillText("Newberry Build",64,1520);x.globalAlpha=1;

}

      part.forEach(r=>{const m=sm.meta[r.kind+"|"+r.id];if(m){if(r.deleted)m.s="x";else m.s=m.h}})}

      const{error}=await sb.rpc("build_upsert",{p_code:sm.code,p_rows:[{kind:"media",id:mid,data:{d:await blobToData(b)},deleted:false,u:Date.now()}]});if(error)throw error;sm.pendingMedia=sm.pendingMedia.filter(x=>x!==mid)}

function place(row){

  const arr=S[kind];if(!arr)return;const i=arr.findIndex(x=>x.id===id);
  if(deleted){if(i>=0)arr.splice(i,1)}else if(i>=0)arr[i]=data;else arr.push(data);

function applyRemote(rows){
  const touched=[];let cur=recMap();
  for(const row of rows){
    if(row.kind==="media")continue;
    const key=row.kind+"|"+row.id,m=sm.meta[key]||(sm.meta[key]={});
    const dirty=isDirty(key,m,cur),remoteH=row.deleted?"x":hashOf(row.data);
    if(!row.deleted&&m.h===remoteH&&m.s!==remoteH){m.s=remoteH;continue}
    if(m.s===remoteH&&!dirty)continue;
    if(dirty&&row.u<=m.u)continue;

    el.classList.toggle("ready",pull>=T/1.4)},{passive:false});
  const end=()=>{if(y0===null)return;const go=pull>=T/1.4;y0=null;el.classList.remove("ready");if(go)refreshApp();else{el.style.transform="";el.style.opacity=""}pull=0};

function planAddSheet(){
  let file=null,pdf=null,page=1,pages=1,busy=false;
  sheet("Add a plan",`<form id="f" novalidate><p class="muted" style="margin:6px 0 0">Add a floor plan or drawing as a PDF or a picture. A PDF keeps its full sharpness when you zoom in.</p>
  <label class="f" for="pn">Name</label><input id="pn" class="t" maxlength="40" value="${S.plans.length?"":"Floor plan"}" placeholder="For example: Floor plan">
  <div class="photo-add"><button type="button" class="btn" id="pf2">${ic("upload")}Choose file</button><button type="button" class="btn" id="pc2">${ic("camera")}Take photo</button></div>
  <input type="file" id="fi" accept="application/pdf,image/*" hidden><input type="file" id="fc" accept="image/*" capture="environment" hidden>
  <div id="pgbox" hidden style="margin-top:12px"><label class="f" style="margin-top:0">PDF page</label><div class="stepper"><button type="button" data-st="-1" aria-label="Previous page">${ic("minus")}</button><input id="pg" inputmode="numeric" value="1" aria-label="Page number"><button type="button" data-st="1" aria-label="Next page">${ic("plus")}</button></div><p class="hint" id="pgn"></p></div>
  <div class="cardprev" id="pvw" hidden style="margin-top:12px"></div><p class="hint" id="pst"></p>
  <div class="foot"><button class="btn primary block" id="go" disabled>Add plan</button></div></form>`,(sh,close)=>{
    const st=t=>sh.querySelector("#pst").textContent=t,go=sh.querySelector("#go"),pv=sh.querySelector("#pvw");
    const showPrev=async()=>{if(!file)return;busy=true;go.disabled=true;st("Preparing preview…");try{const b=pdf?await pdfPreview(pdf,page,900):file;pv.hidden=false;pv.innerHTML='<img src="'+URL.createObjectURL(b)+'" alt="Preview">';st(fmtMB(file.size)+(pdf?" · "+pages+" page"+(pages===1?"":"s"):""));go.disabled=false}catch(e){st("Could not read that file. Try a different one.")}busy=false};
    const take=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
      if(f.size>40*1048576){st("That file is over 40 MB. Choose a smaller one.");return}
      const isPdf=f.type==="application/pdf"||/\.pdf$/i.test(f.name);
      if(!isPdf&&!/^image\//.test(f.type)){st("Choose a PDF or a picture.");return}
      file=f;pdf=null;sh.querySelector("#pgbox").hidden=true;
      if(isPdf){st("Opening the PDF…");try{const lib=await getPdfLib();pdf=await lib.getDocument({data:await f.arrayBuffer()}).promise;pages=pdf.numPages;page=1;sh.querySelector("#pg").value=1;sh.querySelector("#pgn").textContent=pages+" page"+(pages===1?"":"s")+" in this PDF. Pick the page with the plan.";sh.querySelector("#pgbox").hidden=pages<2}catch{file=null;st("The PDF reader needs an internet connection the first time. Connect, or add a picture of the plan.");return}}
      if(!sh.querySelector("#pn").value.trim())sh.querySelector("#pn").value=f.name.replace(/\.[^.]+$/,"").slice(0,40);
      showPrev()};
    sh.querySelector("#fi").onchange=take;sh.querySelector("#fc").onchange=take;
    sh.querySelector("#pf2").onclick=()=>sh.querySelector("#fi").click();sh.querySelector("#pc2").onclick=()=>sh.querySelector("#fc").click();
    const setPage=n=>{page=Math.max(1,Math.min(pages,n));sh.querySelector("#pg").value=page;showPrev()};
    sh.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>setPage(page+ +b.dataset.st));sh.querySelector("#pg").onchange=e=>setPage(parseInt(e.target.value)||1);
    sh.querySelector("#f").onsubmit=async e=>{e.preventDefault();if(!file||busy)return;const nm=sh.querySelector("#pn");if(!nm.value.trim())return showErr(sh,nm,"Give the plan a name.");
      go.disabled=true;go.textContent="Saving…";
      try{
        let w,h;
        if(pdf){const pg=await pdf.getPage(page),v=pg.getViewport({scale:1});w=v.width;h=v.height}
        else{const bm=await createImageBitmap(file);w=bm.width;h=bm.height;bm.close&&bm.close()}
        const id=uid(),mid="pl"+uid(),big=file.size>8*1048576;
        await mPut(mid,file);if(!big)queueMedia(mid);
        const plan={id,name:nm.value.trim(),media:mid,kind:pdf?"pdf":"img",page:pdf?page:1,w:Math.round(w),h:Math.round(h),size:file.size,...(big?{shared:false}:{})};
        S.plans.push(plan);planSel=id;PV.plan="";PV.had=false;logAct("Added the plan: "+plan.name);save();close();tab="plans";render();
        toast(big?"Plan added. It is large, so it stays on this phone.":"Plan added.")}
      catch(err){go.disabled=false;go.textContent="Add plan";st("Could not save that file. Try a smaller one.")}};
  });
}
function planOptsSheet(){
  const p=planOf(planSel);if(!p)return;
  sheet("Plan options",`<form id="f" novalidate><label class="f" for="pn">Name</label><input id="pn" data-autofocus class="t" maxlength="40" value="${esc(p.name)}">
  <button type="button" class="btn block danger" id="pdl" style="margin-top:16px">${ic("trash")}Delete this plan</button>
  <div class="foot"><button class="btn primary block">Save name</button></div></form>`,(sh,close)=>{
    sh.querySelector("#f").onsubmit=e=>{e.preventDefault();const nm=sh.querySelector("#pn");if(!nm.value.trim())return showErr(sh,nm,"Give the plan a name.");const u=undoEdit(p,{name:nm.value.trim()});save();close();render();toast("Plan renamed.",u)};
    sh.querySelector("#pdl").onclick=()=>{close();const idx=S.plans.indexOf(p);S.plans.splice(idx,1);planSel="";save();render();toast("Plan deleted.",()=>{S.plans.splice(idx,0,p);planSel=p.id})};
  });
}
addEventListener("keydown",e=>{if(e.key==="Escape"&&fullPlan&&!closeSheet&&!document.querySelector(".pop")&&!document.getElementById("lbx")){fullPlan=false;document.body.classList.remove("lock");render()}});
/* ---------- start ---------- */
render();
if(sm.code){setSync("syncing");syncNow()}else setSync("off");
joinFromHash();addEventListener("hashchange",joinFromHash);
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
