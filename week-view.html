<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Weekly progress · Newberry Build</title>
<link rel="icon" href="icons/build-192.png">
<style>
:root{--paper:#fbf6ec;--sheet:#fff;--ink:#2a251d;--muted:#7a6f5d;--line:#e6dcc6;--accent:#c97b1a;--green:#2f8f5b;--red:#c0392b;--amber:#c97b1a;--hero:#e4f3ea;--bar:#e4f3ea}
@media (prefers-color-scheme:dark){:root{--paper:#14110d;--sheet:#1f1b15;--ink:#f3ece0;--muted:#a99d86;--line:#3a3328;--accent:#f0a64c;--green:#4fd1a1;--red:#ff8a7a;--amber:#f0a64c;--hero:#14392d;--bar:#0f3d2e}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;background:var(--bar);color:var(--ink);border-radius:0 0 12px 12px;padding:10px 14px;font-size:.85rem;margin:0 -16px 14px;padding-left:max(16px,env(safe-area-inset-left))}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none}
h1{font-size:1.1rem;margin:4px 0 12px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.hero{background:var(--hero);border-color:transparent;padding:18px}
.eyebrow{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.big{font-size:2rem;font-weight:700;line-height:1.1}
.lead{margin:2px 0 0;color:var(--muted)}
.meter{height:10px;border-radius:99px;background:rgba(127,127,127,.25);overflow:hidden;margin:12px 0 0}.meter i{display:block;height:100%;background:var(--green);border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.stats b{display:block;font-size:1.2rem}.stats span{font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.row{padding:10px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}.row:first-of-type{border-top:0}
.row .g{flex:1;min-width:0}.row .t{font-weight:600}.row .s{font-size:.85rem;color:var(--muted)}.row .d{font-size:.85rem;font-weight:600;color:var(--red);white-space:nowrap}
.day{font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}.day:first-of-type{margin-top:0}
.cmp{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;border-radius:14px;touch-action:pan-y;cursor:ew-resize;background:#000;user-select:none;-webkit-user-select:none}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cmp .h{position:absolute;top:0;bottom:0;left:50%;width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 8px rgba(0,0,0,.5)}
.cmp .h i{position:absolute;top:50%;left:50%;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;background:#fff;color:#222;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.8rem}
.cmp .l{position:absolute;bottom:8px;background:rgba(0,0,0,.6);color:#fff;border-radius:8px;padding:3px 9px;font-size:.75rem;font-weight:600}.cmp .l.a{left:8px}.cmp .l.b{right:8px}
.sl{position:relative;overflow:hidden;border-radius:16px;background:#000;touch-action:pan-y}.sl-t{display:flex;transition:transform .6s cubic-bezier(.4,0,.2,1)}.sl-s{flex:0 0 100%;aspect-ratio:4/3}.sl-s img{width:100%;height:100%;object-fit:cover;display:block}.sl-d{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:6px}.sl-d button{width:8px;height:8px;border-radius:99px;border:0;padding:0;background:rgba(255,255,255,.55);transition:width .3s}.sl-d button[aria-current=true]{background:#fff;width:20px}
@media (prefers-reduced-motion:reduce){.sl-t,.sl-d button{transition:none}}
.sl-lg{position:absolute;top:10px;left:10px;width:17%;max-width:96px;height:auto;z-index:2;pointer-events:none;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
/* photo update: a vertical story with the logo embossed into the page */
:root{--emb:#8a7a5c;--hi:rgba(255,255,255,.9);--lo:rgba(60,45,20,.22)}
@media (prefers-color-scheme:dark){:root{--hi:rgba(255,255,255,.08);--lo:rgba(0,0,0,.7)}}
.emb{aspect-ratio:1;pointer-events:none;filter:drop-shadow(-2px -2px 1px var(--hi)) drop-shadow(2px 2px 2px var(--lo))}
.emb.bg{position:absolute;top:-6px;right:-46px;width:min(82vw,360px);z-index:0}
.emb img{display:block;width:100%;height:100%;opacity:.17;filter:grayscale(1) sepia(.45) contrast(.9)}
@media (prefers-color-scheme:dark){.emb img{filter:grayscale(1) sepia(.3) brightness(.8)}}
main{position:relative;z-index:1}body{overflow-x:clip}
.hd{display:flex;align-items:center;gap:12px;margin:6px 0 14px}.hd img{width:52px;height:52px;flex:none}.hd h1{margin:0;font-size:1.3rem;line-height:1.15}.hd .eyebrow{margin:0 0 3px}
.st{margin:0 0 18px}.st-p{position:relative;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 2px 10px rgba(60,45,20,.14);cursor:zoom-in}.st-p video.ph{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;background:#000}.lbx video{max-width:100%;max-height:100%}.st-p img.ph{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}.st-n{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:99px;padding:2px 10px;font-size:.75rem;font-weight:600}.st-p .sl-lg{top:auto;left:auto;right:10px;bottom:10px;width:15%;max-width:80px}
.st-c{margin:8px 4px 0;font-size:.98rem;line-height:1.4}
.lbx{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;touch-action:pinch-zoom}.lbx img{max-width:100%;max-height:100%;object-fit:contain}.lbx button{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:1.5rem;line-height:1}
.fl{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:26px;color:var(--muted);font-size:.78rem}.fl .emb{width:112px}.fl .emb img{opacity:.28}.hd,.card,.st{position:relative;z-index:1}
.msgc{white-space:pre-wrap;overflow-wrap:anywhere;font-size:1.02rem;line-height:1.45}
.muted{color:var(--muted)}
.msg{text-align:center;padding:60px 10px}
.foot{text-align:center;font-size:.75rem;color:var(--muted);margin-top:18px}
</style>
</head>
<body>
<main id="app"><div class="msg muted">Loading the weekly report…</div></main>
<script>
const FN="https://oikwudpqmbnssttatlhc.supabase.co/functions/v1/build3-share";
const $=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dshort=d=>d?new Date(d+"T12:00").toLocaleDateString("en-ZA",{day:"numeric",month:"short"}):"";
const dday=d=>new Date(d+"T12:00").toLocaleDateString("en-ZA",{weekday:"short",day:"numeric",month:"short"});
const fail=(t,s)=>{$.innerHTML=`<div class="msg"><h1>${esc(t)}</h1><p class="muted">${esc(s)}</p></div>`};
async function load(){
  const t=new URLSearchParams(location.search).get("t")||"";
  if(!/^[a-f0-9]{32}$/.test(t))return fail("This link is not complete","Ask the person who sent it for a new link.");
  let r;try{r=await fetch(FN+"?t="+t,{cache:"no-store"})}catch{return fail("No connection","Check your internet and open the link again.")}
  if(r.status===410||r.status===404)return fail("This link is switched off","It has ended or was turned off. Ask for a new link.");
  if(!r.ok)return fail("Could not load the report","Try again in a moment.");
  draw(await r.json());
}
function drawPhotos(d){
  const dt=new Date(d.created),when=dt.toLocaleDateString("en-ZA",{day:"numeric",month:"long",year:"numeric"}),n=d.photos.length;
  document.title=(d.name||"Newberry Build")+" · Photo update";
  $.innerHTML=`<div class="emb bg" aria-hidden="true"><img src="newberry-logo-stamp.png" alt=""></div><div class="bar"><span class="dot"></span>Photo update from ${esc(d.name)}</div>
  <header class="hd"><img src="newberry-logo-stamp.png" alt=""><div><p class="eyebrow">Photo update · ${esc(when)}</p><h1>${esc(d.name)}</h1></div></header>
  ${d.msg?`<section class="card msgc">${esc(d.msg)}</section>`:""}
  ${d.photos.map((p,i)=>`<figure class="st"><div class="st-p" data-i="${i}" role="button" tabindex="0" aria-label="Open photo ${i+1} full screen">${p.video?`<video class="ph" src="${esc(p.url)}" muted playsinline loop autoplay preload="auto" aria-label="${esc(p.caption||"Site video "+(i+1))}"></video>`:`<img class="ph" src="${esc(p.url)}" alt="${esc(p.caption||"Site photo "+(i+1))}" ${i?'loading="lazy"':""}>`}${n>1?`<span class="st-n">${i+1} of ${n}</span>`:""}${d.logo!==false?`<img class="sl-lg" src="newberry-logo-stamp.png" alt="">`:""}</div>${p.caption?`<figcaption class="st-c">${esc(p.caption)}</figcaption>`:""}</figure>`).join("")}
  <div class="fl"><div class="emb" aria-hidden="true"><img src="newberry-logo-stamp.png" alt=""></div><span>Newberry Build</span></div>`;
  const open=i=>{const o=document.createElement("div");o.className="lbx";o.setAttribute("role","dialog");o.setAttribute("aria-label","Photo "+(i+1)+" of "+n);o.innerHTML=(d.photos[i].video?`<video src="${esc(d.photos[i].url)}" controls autoplay playsinline loop></video>`:`<img src="${esc(d.photos[i].url)}" alt="">`)+`<button type="button" aria-label="Close">&times;</button>`;
    const close=()=>{o.remove();document.removeEventListener("keydown",k)},k=e=>{if(e.key==="Escape")close()};
    o.onclick=close;document.addEventListener("keydown",k);document.body.appendChild(o);o.querySelector("button").focus()};
  document.querySelectorAll(".st-p").forEach(b=>{b.onclick=()=>open(+b.dataset.i);b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open(+b.dataset.i)}}});
}
function draw(d){
  if(d.type==="photos")return drawPhotos(d);
  const h=d.hero,n=h.targets,p=n?Math.round(h.reached/n*100):0,live=d.kind==="live";
  const when=new Date(live?d.updated:d.created).toLocaleString("en-ZA",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  const rows=(a,dd)=>a.map(x=>`<div class="row"><div class="g"><div class="t">${esc(x.title)}</div><div class="s">${esc(x.phase)}</div></div>${dd&&x.due?`<div class="d">${esc(dshort(x.due))}</div>`:""}</div>`).join("");
  const days=[...new Set(d.next.map(x=>x.due))];
  $.innerHTML=`<div class="bar"><span class="dot"></span>${live?"Live view · updated "+esc(when):"Snapshot · "+esc(when)} · read only</div>
  <h1>${esc(d.name)}</h1>
  <section class="card hero"><p class="eyebrow">${esc(dshort(d.from))} to ${esc(dshort(d.to))}</p>
   ${n?`<div class="big">${h.reached} of ${n}</div><p class="lead">weekly targets reached${h.extra?`, plus ${h.extra} extra task${h.extra===1?"":"s"} finished`:""}.</p><div class="meter"><i style="width:${p}%"></i></div>`
   :`<div class="big">${h.done}</div><p class="lead">task${h.done===1?"":"s"} finished this week.</p>`}
   <div class="stats"><div><b>${h.done}</b><span>Done</span></div><div><b>${h.carried}</b><span>Carried over</span></div><div><b>${h.next}</b><span>Next week</span></div></div></section>
  <section class="card"><p class="eyebrow">Reached this week</p>${d.reached.length?rows(d.reached):`<p class="muted" style="margin:0">Nothing was finished this week.</p>`}</section>
  ${d.ba?`<section class="card"><p class="eyebrow">Before and after · ${esc(d.ba.phase)}</p><div class="cmp" id="cmp"><img src="${esc(d.ba.after.url)}" alt="After"><img id="top" src="${esc(d.ba.before.url)}" alt="Before"><div class="h" id="hd"><i>◀ ▶</i></div><span class="l a">Before${d.ba.before.date?" · "+esc(dshort(d.ba.before.date)):""}</span><span class="l b">After${d.ba.after.date?" · "+esc(dshort(d.ba.after.date)):""}</span></div></section>`:""}
  ${d.carried.length||h.late?`<section class="card"><p class="eyebrow">Carried over</p>${rows(d.carried,true)}${h.late?`<p class="muted" style="margin:10px 0 0;font-size:.85rem">${h.late} more task${h.late===1?" is":"s are"} overdue from before this week.</p>`:""}</section>`:""}
  <section class="card"><p class="eyebrow">Next week's targets</p>${d.next.length?days.map(x=>`<div class="day">${esc(dday(x))}</div>${rows(d.next.filter(t=>t.due===x))}`).join(""):`<p class="muted" style="margin:0">No tasks have a due date next week yet.</p>`}</section>
  <p class="foot">Newberry Build · read-only view</p>`;
  const bx=document.getElementById("cmp");
  if(bx){const top=document.getElementById("top"),hd=document.getElementById("hd");
    const set=x=>{x=Math.max(0,Math.min(1,x));top.style.clipPath=`inset(0 ${(1-x)*100}% 0 0)`;hd.style.left=x*100+"%"};set(.5);
    let drag=false;const at=e=>{const r=bx.getBoundingClientRect();set((e.clientX-r.left)/r.width)};
    bx.addEventListener("pointerdown",e=>{drag=true;bx.setPointerCapture(e.pointerId);at(e)});bx.addEventListener("pointermove",e=>{if(drag)at(e)});["pointerup","pointercancel"].forEach(n=>bx.addEventListener(n,()=>{drag=false}))}
}
load();
if(!document.hidden)setInterval(()=>{if(!document.hidden&&!document.querySelector("#cmp:active"))load()},300000);
</script>
</body>
</html>
