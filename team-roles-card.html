<title>Team Roles</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<style>
:root {
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --text-1: #1C1C1E;
  --text-2: #8E8E93;
  --text-3: #C7C7CC;
  --accent: #007AFF;
  --accent-soft: rgba(0,122,255,0.08);
  --green: #34C759;
  --amber: #FF9F0A;
  --red: #FF3B30;
  --border: #E5E5EA;
  --glass: rgba(242,242,247,0.72);
  --glass-border: rgba(0,0,0,0.06);
  --shadow: 0 2px 20px rgba(0,0,0,0.06), 0 0 1px rgba(0,0,0,0.08);
  --shadow-hover: 0 4px 24px rgba(0,0,0,0.1), 0 0 1px rgba(0,0,0,0.08);
  --radius: 24px;
  --radius-sm: 14px;
  --radius-xs: 8px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --hero-text: #FFFFFF;
  --hero-sub: rgba(255,255,255,0.75);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000;
    --card: #1C1C1E;
    --text-1: #F5F5F7;
    --text-2: #98989D;
    --text-3: #48484A;
    --accent: #0A84FF;
    --accent-soft: rgba(10,132,255,0.14);
    --green: #30D158;
    --amber: #FFD60A;
    --red: #FF453A;
    --border: #2C2C2E;
    --glass: rgba(0,0,0,0.72);
    --glass-border: rgba(255,255,255,0.08);
    --shadow: 0 2px 20px rgba(0,0,0,0.4), 0 0 1px rgba(0,0,0,0.3);
    --shadow-hover: 0 4px 24px rgba(0,0,0,0.5), 0 0 1px rgba(0,0,0,0.3);
  }
}

:root[data-theme="dark"] {
  --bg: #000000;
  --card: #1C1C1E;
  --text-1: #F5F5F7;
  --text-2: #98989D;
  --text-3: #48484A;
  --accent: #0A84FF;
  --accent-soft: rgba(10,132,255,0.14);
  --green: #30D158;
  --amber: #FFD60A;
  --red: #FF453A;
  --border: #2C2C2E;
  --glass: rgba(0,0,0,0.72);
  --glass-border: rgba(255,255,255,0.08);
  --shadow: 0 2px 20px rgba(0,0,0,0.4), 0 0 1px rgba(0,0,0,0.3);
  --shadow-hover: 0 4px 24px rgba(0,0,0,0.5), 0 0 1px rgba(0,0,0,0.3);
}

body {
  background: var(--bg);
  font-family: var(--font);
  color: var(--text-1);
  padding-inline: 16px;
  padding-block: 0;
  -webkit-font-smoothing: antialiased;
  display: flex;
  justify-content: center;
  min-height: 100%;
}

html { height: 100%; }
*, *::before, *::after { box-sizing: border-box; }

#app {
  width: 100%;
  max-width: 640px;
  padding: 24px 0 40px;
}

/* Card shell */
.roster-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}

/* Hero header — cover image with floating text */
.hero {
  position: relative;
  width: 100%;
  min-height: 220px;
  overflow: hidden;
  cursor: default;
}
.hero-bg {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
}
.hero-bg img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.hero-fade {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0) 0%,
    rgba(0,0,0,0.02) 30%,
    rgba(0,0,0,0.35) 65%,
    rgba(0,0,0,0.75) 100%
  );
  pointer-events: none;
}
.hero-content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  min-height: 220px;
  padding: 0 28px 22px;
}
.hero-title {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.1;
  margin: 0;
  color: var(--hero-text);
  outline: none;
  text-shadow: 0 1px 8px rgba(0,0,0,0.3);
}
.hero-subtitle {
  font-size: 14px;
  color: var(--hero-sub);
  margin: 6px 0 0;
  line-height: 1.4;
  outline: none;
  text-shadow: 0 1px 4px rgba(0,0,0,0.3);
}
.hero-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
  flex-wrap: wrap;
}
.member-count {
  display: inline-block;
  font-size: 12px;
  font-weight: 600;
  color: #fff;
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 4px 14px;
  border-radius: 100px;
  letter-spacing: 0.02em;
}
.hero-edit-cover {
  position: absolute;
  top: 14px;
  right: 14px;
  display: flex;
  gap: 6px;
  z-index: 5;
}
.cover-btn {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: none;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  opacity: 0;
  transition: all 0.2s;
}
.cover-btn svg { width: 15px; height: 15px; }
.hero:hover .cover-btn { opacity: 1; }
.cover-btn:hover { background: rgba(0,0,0,0.65); }
.cover-btn.remove:hover { background: var(--red); }

/* Reposition mode */
.hero.repositioning { cursor: grab; }
.hero.repositioning:active { cursor: grabbing; }
.hero.repositioning .hero-fade { opacity: 0.3; }
.hero.repositioning .hero-content { opacity: 0; pointer-events: none; }
.hero.repositioning .hero-edit-cover { opacity: 0; pointer-events: none; }
.reposition-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 20px;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 10;
  color: #fff;
  font-size: 12px;
  font-weight: 500;
}
.reposition-bar span { white-space: nowrap; flex-shrink: 0; }
.zoom-slider {
  -webkit-appearance: none;
  appearance: none;
  flex: 1;
  height: 4px;
  border-radius: 2px;
  background: rgba(255,255,255,0.25);
  outline: none;
  cursor: pointer;
}
.zoom-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
}
.zoom-slider::-moz-range-thumb {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
  border: none;
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
}
.reposition-done {
  padding: 5px 16px;
  border-radius: 100px;
  border: none;
  background: var(--accent);
  color: #fff;
  font-family: var(--font);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  flex-shrink: 0;
  transition: filter 0.15s;
}
.reposition-done:hover { filter: brightness(1.15); }
.reposition-hint {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: rgba(255,255,255,0.8);
  font-size: 14px;
  font-weight: 600;
  text-shadow: 0 1px 6px rgba(0,0,0,0.5);
  pointer-events: none;
  z-index: 8;
}

.hero-upload-hint {
  position: absolute;
  top: 20px;
  right: 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: rgba(255,255,255,0.3);
  transition: color 0.2s;
  pointer-events: none;
  z-index: 3;
}
.hero:hover .hero-upload-hint { color: rgba(255,255,255,0.7); }
.hero-upload-hint svg { width: 28px; height: 28px; }
.hero-upload-hint span { font-size: 12px; font-weight: 500; }

/* Editable fields */
.editable {
  border-radius: 6px;
  padding: 2px 6px;
  margin: -2px -6px;
  transition: background 0.2s;
  cursor: text;
}
.editable:hover { background: rgba(255,255,255,0.1); }
.editable:focus { background: rgba(255,255,255,0.15); }
.editable-dark:hover { background: var(--accent-soft); }
.editable-dark:focus { background: var(--accent-soft); }

/* Toolbar row */
.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 28px;
  border-bottom: 0.5px solid var(--border);
}
.toolbar-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 14px;
  border-radius: 100px;
  border: none;
  background: var(--accent-soft);
  color: var(--accent);
  font-family: var(--font);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.toolbar-btn:hover { background: rgba(0,122,255,0.15); }
.toolbar-btn.active { background: var(--accent); color: #fff; }
.toolbar-btn svg { width: 13px; height: 13px; }

/* Member rows */
.members-list { padding: 0; }

.member-row {
  display: flex;
  gap: 14px;
  padding: 18px 28px;
  border-bottom: 0.5px solid var(--border);
  align-items: flex-start;
  transition: background 0.15s, box-shadow 0.15s;
  position: relative;
}
.member-row:last-child { border-bottom: none; }
.member-row:hover { background: var(--accent-soft); }

/* Drag handle */
.drag-handle {
  width: 18px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: grab;
  color: var(--text-3);
  padding-top: 16px;
  transition: color 0.15s;
  touch-action: none;
}
.drag-handle:hover { color: var(--text-2); }
.drag-handle:active { cursor: grabbing; }
.drag-handle svg { width: 14px; height: 18px; }

.member-row.dragging {
  opacity: 0.85;
  box-shadow: 0 8px 30px rgba(0,0,0,0.2);
  z-index: 100;
  background: var(--card);
}
.member-row.drag-over-top { box-shadow: inset 0 2px 0 var(--accent); }
.member-row.drag-over-bottom { box-shadow: inset 0 -2px 0 var(--accent); }

/* Photo */
.avatar {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--bg);
  overflow: hidden;
  flex-shrink: 0;
  position: relative;
  margin-top: 2px;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.avatar-placeholder svg { width: 24px; height: 24px; color: var(--text-3); }
.avatar-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.35);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.2s;
  cursor: pointer;
}
.avatar-overlay svg { width: 18px; height: 18px; color: #fff; }
.avatar:hover .avatar-overlay { opacity: 1; }

/* Member content */
.member-body {
  flex: 1;
  min-width: 0;
}

.member-top {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.member-name {
  font-size: 16px;
  font-weight: 600;
  line-height: 1.3;
  margin: 0;
  outline: none;
}

.role-tag {
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 2px 10px;
  border-radius: 100px;
  white-space: nowrap;
  outline: none;
  line-height: 1.4;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-left: auto;
}
.status-active { background: var(--green); }
.status-away { background: var(--amber); }
.status-busy { background: var(--red); }

@keyframes pulse-green {
  0%, 100% { box-shadow: 0 0 0 0 rgba(52,199,89,0.4); }
  50% { box-shadow: 0 0 0 4px rgba(52,199,89,0); }
}
.status-active { animation: pulse-green 2.5s ease-in-out infinite; }

.status-wrap {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-left: auto;
  cursor: default;
  position: relative;
  flex-shrink: 0;
}
.status-label {
  font-size: 12px;
  color: var(--text-2);
}

/* Tasks */
.member-tasks {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 8px;
}
.task-chip {
  font-size: 12px;
  padding: 2px 10px;
  border-radius: 100px;
  background: var(--bg);
  color: var(--text-1);
  line-height: 1.4;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.chip-x {
  width: 14px; height: 14px;
  border-radius: 50%;
  border: none;
  background: var(--text-3);
  color: var(--card);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  font-size: 10px;
  line-height: 1;
  transition: background 0.15s;
}
.chip-x:hover { background: var(--red); }

.task-add {
  font-size: 12px;
  padding: 2px 10px;
  border-radius: 100px;
  border: 1.5px dashed var(--text-3);
  background: transparent;
  color: var(--text-2);
  cursor: pointer;
  font-family: var(--font);
  transition: all 0.15s;
  line-height: 1.4;
}
.task-add:hover { border-color: var(--accent); color: var(--accent); }

.task-input {
  font-size: 12px;
  padding: 3px 10px;
  border: 1.5px solid var(--accent);
  border-radius: var(--radius-xs);
  background: var(--card);
  color: var(--text-1);
  font-family: var(--font);
  outline: none;
  width: 140px;
}

/* Contact row — collapsible */
.member-contact {
  display: flex;
  gap: 14px;
  margin-top: 6px;
  flex-wrap: wrap;
  overflow: hidden;
  max-height: 0;
  opacity: 0;
  transition: max-height 0.3s ease, opacity 0.25s ease, margin 0.3s ease;
  margin-top: 0;
}
.member-contact.show {
  max-height: 60px;
  opacity: 1;
  margin-top: 6px;
}
.contact-item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--text-2);
}
.contact-item svg { width: 12px; height: 12px; flex-shrink: 0; }
.contact-val {
  outline: none;
  color: var(--text-2);
}
.contact-val:focus { color: var(--text-1); }

/* Member row delete */
.row-delete {
  position: absolute;
  top: 18px;
  right: 12px;
  width: 24px; height: 24px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--text-3);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  opacity: 0;
  transition: all 0.15s;
}
.row-delete svg { width: 14px; height: 14px; }
.member-row:hover .row-delete { opacity: 1; }
.row-delete:hover { background: rgba(255,59,48,0.1); color: var(--red); }

/* Status dropdown */
.status-menu {
  position: absolute;
  top: calc(100% + 4px);
  right: 0;
  background: var(--card);
  border-radius: var(--radius-sm);
  box-shadow: 0 8px 30px rgba(0,0,0,0.18);
  border: 0.5px solid var(--border);
  padding: 4px;
  z-index: 50;
  min-width: 130px;
}
.status-opt {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  border-radius: var(--radius-xs);
  cursor: pointer;
  font-size: 13px;
  color: var(--text-1);
  border: none;
  background: none;
  width: 100%;
  font-family: var(--font);
  text-align: left;
  transition: background 0.12s;
}
.status-opt:hover { background: var(--accent-soft); }

/* Card footer */
.card-footer {
  display: flex;
  gap: 8px;
  padding: 16px 28px 20px;
  border-top: 0.5px solid var(--border);
  flex-wrap: wrap;
}

/* Add member row */
.add-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 14px 28px;
  cursor: pointer;
  color: var(--text-2);
  font-family: var(--font);
  font-size: 14px;
  font-weight: 500;
  border: none;
  background: none;
  width: 100%;
  transition: all 0.15s;
  border-top: 0.5px solid var(--border);
}
.add-row:hover { background: var(--accent-soft); color: var(--accent); }
.add-row svg { width: 18px; height: 18px; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 18px;
  border-radius: 100px;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 500;
  border: none;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  flex: 1;
  justify-content: center;
}
.btn svg { width: 15px; height: 15px; flex-shrink: 0; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { filter: brightness(1.1); }
.btn-primary:active { transform: scale(0.97); }
.btn-secondary { background: var(--accent-soft); color: var(--accent); }
.btn-secondary:hover { background: rgba(0,122,255,0.15); }
.btn-secondary:active { transform: scale(0.97); }

/* Toast */
.toast {
  position: fixed;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--text-1);
  color: var(--bg);
  padding: 10px 22px;
  border-radius: 100px;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 500;
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
  z-index: 200;
  pointer-events: none;
  box-shadow: 0 8px 30px rgba(0,0,0,0.15);
  white-space: nowrap;
}
.toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

.save-pill {
  position: fixed;
  top: calc(8px + env(safe-area-inset-top, 0px));
  right: 16px;
  background: var(--accent);
  color: #fff;
  font-family: var(--font);
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 100px;
  opacity: 0;
  transition: opacity 0.25s;
  z-index: 200;
}
.save-pill.active { opacity: 1; }

/* Responsive */
@media (max-width: 500px) {
  .hero { min-height: 180px; }
  .hero-content { min-height: 180px; padding: 0 20px 18px; }
  .hero-title { font-size: 24px; }
  .member-row { padding: 14px 20px; gap: 10px; }
  .avatar { width: 44px; height: 44px; }
  .card-footer { padding: 12px 20px 16px; }
  .member-contact { gap: 10px; }
  .toolbar { padding: 8px 20px; }
  .drag-handle { width: 14px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>

<script>
(function() {
  'use strict';

  var DEBOUNCE = 1000, PHOTO_SIZE = 200, PHOTO_Q = 0.75, STORAGE_KEY = 'team-roles-data';
  var state, artifact, downloads, canEdit = true, saveTimer, saving = false, openMenu = null;
  var showContacts = false;
  var dragSrcIndex = null;
  var repositioning = false;

  var IC = {
    person: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 12 0v1"/></svg>',
    camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>',
    share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>',
    download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>',
    mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 7L2 7"/></svg>',
    phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.88.37 1.75.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c1.06.33 1.93.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
    image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
    grip: '<svg viewBox="0 0 14 18" fill="currentColor"><circle cx="4" cy="3" r="1.5"/><circle cx="10" cy="3" r="1.5"/><circle cx="4" cy="9" r="1.5"/><circle cx="10" cy="9" r="1.5"/><circle cx="4" cy="15" r="1.5"/><circle cx="10" cy="15" r="1.5"/></svg>',
    contact: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 7L2 7"/></svg>',
    move: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 9l-3 3 3 3"/><path d="M9 5l3-3 3 3"/><path d="M15 19l-3 3-3-3"/><path d="M19 9l3 3-3 3"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>',
    zoomIn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>'
  };

  function el(tag, cls) { var e = document.createElement(tag); if (cls) e.className = cls; return e; }
  function uid() { return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function showToast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('visible'); setTimeout(function() { t.classList.remove('visible'); }, 2600); }
  function showSaving(on) { document.getElementById('save-pill').classList.toggle('active', on); }

  function render() {
    var app = document.getElementById('app');
    app.innerHTML = '';

    var card = el('div', 'roster-card');
    card.id = 'roster';
    card.appendChild(renderHero());
    card.appendChild(renderToolbar());
    card.appendChild(renderMembers());

    if (canEdit) {
      var addBtn = el('button', 'add-row');
      addBtn.innerHTML = IC.plus + ' Add team member';
      addBtn.addEventListener('click', addMember);
      card.appendChild(addBtn);
    }

    card.appendChild(renderFooter());
    app.appendChild(card);
  }

  // --- Hero header ---
  function applyCoverTransform(img) {
    var pos = state.project.coverPos || { x: 50, y: 50 };
    var zoom = state.project.coverZoom || 1;
    img.style.objectPosition = pos.x + '% ' + pos.y + '%';
    img.style.transform = 'scale(' + zoom + ')';
  }

  function renderHero() {
    var hero = el('div', 'hero');
    if (repositioning) hero.classList.add('repositioning');

    var bg = el('div', 'hero-bg');
    var coverImg = null;
    if (state.project.coverPhoto) {
      coverImg = el('img'); coverImg.src = state.project.coverPhoto; coverImg.alt = ''; coverImg.draggable = false;
      applyCoverTransform(coverImg);
      bg.appendChild(coverImg);
    }
    hero.appendChild(bg);

    var fade = el('div', 'hero-fade');
    hero.appendChild(fade);

    if (canEdit && !state.project.coverPhoto) {
      var hint = el('div', 'hero-upload-hint');
      hint.innerHTML = IC.image + '<span>Add cover image</span>';
      hero.appendChild(hint);
      hero.style.cursor = 'pointer';
      hero.addEventListener('click', function(e) {
        if (e.target.closest('.cover-btn') || e.target.closest('[contenteditable]')) return;
        pickCoverPhoto();
      });
    }

    if (canEdit && !repositioning) {
      var btns = el('div', 'hero-edit-cover');
      var changeBtn = el('button', 'cover-btn'); changeBtn.innerHTML = IC.camera; changeBtn.title = 'Change cover';
      changeBtn.addEventListener('click', function(e) { e.stopPropagation(); pickCoverPhoto(); });
      btns.appendChild(changeBtn);
      if (state.project.coverPhoto) {
        var moveBtn = el('button', 'cover-btn'); moveBtn.innerHTML = IC.move; moveBtn.title = 'Reposition';
        moveBtn.addEventListener('click', function(e) { e.stopPropagation(); repositioning = true; render(); });
        btns.appendChild(moveBtn);
        var rmBtn = el('button', 'cover-btn remove'); rmBtn.innerHTML = IC.x; rmBtn.title = 'Remove cover';
        rmBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          state.project.coverPhoto = null;
          state.project.coverPos = null;
          state.project.coverZoom = null;
          render(); schedulePublish();
        });
        btns.appendChild(rmBtn);
      }
      hero.appendChild(btns);
    }

    // Reposition mode UI
    if (repositioning && coverImg) {
      var dragHint = el('div', 'reposition-hint');
      dragHint.textContent = 'Drag to reposition';
      hero.appendChild(dragHint);

      // Drag to pan
      var dragging = false, startX, startY, startPos;
      function onPointerDown(e) {
        if (e.target.closest('.reposition-bar')) return;
        dragging = true;
        startX = e.clientX || e.touches[0].clientX;
        startY = e.clientY || e.touches[0].clientY;
        startPos = { x: (state.project.coverPos || { x: 50, y: 50 }).x, y: (state.project.coverPos || { x: 50, y: 50 }).y };
        hero.style.cursor = 'grabbing';
        dragHint.style.opacity = '0';
      }
      function onPointerMove(e) {
        if (!dragging) return;
        e.preventDefault();
        var cx = e.clientX || e.touches[0].clientX;
        var cy = e.clientY || e.touches[0].clientY;
        var rect = hero.getBoundingClientRect();
        var zoom = state.project.coverZoom || 1;
        var dx = ((cx - startX) / rect.width) * 100 / zoom;
        var dy = ((cy - startY) / rect.height) * 100 / zoom;
        var nx = Math.max(0, Math.min(100, startPos.x - dx));
        var ny = Math.max(0, Math.min(100, startPos.y - dy));
        if (!state.project.coverPos) state.project.coverPos = { x: 50, y: 50 };
        state.project.coverPos.x = Math.round(nx * 10) / 10;
        state.project.coverPos.y = Math.round(ny * 10) / 10;
        applyCoverTransform(coverImg);
      }
      function onPointerUp() {
        if (!dragging) return;
        dragging = false;
        hero.style.cursor = 'grab';
      }
      hero.addEventListener('mousedown', onPointerDown);
      hero.addEventListener('touchstart', onPointerDown, { passive: true });
      document.addEventListener('mousemove', onPointerMove);
      document.addEventListener('touchmove', onPointerMove, { passive: false });
      document.addEventListener('mouseup', onPointerUp);
      document.addEventListener('touchend', onPointerUp);

      // Bottom bar with zoom slider + done
      var bar = el('div', 'reposition-bar');

      var zoomLabel = el('span'); zoomLabel.innerHTML = IC.zoomIn;
      zoomLabel.querySelector('svg').style.cssText = 'width:14px;height:14px;vertical-align:middle;';
      bar.appendChild(zoomLabel);

      var slider = el('input', 'zoom-slider');
      slider.type = 'range'; slider.min = '1'; slider.max = '2.5'; slider.step = '0.05';
      slider.value = String(state.project.coverZoom || 1);
      slider.addEventListener('input', function() {
        state.project.coverZoom = parseFloat(slider.value);
        applyCoverTransform(coverImg);
      });
      bar.appendChild(slider);

      var pctLabel = el('span');
      pctLabel.style.minWidth = '36px';
      pctLabel.style.textAlign = 'right';
      pctLabel.textContent = Math.round((state.project.coverZoom || 1) * 100) + '%';
      slider.addEventListener('input', function() {
        pctLabel.textContent = Math.round(parseFloat(slider.value) * 100) + '%';
      });
      bar.appendChild(pctLabel);

      var doneBtn = el('button', 'reposition-done');
      doneBtn.textContent = 'Done';
      doneBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        repositioning = false;
        document.removeEventListener('mousemove', onPointerMove);
        document.removeEventListener('touchmove', onPointerMove);
        document.removeEventListener('mouseup', onPointerUp);
        document.removeEventListener('touchend', onPointerUp);
        render(); schedulePublish();
      });
      bar.appendChild(doneBtn);

      hero.appendChild(bar);
    }

    var content = el('div', 'hero-content');

    var title = el('h1', 'hero-title' + (canEdit ? ' editable' : ''));
    title.textContent = state.project.name;
    if (canEdit) {
      title.contentEditable = 'plaintext-only';
      title.spellcheck = false;
      title.addEventListener('blur', function() {
        var v = title.textContent.trim();
        if (v && v !== state.project.name) { state.project.name = v; schedulePublish(); }
        else title.textContent = state.project.name;
      });
      title.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); title.blur(); } });
    }
    content.appendChild(title);

    var sub = el('p', 'hero-subtitle' + (canEdit ? ' editable' : ''));
    sub.textContent = state.project.description;
    if (canEdit) {
      sub.contentEditable = 'plaintext-only';
      sub.spellcheck = false;
      sub.addEventListener('blur', function() {
        var v = sub.textContent.trim();
        if (v !== state.project.description) { state.project.description = v; schedulePublish(); }
      });
      sub.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); sub.blur(); } });
    }
    content.appendChild(sub);

    var meta = el('div', 'hero-meta');
    var count = el('span', 'member-count');
    var n = state.members.length;
    count.textContent = n + ' team member' + (n !== 1 ? 's' : '');
    meta.appendChild(count);
    content.appendChild(meta);

    hero.appendChild(content);
    return hero;
  }

  function pickCoverPhoto() {
    var input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
    input.onchange = function(e) {
      var file = e.target.files[0]; if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        var img = new Image();
        img.onload = function() {
          var MAX = 1200;
          var w = img.width, h = img.height;
          if (w > MAX || h > MAX) {
            var s = MAX / Math.max(w, h);
            w = Math.round(w * s); h = Math.round(h * s);
          }
          var c = document.createElement('canvas'); c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          state.project.coverPhoto = c.toDataURL('image/jpeg', 0.82);
          state.project.coverPos = { x: 50, y: 50 };
          state.project.coverZoom = 1;
          repositioning = true;
          render(); schedulePublish();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };
    input.click();
  }

  // --- Toolbar ---
  function renderToolbar() {
    var bar = el('div', 'toolbar');

    var contactBtn = el('button', 'toolbar-btn' + (showContacts ? ' active' : ''));
    contactBtn.innerHTML = IC.contact + (showContacts ? ' Hide contacts' : ' Show contacts');
    contactBtn.addEventListener('click', function() {
      showContacts = !showContacts;
      document.querySelectorAll('.member-contact').forEach(function(c) {
        c.classList.toggle('show', showContacts);
      });
      contactBtn.className = 'toolbar-btn' + (showContacts ? ' active' : '');
      contactBtn.innerHTML = IC.contact + (showContacts ? ' Hide contacts' : ' Show contacts');
    });
    bar.appendChild(contactBtn);

    return bar;
  }

  function renderMembers() {
    var list = el('div', 'members-list');

    if (state.members.length === 0) {
      var empty = el('div');
      empty.style.cssText = 'padding:40px 28px;text-align:center;color:var(--text-2);font-size:14px;';
      empty.textContent = canEdit ? 'Add your first team member below' : 'No team members added yet';
      list.appendChild(empty);
      return list;
    }

    state.members.forEach(function(m, i) { list.appendChild(renderRow(m, i)); });
    return list;
  }

  function renderRow(m, idx) {
    var row = el('div', 'member-row');
    row.dataset.idx = idx;

    // Drag handle
    if (canEdit) {
      var handle = el('div', 'drag-handle');
      handle.innerHTML = IC.grip;
      handle.draggable = true;
      handle.addEventListener('dragstart', function(e) {
        dragSrcIndex = idx;
        row.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', idx);
      });
      handle.addEventListener('dragend', function() {
        row.classList.remove('dragging');
        dragSrcIndex = null;
        document.querySelectorAll('.drag-over-top,.drag-over-bottom').forEach(function(r) {
          r.classList.remove('drag-over-top', 'drag-over-bottom');
        });
      });
      row.addEventListener('dragover', function(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        var rect = row.getBoundingClientRect();
        var mid = rect.top + rect.height / 2;
        row.classList.toggle('drag-over-top', e.clientY < mid);
        row.classList.toggle('drag-over-bottom', e.clientY >= mid);
      });
      row.addEventListener('dragleave', function() {
        row.classList.remove('drag-over-top', 'drag-over-bottom');
      });
      row.addEventListener('drop', function(e) {
        e.preventDefault();
        row.classList.remove('drag-over-top', 'drag-over-bottom');
        var from = dragSrcIndex;
        var to = idx;
        if (from === null || from === to) return;
        var rect = row.getBoundingClientRect();
        if (e.clientY >= rect.top + rect.height / 2 && to < state.members.length - 1) to++;
        var item = state.members.splice(from, 1)[0];
        if (to > from) to--;
        state.members.splice(to, 0, item);
        render(); schedulePublish();
      });
      // Touch drag support
      var touchY = 0, touchStartIdx = idx, touchClone = null;
      handle.addEventListener('touchstart', function(e) {
        touchY = e.touches[0].clientY;
        touchStartIdx = idx;
      }, { passive: true });
      handle.addEventListener('touchmove', function(e) {
        e.preventDefault();
        var cy = e.touches[0].clientY;
        var rows = document.querySelectorAll('.member-row');
        rows.forEach(function(r, ri) {
          var rect = r.getBoundingClientRect();
          if (cy > rect.top && cy < rect.bottom && ri !== touchStartIdx) {
            r.classList.add(cy < rect.top + rect.height / 2 ? 'drag-over-top' : 'drag-over-bottom');
          } else {
            r.classList.remove('drag-over-top', 'drag-over-bottom');
          }
        });
      }, { passive: false });
      handle.addEventListener('touchend', function(e) {
        var cy = e.changedTouches[0].clientY;
        var rows = document.querySelectorAll('.member-row');
        var targetIdx = -1;
        rows.forEach(function(r, ri) {
          r.classList.remove('drag-over-top', 'drag-over-bottom');
          var rect = r.getBoundingClientRect();
          if (cy > rect.top && cy < rect.bottom) targetIdx = ri;
        });
        if (targetIdx >= 0 && targetIdx !== touchStartIdx) {
          var item = state.members.splice(touchStartIdx, 1)[0];
          state.members.splice(targetIdx, 0, item);
          render(); schedulePublish();
        }
      });
      row.appendChild(handle);
    }

    // Avatar
    var av = el('div', 'avatar');
    if (m.photo) {
      var img = el('img'); img.src = m.photo; img.alt = m.name; img.draggable = false;
      av.appendChild(img);
    } else {
      var ph = el('div', 'avatar-placeholder'); ph.innerHTML = IC.person;
      av.appendChild(ph);
    }
    if (canEdit) {
      var ov = el('div', 'avatar-overlay'); ov.innerHTML = IC.camera;
      ov.addEventListener('click', function() { pickPhoto(m.id); });
      av.appendChild(ov);
    }
    row.appendChild(av);

    // Body
    var body = el('div', 'member-body');

    // Top line
    var top = el('div', 'member-top');

    var name = el('span', 'member-name' + (canEdit ? ' editable-dark' : ''));
    name.textContent = m.name;
    if (canEdit) {
      name.contentEditable = 'plaintext-only'; name.spellcheck = false;
      name.addEventListener('blur', function() {
        var v = name.textContent.trim();
        if (v && v !== m.name) { m.name = v; schedulePublish(); }
        else name.textContent = m.name;
      });
      name.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); name.blur(); } });
    }
    top.appendChild(name);

    var role = el('span', 'role-tag' + (canEdit ? ' editable-dark' : ''));
    role.textContent = m.role;
    if (canEdit) {
      role.contentEditable = 'plaintext-only'; role.spellcheck = false;
      role.addEventListener('blur', function() {
        var v = role.textContent.trim();
        if (v && v !== m.role) { m.role = v; schedulePublish(); }
        else role.textContent = m.role;
      });
      role.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); role.blur(); } });
    }
    top.appendChild(role);

    // Status
    var sw = el('div', 'status-wrap');
    var dot = el('span', 'status-dot status-' + m.status);
    dot.style.animation = m.status === 'active' ? '' : 'none';
    var sl = el('span', 'status-label');
    sl.textContent = m.status.charAt(0).toUpperCase() + m.status.slice(1);
    sw.append(dot, sl);
    if (canEdit) {
      sw.style.cursor = 'pointer';
      sw.addEventListener('click', function(e) { e.stopPropagation(); toggleStatus(sw, m); });
    }
    top.appendChild(sw);
    body.appendChild(top);

    // Tasks
    if ((m.tasks && m.tasks.length) || canEdit) {
      var chips = el('div', 'member-tasks');
      (m.tasks || []).forEach(function(t, i) {
        var chip = el('span', 'task-chip');
        chip.textContent = t;
        if (canEdit) {
          var x = el('button', 'chip-x'); x.innerHTML = '&times;';
          x.addEventListener('click', function() { m.tasks.splice(i, 1); render(); schedulePublish(); });
          chip.appendChild(x);
        }
        chips.appendChild(chip);
      });
      if (canEdit) {
        var addC = el('button', 'task-add'); addC.textContent = '+';
        addC.addEventListener('click', function() { showTaskInput(chips, addC, m); });
        chips.appendChild(addC);
      }
      body.appendChild(chips);
    }

    // Contact (collapsible)
    if (m.email || m.phone || canEdit) {
      var contact = el('div', 'member-contact' + (showContacts ? ' show' : ''));

      var emailItem = el('span', 'contact-item');
      emailItem.innerHTML = IC.mail;
      var emailVal = el('span', 'contact-val' + (canEdit ? ' editable-dark' : ''));
      emailVal.textContent = m.email || (canEdit ? 'email' : '');
      if (!m.email) emailVal.style.opacity = '0.4';
      if (canEdit) {
        emailVal.contentEditable = 'plaintext-only'; emailVal.spellcheck = false;
        emailVal.addEventListener('focus', function() { emailVal.style.opacity = '1'; if (!m.email) emailVal.textContent = ''; });
        emailVal.addEventListener('blur', function() {
          var v = emailVal.textContent.trim();
          if (v !== (m.email || '')) { m.email = v; schedulePublish(); }
          if (!v) { emailVal.textContent = 'email'; emailVal.style.opacity = '0.4'; }
        });
        emailVal.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); emailVal.blur(); } });
      }
      emailItem.appendChild(emailVal);
      if (m.email || canEdit) contact.appendChild(emailItem);

      var phoneItem = el('span', 'contact-item');
      phoneItem.innerHTML = IC.phone;
      var phoneVal = el('span', 'contact-val' + (canEdit ? ' editable-dark' : ''));
      phoneVal.textContent = m.phone || (canEdit ? 'phone' : '');
      if (!m.phone) phoneVal.style.opacity = '0.4';
      if (canEdit) {
        phoneVal.contentEditable = 'plaintext-only'; phoneVal.spellcheck = false;
        phoneVal.addEventListener('focus', function() { phoneVal.style.opacity = '1'; if (!m.phone) phoneVal.textContent = ''; });
        phoneVal.addEventListener('blur', function() {
          var v = phoneVal.textContent.trim();
          if (v !== (m.phone || '')) { m.phone = v; schedulePublish(); }
          if (!v) { phoneVal.textContent = 'phone'; phoneVal.style.opacity = '0.4'; }
        });
        phoneVal.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); phoneVal.blur(); } });
      }
      phoneItem.appendChild(phoneVal);
      if (m.phone || canEdit) contact.appendChild(phoneItem);

      body.appendChild(contact);
    }

    row.appendChild(body);

    // Delete button
    if (canEdit) {
      var del = el('button', 'row-delete');
      del.innerHTML = IC.x;
      del.title = 'Remove';
      del.addEventListener('click', function() { deleteMember(m.id); });
      row.appendChild(del);
    }

    return row;
  }

  function renderFooter() {
    var footer = el('div', 'card-footer');

    var shareBtn = el('button', 'btn btn-secondary');
    shareBtn.innerHTML = IC.share + ' Copy Link';
    shareBtn.addEventListener('click', copyLink);
    footer.appendChild(shareBtn);

    var expBtn = el('button', 'btn btn-primary');
    expBtn.innerHTML = IC.download + ' Export Image';
    expBtn.addEventListener('click', exportRoster);
    footer.appendChild(expBtn);

    return footer;
  }

  // --- Task input ---
  function showTaskInput(container, addBtn, member) {
    addBtn.hidden = true;
    var input = el('input', 'task-input');
    input.type = 'text'; input.placeholder = 'Task name…';
    container.appendChild(input); input.focus();
    function commit() {
      var v = input.value.trim();
      if (v) { if (!member.tasks) member.tasks = []; member.tasks.push(v); schedulePublish(); }
      render();
    }
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      if (e.key === 'Escape') { input.remove(); addBtn.hidden = false; }
    });
    input.addEventListener('blur', commit);
  }

  // --- Status ---
  function toggleStatus(wrap, member) {
    closeMenus();
    var menu = el('div', 'status-menu');
    ['active', 'away', 'busy'].forEach(function(s) {
      var opt = el('button', 'status-opt');
      var d = el('span', 'status-dot status-' + s); d.style.animation = 'none';
      var l = el('span'); l.textContent = s.charAt(0).toUpperCase() + s.slice(1);
      opt.append(d, l);
      opt.addEventListener('click', function(e) { e.stopPropagation(); member.status = s; render(); schedulePublish(); });
      menu.appendChild(opt);
    });
    wrap.appendChild(menu);
    openMenu = menu;
    setTimeout(function() { document.addEventListener('click', closeMenus, { once: true }); }, 0);
  }
  function closeMenus() { if (openMenu) { openMenu.remove(); openMenu = null; } }

  // --- Add / Delete ---
  function addMember() {
    state.members.push({ id: uid(), name: 'New Member', role: 'Role', tasks: [], email: '', phone: '', status: 'active', photo: null });
    render(); schedulePublish();
  }
  function deleteMember(id) {
    var m = state.members.find(function(x) { return x.id === id; });
    if (!m || !confirm('Remove ' + m.name + '?')) return;
    state.members = state.members.filter(function(x) { return x.id !== id; });
    render(); schedulePublish();
  }

  // --- Photo ---
  function pickPhoto(memberId) {
    var input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
    input.onchange = function(e) {
      var file = e.target.files[0]; if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        var img = new Image();
        img.onload = function() {
          var c = document.createElement('canvas'); c.width = PHOTO_SIZE; c.height = PHOTO_SIZE;
          var ctx = c.getContext('2d');
          var s = Math.min(img.width, img.height);
          ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, PHOTO_SIZE, PHOTO_SIZE);
          var m = state.members.find(function(x) { return x.id === memberId; });
          if (m) { m.photo = c.toDataURL('image/jpeg', PHOTO_Q); render(); schedulePublish(); }
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };
    input.click();
  }

  // --- Export ---
  function exportRoster() {
    if (typeof html2canvas === 'undefined') { showToast('Export not available'); return; }
    var roster = document.getElementById('roster');
    if (!roster) return;

    var bg = getComputedStyle(document.documentElement).getPropertyValue('--card').trim();
    html2canvas(roster, { backgroundColor: bg, scale: 2, logging: false, useCORS: true }).then(function(canvas) {
      canvas.toBlob(function(blob) {
        saveBlob(blob, (state.project.name || 'team').replace(/[^a-zA-Z0-9]+/g, '-').toLowerCase() + '-roles.png');
      }, 'image/png');
    }).catch(function() { showToast('Export failed'); });
  }

  function saveBlob(blob, filename) {
    if (downloads) {
      downloads.save({ filename: filename, data: blob }).then(function() {
        showToast('Image exported!');
      }).catch(function(e) {
        if (e && e.code === 'declined') return;
        nativeDownload(blob, filename);
      });
    } else {
      nativeDownload(blob, filename);
    }
  }

  function nativeDownload(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function() { a.remove(); URL.revokeObjectURL(url); }, 100);
    showToast('Image exported!');
  }

  // --- Share ---
  function copyLink() {
    var url = window.location.href;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function() {
        showToast('Link copied — paste in WhatsApp to share');
      }).catch(fallback);
    } else { fallback(); }
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = url;
      ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); showToast('Link copied!'); }
      catch(e) { showToast('Copy the URL from the address bar'); }
      ta.remove();
    }
  }

  // --- Save ---
  function schedulePublish() { clearTimeout(saveTimer); saveTimer = setTimeout(saveState, DEBOUNCE); }

  function saveState() {
    if (saving) return;
    saving = true; showSaving(true);

    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}

    if (artifact) {
      try {
        var clone = document.documentElement.cloneNode(true);
        var a = clone.querySelector('#app'); if (a) a.innerHTML = '';
        var d = clone.querySelector('#app-data'); if (d) d.textContent = JSON.stringify(state);
        var t = clone.querySelector('#toast'); if (t) t.classList.remove('visible');
        var p = clone.querySelector('#save-pill'); if (p) p.classList.remove('active');
        var html = '<!doctype html>\n' + clone.outerHTML;
        artifact.publish(html).then(done).catch(done);
      } catch(e) { done(); }
    } else { done(); }

    function done() { saving = false; showSaving(false); showToast('Saved'); }
  }

  // --- Init ---
  function loadState() {
    var defaults = JSON.parse(document.getElementById('app-data').textContent);
    try {
      var stored = localStorage.getItem(STORAGE_KEY);
      if (stored) return JSON.parse(stored);
    } catch(e) {}
    return defaults;
  }

  function start(hotData) {
    state = (hotData && hotData.state) || loadState();
    render();
    initCaps();
  }

  function initCaps() {
    if (!window.claude) return;
    claude.use('artifact').then(function(a) { artifact = a; }).catch(function() {});
    claude.use('downloads').then(function(d) { downloads = d; }).catch(function() {});
  }

  if (window.claude && window.claude.hot) {
    window.claude.hot.snapshot(function() { return { state: state }; });
    if (window.claude.hot.ready) window.claude.hot.ready(start);
    else start(window.claude.hot.data || {});
  } else {
    start({});
  }
})();
</script>
