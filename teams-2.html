<title>Teams 2</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#007AFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Teams 2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<style>
:root {
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --text-1: #1C1C1E;
  --text-2: #8E8E93;
  --text-3: #C7C7CC;
  --accent: #007AFF;
  --accent-soft: rgba(0,122,255,0.08);
  --green: #34C759;
  --amber: #FF9F0A;
  --red: #FF3B30;
  --border: #E5E5EA;
  --glass: rgba(242,242,247,0.72);
  --glass-border: rgba(0,0,0,0.06);
  --shadow: 0 2px 20px rgba(0,0,0,0.06), 0 0 1px rgba(0,0,0,0.08);
  --shadow-hover: 0 4px 24px rgba(0,0,0,0.1), 0 0 1px rgba(0,0,0,0.08);
  --radius: 24px;
  --radius-sm: 14px;
  --radius-xs: 8px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --hero-text: #FFFFFF;
  --hero-sub: rgba(255,255,255,0.75);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000;
    --card: #1C1C1E;
    --text-1: #F5F5F7;
    --text-2: #98989D;
    --text-3: #48484A;
    --accent: #0A84FF;
    --accent-soft: rgba(10,132,255,0.14);
    --green: #30D158;
    --amber: #FFD60A;
    --red: #FF453A;
    --border: #2C2C2E;
    --glass: rgba(0,0,0,0.72);
    --glass-border: rgba(255,255,255,0.08);
    --shadow: 0 2px 20px rgba(0,0,0,0.4), 0 0 1px rgba(0,0,0,0.3);
    --shadow-hover: 0 4px 24px rgba(0,0,0,0.5), 0 0 1px rgba(0,0,0,0.3);
  }
}

:root[data-theme="dark"] {
  --bg: #000000;
  --card: #1C1C1E;
  --text-1: #F5F5F7;
  --text-2: #98989D;
  --text-3: #48484A;
  --accent: #0A84FF;
  --accent-soft: rgba(10,132,255,0.14);
  --green: #30D158;
  --amber: #FFD60A;
  --red: #FF453A;
  --border: #2C2C2E;
  --glass: rgba(0,0,0,0.72);
  --glass-border: rgba(255,255,255,0.08);
  --shadow: 0 2px 20px rgba(0,0,0,0.4), 0 0 1px rgba(0,0,0,0.3);
  --shadow-hover: 0 4px 24px rgba(0,0,0,0.5), 0 0 1px rgba(0,0,0,0.3);
}

body {
  background: var(--bg);
  font-family: var(--font);
  color: var(--text-1);
  padding-inline: 16px;
  padding-block: 0;
  -webkit-font-smoothing: antialiased;
  display: flex;
  justify-content: center;
  min-height: 100%;
}

html { height: 100%; }
*, *::before, *::after { box-sizing: border-box; }

#app {
  width: 100%;
  max-width: 720px;
  padding: 24px 0 40px;
}

/* ===== DASHBOARD VIEW ===== */
.dash-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  gap: 12px;
}
.dash-title {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin: 0;
}
.dash-subtitle {
  font-size: 14px;
  color: var(--text-2);
  margin: 4px 0 0;
}
.dash-actions {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}
.dash-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 18px;
  border-radius: 100px;
  border: none;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.dash-btn-primary {
  background: var(--accent);
  color: #fff;
}
.dash-btn-primary:hover { filter: brightness(1.1); }
.dash-btn-primary:active { transform: scale(0.97); }

/* Team cards grid */
.teams-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.team-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  cursor: pointer;
  transition: box-shadow 0.2s, transform 0.15s;
}
.team-card:hover {
  box-shadow: var(--shadow-hover);
  transform: translateY(-2px);
}
.team-card:active { transform: translateY(0) scale(0.99); }
.team-card-banner {
  height: 100px;
  position: relative;
  overflow: hidden;
}
.team-card-banner img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.team-card-banner-placeholder {
  width: 100%; height: 100%;
}
.team-card-member-count {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  padding: 3px 10px;
  border-radius: 100px;
}
.team-card-avatars {
  position: absolute;
  bottom: 8px;
  left: 12px;
  display: flex;
}
.team-card-avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 2px solid var(--card);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  overflow: hidden;
  flex-shrink: 0;
}
.team-card-avatar + .team-card-avatar { margin-left: -8px; }
.team-card-avatar img { width: 100%; height: 100%; object-fit: cover; }
.team-card-body { padding: 14px 18px 16px; }
.team-card-name {
  font-size: 16px;
  font-weight: 700;
  margin: 0 0 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.team-card-color {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.team-card-desc {
  font-size: 13px;
  color: var(--text-2);
  margin: 0 0 10px;
  line-height: 1.4;
}
.team-card-tags {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}
.team-card-tag {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 10px;
  border-radius: 100px;
  background: var(--accent-soft);
  color: var(--accent);
}
.team-card-delete {
  position: absolute;
  top: 10px;
  left: 10px;
  width: 26px; height: 26px;
  border-radius: 50%;
  border: none;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  opacity: 0;
  transition: all 0.2s;
  z-index: 3;
}
.team-card-delete svg { width: 13px; height: 13px; }
.team-card:hover .team-card-delete { opacity: 1; }
.team-card-delete:hover { background: var(--red); }

/* Add team card */
.team-card-add {
  background: var(--card);
  border-radius: var(--radius);
  border: 2px dashed var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 200px;
  cursor: pointer;
  transition: all 0.2s;
  gap: 8px;
  color: var(--text-2);
  font-size: 14px;
  font-weight: 500;
}
.team-card-add svg { width: 32px; height: 32px; }
.team-card-add:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
}

/* ===== DETAIL VIEW ===== */
.detail-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: 100px;
  border: none;
  background: var(--accent-soft);
  color: var(--accent);
  font-family: var(--font);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  margin-bottom: 16px;
}
.detail-back:hover { background: rgba(0,122,255,0.15); }
.detail-back svg { width: 15px; height: 15px; }

/* Card shell */
.roster-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  border: 1.5px solid transparent;
}

/* Hero header */
.hero {
  position: relative;
  width: 100%;
  min-height: 220px;
  overflow: hidden;
  cursor: default;
}
.hero-bg {
  position: absolute;
  inset: 0;
}
.hero-bg img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.hero-fade {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.02) 30%, rgba(0,0,0,0.35) 65%, rgba(0,0,0,0.75) 100%);
  pointer-events: none;
}
.hero-content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  min-height: 220px;
  padding: 0 28px 22px;
}
.hero-title {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.1;
  margin: 0;
  color: var(--hero-text);
  outline: none;
  text-shadow: 0 1px 8px rgba(0,0,0,0.3);
}
.hero-subtitle {
  font-size: 14px;
  color: var(--hero-sub);
  margin: 6px 0 0;
  line-height: 1.4;
  outline: none;
  text-shadow: 0 1px 4px rgba(0,0,0,0.3);
}
.hero-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
  flex-wrap: wrap;
}
.member-count {
  display: inline-block;
  font-size: 12px;
  font-weight: 600;
  color: #fff;
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 4px 14px;
  border-radius: 100px;
}
.hero-edit-cover {
  position: absolute;
  top: 14px;
  right: 14px;
  display: flex;
  gap: 6px;
  z-index: 5;
}
.cover-btn {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: none;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  opacity: 0;
  transition: all 0.2s;
}
.cover-btn svg { width: 15px; height: 15px; }
.hero:hover .cover-btn { opacity: 1; }
.cover-btn:hover { background: rgba(0,0,0,0.65); }
.cover-btn.remove:hover { background: var(--red); }

/* Reposition mode */
.hero.repositioning { cursor: grab; }
.hero.repositioning:active { cursor: grabbing; }
.hero.repositioning .hero-fade { opacity: 0.3; }
.hero.repositioning .hero-content { opacity: 0; pointer-events: none; }
.hero.repositioning .hero-edit-cover { opacity: 0; pointer-events: none; }
.reposition-bar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 20px;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 10;
  color: #fff;
  font-size: 12px;
  font-weight: 500;
}
.reposition-bar span { white-space: nowrap; flex-shrink: 0; }
.zoom-slider {
  -webkit-appearance: none; appearance: none;
  flex: 1; height: 4px;
  border-radius: 2px;
  background: rgba(255,255,255,0.25);
  outline: none; cursor: pointer;
}
.zoom-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
}
.zoom-slider::-moz-range-thumb {
  width: 16px; height: 16px;
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
  border: none;
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
}
.reposition-done {
  padding: 5px 16px;
  border-radius: 100px;
  border: none;
  background: var(--accent);
  color: #fff;
  font-family: var(--font);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  flex-shrink: 0;
  transition: filter 0.15s;
}
.reposition-done:hover { filter: brightness(1.15); }
.reposition-hint {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  color: rgba(255,255,255,0.8);
  font-size: 14px;
  font-weight: 600;
  text-shadow: 0 1px 6px rgba(0,0,0,0.5);
  pointer-events: none;
  z-index: 8;
}
.hero-upload-hint {
  position: absolute;
  top: 20px; right: 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: rgba(255,255,255,0.3);
  transition: color 0.2s;
  pointer-events: none;
  z-index: 3;
}
.hero:hover .hero-upload-hint { color: rgba(255,255,255,0.7); }
.hero-upload-hint svg { width: 28px; height: 28px; }
.hero-upload-hint span { font-size: 12px; font-weight: 500; }

/* Editable fields */
.editable {
  border-radius: 6px;
  padding: 2px 6px;
  margin: -2px -6px;
  transition: background 0.2s;
  cursor: text;
}
.editable:hover { background: rgba(255,255,255,0.1); }
.editable:focus { background: rgba(255,255,255,0.15); }
.editable-dark:hover { background: var(--accent-soft); }
.editable-dark:focus { background: var(--accent-soft); }

/* Toolbar */
.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 28px;
  border-bottom: 0.5px solid var(--border);
}
.toolbar-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 14px;
  border-radius: 100px;
  border: none;
  background: var(--accent-soft);
  color: var(--accent);
  font-family: var(--font);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.toolbar-btn:hover { background: rgba(0,122,255,0.15); }
.toolbar-btn.active { background: var(--accent); color: #fff; }
.toolbar-btn svg { width: 13px; height: 13px; }

/* Project tags bar */
.tags-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 28px;
  border-bottom: 0.5px solid var(--border);
  flex-wrap: wrap;
}
.project-tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 12px;
  border-radius: 100px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  line-height: 1.3;
}
.project-tag .tag-x {
  width: 16px; height: 16px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--accent);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  font-size: 14px;
  line-height: 1;
  opacity: 0.5;
  transition: all 0.15s;
}
.project-tag .tag-x:hover { opacity: 1; background: rgba(0,122,255,0.15); }
.tag-add {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1.5px dashed var(--text-3);
  background: transparent;
  color: var(--text-2);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  transition: all 0.15s;
  flex-shrink: 0;
}
.tag-add:hover { border-color: var(--accent); color: var(--accent); }
.tag-add svg { width: 14px; height: 14px; }
.tag-dropdown {
  position: fixed;
  background: var(--card);
  border-radius: var(--radius-sm);
  box-shadow: 0 8px 30px rgba(0,0,0,0.18);
  border: 0.5px solid var(--border);
  padding: 6px;
  z-index: 200;
  min-width: 220px;
  max-height: 280px;
  overflow-y: auto;
}
.tag-dropdown-search {
  width: 100%;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  background: var(--bg);
  color: var(--text-1);
  font-family: var(--font);
  font-size: 13px;
  outline: none;
  margin-bottom: 4px;
}
.tag-dropdown-search:focus { border-color: var(--accent); }
.tag-dropdown-search::placeholder { color: var(--text-3); }
.tag-section-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--text-2);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 8px 10px 4px;
}
.tag-opt {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border-radius: var(--radius-xs);
  cursor: pointer;
  font-size: 13px;
  color: var(--text-1);
  border: none;
  background: none;
  width: 100%;
  font-family: var(--font);
  text-align: left;
  transition: background 0.12s;
}
.tag-opt:hover { background: var(--accent-soft); }
.tag-opt.disabled { opacity: 0.35; pointer-events: none; }
.tag-opt .tag-opt-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
}

/* Detail tabs */
.detail-tabs {
  display: flex;
  gap: 0;
  border-bottom: 0.5px solid var(--border);
  padding: 0 28px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.detail-tabs::-webkit-scrollbar { display: none; }
.detail-tab {
  padding: 12px 18px;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 600;
  border: none;
  background: none;
  color: var(--text-2);
  cursor: pointer;
  white-space: nowrap;
  position: relative;
  transition: color 0.15s;
}
.detail-tab:hover { color: var(--text-1); }
.detail-tab.active { color: var(--accent); }
.detail-tab.active::after {
  content: '';
  position: absolute;
  bottom: -0.5px;
  left: 12px;
  right: 12px;
  height: 2px;
  border-radius: 2px;
  background: var(--accent);
}
.tab-content { display: none; }
.tab-content.active { display: block; }

/* Checklist panel */
.checklist-panel { padding: 16px 28px 20px; }
.checklist-section {
  margin-bottom: 20px;
}
.checklist-section:last-child { margin-bottom: 0; }
.checklist-section-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-2);
  margin: 0 0 10px;
}
.checklist-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 0.5px solid var(--border);
}
.checklist-item:last-child { border-bottom: none; }
.checklist-cb {
  width: 20px; height: 20px;
  border-radius: 6px;
  border: 2px solid var(--text-3);
  background: none;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  margin-top: 1px;
  transition: all 0.15s;
  color: transparent;
}
.checklist-cb:hover { border-color: var(--accent); }
.checklist-cb.checked {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.checklist-cb svg { width: 12px; height: 12px; }
.checklist-label {
  flex: 1;
  font-size: 14px;
  line-height: 1.5;
  color: var(--text-1);
  outline: none;
}
.checklist-label.done {
  text-decoration: line-through;
  color: var(--text-2);
}
.checklist-delete {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--text-3);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  opacity: 0;
  transition: all 0.15s;
  flex-shrink: 0;
  margin-top: 2px;
}
.checklist-delete svg { width: 12px; height: 12px; }
.checklist-item:hover .checklist-delete { opacity: 1; }
.checklist-delete:hover { background: rgba(255,59,48,0.1); color: var(--red); }
.checklist-add {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 0;
  color: var(--text-2);
  font-family: var(--font);
  font-size: 13px;
  font-weight: 500;
  border: none;
  background: none;
  cursor: pointer;
  transition: color 0.15s;
  width: 100%;
}
.checklist-add:hover { color: var(--accent); }

  gap: 10px;

}
.checklist-progress-bar {

  height: 4px;
  border-radius: 2px;
  background: var(--border);

}

  border-radius: 2px;

.members-list { padding: 0; }
.member-row {
  display: flex;
  gap: 14px;
  padding: 18px 28px;

  position: relative;
}
.member-row:last-child { border-bottom: none; }
.member-row:hover { background: var(--accent-soft); }
.member-row-accent {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  border-radius: 0 3px 3px 0;
}

.drag-handle {
  width: 18px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: grab;
  color: var(--text-3);
  padding-top: 16px;
  transition: color 0.15s;
  touch-action: none;
}
.drag-handle:hover { color: var(--text-2); }
.drag-handle:active { cursor: grabbing; }
.drag-handle svg { width: 14px; height: 18px; }
.member-row.dragging {
  opacity: 0.85;
  box-shadow: 0 8px 30px rgba(0,0,0,0.2);

  background: var(--card);
}
.member-row.drag-over-top { box-shadow: inset 0 2px 0 var(--accent); }
.member-row.drag-over-bottom { box-shadow: inset 0 -2px 0 var(--accent); }

.avatar {
  width: 52px; height: 52px;
  border-radius: 50%;
  background: var(--bg);
  overflow: hidden;
  flex-shrink: 0;
  position: relative;
  margin-top: 2px;
}
.avatar-initials {
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 600;
  color: #fff;
}

/* Member content */
.member-body { flex: 1; min-width: 0; }
.member-top {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.member-name {
  font-size: 16px;
  font-weight: 600;
  line-height: 1.3;
  margin: 0;
  outline: none;
}
.role-tag {
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 2px 10px;
  border-radius: 100px;
  white-space: nowrap;
  outline: none;
  line-height: 1.4;
}
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 100px;
  font-size: 11px;
  font-weight: 600;
  flex-shrink: 0;
  margin-left: auto;
  cursor: default;
  position: relative;
}
.status-pill-active {
  background: rgba(52,199,89,0.15);

}
.status-pill-away {
  background: rgba(255,159,10,0.15);
  color: var(--amber);
}
.status-pill-busy {
  background: rgba(255,59,48,0.15);
  color: var(--red);
}
.status-pill-dot {
  width: 6px; height: 6px;
  border-radius: 50%;

}
.status-pill-active .status-pill-dot { background: var(--green); }
.status-pill-away .status-pill-dot { background: var(--amber); }
.status-pill-busy .status-pill-dot { background: var(--red); }

/* Tasks */
.member-tasks {

  flex-wrap: wrap;
  gap: 5px;

  padding: 2px 10px;
  border-radius: 100px;
  background: var(--bg);

  align-items: center;
  gap: 4px;
}
.chip-x {
  width: 14px; height: 14px;

  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  font-size: 10px;
  line-height: 1;
  transition: background 0.15s;
}
.chip-x:hover { background: var(--red); }
.task-add {
  font-size: 12px;
  padding: 2px 10px;
  border-radius: 100px;
  border: 1.5px dashed var(--text-3);
  background: transparent;
  color: var(--text-2);
  cursor: pointer;
  font-family: var(--font);
  transition: all 0.15s;
  line-height: 1.4;
}
.task-add:hover { border-color: var(--accent); color: var(--accent); }
.task-input {
  font-size: 12px;
  padding: 3px 10px;
  border: 1.5px solid var(--accent);
  border-radius: var(--radius-xs);
  background: var(--card);
  color: var(--text-1);
  font-family: var(--font);
  outline: none;
  width: 140px;
}

/* Contact row */
.member-contact {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  overflow: hidden;
  max-height: 0;

}
.member-contact.show {

  margin-top: 6px;
}
.contact-item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--text-2);
}
.contact-item svg { width: 12px; height: 12px; flex-shrink: 0; }
.contact-val { outline: none; color: var(--text-2); }
.contact-val:focus { color: var(--text-1); }

  border: none;

  color: var(--text-3);

  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;

  color: var(--text-1);

  background: none;

.card-brand {

.card-brand-right {

  padding: 16px 28px 20px;

  align-items: center;
  gap: 6px;
  padding: 9px 18px;
  border-radius: 100px;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 500;
  border: none;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  flex: 1;
  justify-content: center;

  // --- Checklist ---
  function ensureChecklist(team, key) {
    if (!team[key] || !team[key].length) {
      var presets = TAB_PRESETS[key];
      team[key] = [];
      Object.keys(presets).forEach(function(section) {
        presets[section].forEach(function(label) {
          team[key].push({ id: uid(), text: label, done: false, section: section });
        });
      });
      schedulePublish();
    }
  }

  function renderChecklist(team, key) {
    ensureChecklist(team, key);
    var items = team[key];
    var panel = el('div', 'checklist-panel');

    // Progress bar
    var doneCount = items.filter(function(i) { return i.done; }).length;
    var total = items.length;
    var pct = total ? Math.round((doneCount / total) * 100) : 0;
    var prog = el('div', 'checklist-progress');
    var bar = el('div', 'checklist-progress-bar');
    var fill = el('div', 'checklist-progress-fill');
    fill.style.width = pct + '%';
    if (pct === 100) fill.style.background = 'var(--green)';
    bar.appendChild(fill);
    prog.appendChild(bar);
    var progText = el('span', 'checklist-progress-text');
    progText.textContent = doneCount + '/' + total + ' complete';
    prog.appendChild(progText);
    panel.appendChild(prog);

    // Group by section
    var sections = {};
    var sectionOrder = [];
    items.forEach(function(item) {
      var s = item.section || 'General';
      if (!sections[s]) { sections[s] = []; sectionOrder.push(s); }
      sections[s].push(item);
    });

    sectionOrder.forEach(function(sName) {
      var sec = el('div', 'checklist-section');
      var title = el('h4', 'checklist-section-title');
      title.textContent = sName;
      sec.appendChild(title);

      sections[sName].forEach(function(item) {
        var row = el('div', 'checklist-item');

        var cb = el('button', 'checklist-cb' + (item.done ? ' checked' : ''));
        cb.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';
        cb.addEventListener('click', function() {
          item.done = !item.done;
          render(); schedulePublish();
        });
        row.appendChild(cb);

        var label = el('span', 'checklist-label' + (item.done ? ' done' : ''));
        label.textContent = item.text;
        if (canEdit) {
          label.contentEditable = 'plaintext-only'; label.spellcheck = false;
          label.addEventListener('blur', function() {
            var v = label.textContent.trim();
            if (v && v !== item.text) { item.text = v; schedulePublish(); }
            else label.textContent = item.text;
          });
          label.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); label.blur(); } });
        }
        row.appendChild(label);

        if (canEdit) {
          var del = el('button', 'checklist-delete');
          del.innerHTML = IC.x;
          del.addEventListener('click', function() {
            team[key] = team[key].filter(function(i) { return i.id !== item.id; });
            render(); schedulePublish();
          });
          row.appendChild(del);
        }

        sec.appendChild(row);
      });

      panel.appendChild(sec);
    });

    // Add item button
    if (canEdit) {
      var addBtn = el('button', 'checklist-add');
      addBtn.innerHTML = IC.plus + ' Add item';
      addBtn.addEventListener('click', function() {
        addBtn.hidden = true;
        var input = el('input', 'checklist-input');
        input.type = 'text'; input.placeholder = 'New checklist item…';
        panel.appendChild(input); input.focus();
        function commit() {
          var v = input.value.trim();
          if (v) {
            var lastSection = sectionOrder.length ? sectionOrder[sectionOrder.length - 1] : 'General';
            team[key].push({ id: uid(), text: v, done: false, section: lastSection });
            schedulePublish();
          }
          render();
        }
        input.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') { e.preventDefault(); commit(); }
          if (e.key === 'Escape') { input.remove(); addBtn.hidden = false; }
        });
        input.addEventListener('blur', commit);
      });
      panel.appendChild(addBtn);
    }

    return panel;
  }

  // --- Hero ---
  function applyCoverTransform(img, team) {
    var pos = team.coverPos || { x: 50, y: 50 };
    var zoom = team.coverZoom || 1;
    img.style.objectPosition = pos.x + '% ' + pos.y + '%';
    img.style.transform = 'scale(' + zoom + ')';
  }

  function renderHero(team) {
    var hero = el('div', 'hero');
    if (repositioning) hero.classList.add('repositioning');

    var bg = el('div', 'hero-bg');
    bg.style.background = team.gradient || 'linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)';
    var coverImg = null;
    if (team.coverPhoto) {
      coverImg = el('img'); coverImg.src = team.coverPhoto; coverImg.alt = ''; coverImg.draggable = false;
      applyCoverTransform(coverImg, team);
      bg.appendChild(coverImg);
    }
    hero.appendChild(bg);

    var fade = el('div', 'hero-fade');
    hero.appendChild(fade);

    if (canEdit && !team.coverPhoto) {
      var hint = el('div', 'hero-upload-hint');
      hint.innerHTML = IC.image + '<span>Add cover image</span>';
      hero.appendChild(hint);
      hero.style.cursor = 'pointer';
      hero.addEventListener('click', function(e) {
        if (e.target.closest('.cover-btn') || e.target.closest('[contenteditable]')) return;
        pickCoverPhoto(team);
      });
    }

    if (canEdit && !repositioning) {
      var btns = el('div', 'hero-edit-cover');
      var changeBtn = el('button', 'cover-btn'); changeBtn.innerHTML = IC.camera; changeBtn.title = 'Change cover';
      changeBtn.addEventListener('click', function(e) { e.stopPropagation(); pickCoverPhoto(team); });
      btns.appendChild(changeBtn);
      if (team.coverPhoto) {
        var moveBtn = el('button', 'cover-btn'); moveBtn.innerHTML = IC.move; moveBtn.title = 'Reposition';
        moveBtn.addEventListener('click', function(e) { e.stopPropagation(); repositioning = true; render(); });
        btns.appendChild(moveBtn);
        var rmBtn = el('button', 'cover-btn remove'); rmBtn.innerHTML = IC.x; rmBtn.title = 'Remove cover';
        rmBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          team.coverPhoto = null; team.coverPos = null; team.coverZoom = null;
          render(); schedulePublish();
        });
        btns.appendChild(rmBtn);
      }
      hero.appendChild(btns);
    }

    // Reposition mode
    if (repositioning && coverImg) {
      var dragHint = el('div', 'reposition-hint');
      dragHint.textContent = 'Drag to reposition';
      hero.appendChild(dragHint);

      var dragging = false, startX, startY, startPos;
      function onPointerDown(e) {
        if (e.target.closest('.reposition-bar')) return;
        dragging = true;
        startX = e.clientX || e.touches[0].clientX;
        startY = e.clientY || e.touches[0].clientY;
        startPos = { x: (team.coverPos || { x: 50, y: 50 }).x, y: (team.coverPos || { x: 50, y: 50 }).y };
        hero.style.cursor = 'grabbing';
        dragHint.style.opacity = '0';
      }
      function onPointerMove(e) {
        if (!dragging) return;
        e.preventDefault();
        var cx = e.clientX || e.touches[0].clientX;
        var cy = e.clientY || e.touches[0].clientY;
        var rect = hero.getBoundingClientRect();
        var zoom = team.coverZoom || 1;
        var dx = ((cx - startX) / rect.width) * 100 / zoom;
        var dy = ((cy - startY) / rect.height) * 100 / zoom;
        var nx = Math.max(0, Math.min(100, startPos.x - dx));
        var ny = Math.max(0, Math.min(100, startPos.y - dy));
        if (!team.coverPos) team.coverPos = { x: 50, y: 50 };
        team.coverPos.x = Math.round(nx * 10) / 10;
        team.coverPos.y = Math.round(ny * 10) / 10;
        applyCoverTransform(coverImg, team);
      }
      function onPointerUp() { if (!dragging) return; dragging = false; hero.style.cursor = 'grab'; }
      hero.addEventListener('mousedown', onPointerDown);
      hero.addEventListener('touchstart', onPointerDown, { passive: true });
      document.addEventListener('mousemove', onPointerMove);
      document.addEventListener('touchmove', onPointerMove, { passive: false });
      document.addEventListener('mouseup', onPointerUp);
      document.addEventListener('touchend', onPointerUp);

      var bar = el('div', 'reposition-bar');
      var zoomLabel = el('span'); zoomLabel.innerHTML = IC.zoomIn;
      zoomLabel.querySelector('svg').style.cssText = 'width:14px;height:14px;vertical-align:middle;';
      bar.appendChild(zoomLabel);
      var slider = el('input', 'zoom-slider');
      slider.type = 'range'; slider.min = '1'; slider.max = '2.5'; slider.step = '0.05';
      slider.value = String(team.coverZoom || 1);
      slider.addEventListener('input', function() {
        team.coverZoom = parseFloat(slider.value);
        applyCoverTransform(coverImg, team);
        pctLabel.textContent = Math.round(parseFloat(slider.value) * 100) + '%';
      });
      bar.appendChild(slider);
      var pctLabel = el('span');
      pctLabel.style.cssText = 'min-width:36px;text-align:right;';
      pctLabel.textContent = Math.round((team.coverZoom || 1) * 100) + '%';
      bar.appendChild(pctLabel);
      var doneBtn = el('button', 'reposition-done');
      doneBtn.textContent = 'Done';
      doneBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        repositioning = false;
        document.removeEventListener('mousemove', onPointerMove);
        document.removeEventListener('touchmove', onPointerMove);
        document.removeEventListener('mouseup', onPointerUp);
        document.removeEventListener('touchend', onPointerUp);
        render(); schedulePublish();
      });
      bar.appendChild(doneBtn);
      hero.appendChild(bar);
    }

    var content = el('div', 'hero-content');
    var title = el('h1', 'hero-title' + (canEdit ? ' editable' : ''));
    title.textContent = team.name;
    if (canEdit) {
      title.contentEditable = 'plaintext-only'; title.spellcheck = false;
      title.addEventListener('blur', function() {
        var v = title.textContent.trim();
        if (v && v !== team.name) { team.name = v; schedulePublish(); }
        else title.textContent = team.name;
      });
      title.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); title.blur(); } });
    }
    content.appendChild(title);

    var sub = el('p', 'hero-subtitle' + (canEdit ? ' editable' : ''));
    sub.textContent = team.description;
    if (canEdit) {
      sub.contentEditable = 'plaintext-only'; sub.spellcheck = false;
      sub.addEventListener('blur', function() {
        var v = sub.textContent.trim();
        if (v !== team.description) { team.description = v; schedulePublish(); }
      });
      sub.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); sub.blur(); } });
    }
    content.appendChild(sub);

    var meta = el('div', 'hero-meta');
    var count = el('span', 'member-count');
    var n = team.members.length;
    count.textContent = n + ' team member' + (n !== 1 ? 's' : '');
    meta.appendChild(count);
    content.appendChild(meta);

    hero.appendChild(content);
    return hero;
  }

  function pickCoverPhoto(team) {
    var input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
    input.onchange = function(e) {
      var file = e.target.files[0]; if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        var img = new Image();
        img.onload = function() {
          var MAX = 1200, w = img.width, h = img.height;
          if (w > MAX || h > MAX) { var s = MAX / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
          var c = document.createElement('canvas'); c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          team.coverPhoto = c.toDataURL('image/jpeg', 0.82);
          team.coverPos = { x: 50, y: 50 };
          team.coverZoom = 1;
          repositioning = true;
          render(); schedulePublish();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };
    input.click();
  }

  function renderTagBar(team) {

        x.addEventListener('click', function(e) { e.stopPropagation(); team.tags.splice(i, 1); render(); schedulePublish(); });
        tag.appendChild(x);
      }
      bar.appendChild(tag);
    });
    if (canEdit) {
      var addWrap = el('div');
      addWrap.style.cssText = 'position:relative;display:inline-flex;';

        openTagDropdown(addWrap, team);
      });
      addWrap.appendChild(addBtn);
      bar.appendChild(addWrap);
    }
    return bar;
  }

  function openTagDropdown(wrap, team) {
    closeMenus(); tagDropdownOpen = true;
    var dd = el('div', 'tag-dropdown');
    var currentTags = team.tags || [];
    var search = el('input', 'tag-dropdown-search');
    search.type = 'text'; search.placeholder = 'Search or type custom…';
    dd.appendChild(search);
    var listWrap = el('div'); dd.appendChild(listWrap);
    function buildList(query) {
      listWrap.innerHTML = '';
      var q = (query || '').toLowerCase().trim();
      var hasMatch = false;
      Object.keys(TAG_PRESETS).forEach(function(section) {
        var items = TAG_PRESETS[section].filter(function(t) { return !q || t.toLowerCase().indexOf(q) !== -1; });
        if (!items.length) return;
        var label = el('div', 'tag-section-label'); label.textContent = section; listWrap.appendChild(label);
        items.forEach(function(t) {
          hasMatch = true;
          var opt = el('button', 'tag-opt');
          var dot = el('span', 'tag-opt-dot');
          var txt = el('span'); txt.textContent = t;
          opt.append(dot, txt);
          if (currentTags.indexOf(t) !== -1) { opt.classList.add('disabled'); txt.textContent = t + ' ✓'; }
          else { opt.addEventListener('click', function(e) { e.stopPropagation(); addTagToTeam(team, t); closeTagDropdown(); }); }
          listWrap.appendChild(opt);
        });
      });
      if (q && !hasMatch) { var cl = el('div', 'tag-section-label'); cl.textContent = 'Custom'; listWrap.appendChild(cl); }
      if (q) {
        var exactExists = false;
        Object.keys(TAG_PRESETS).forEach(function(s) { TAG_PRESETS[s].forEach(function(t) { if (t.toLowerCase() === q) exactExists = true; }); });
        if (!exactExists && currentTags.map(function(t) { return t.toLowerCase(); }).indexOf(q) === -1) {
          var co = el('button', 'tag-opt');
          var cd = el('span', 'tag-opt-dot'); cd.style.background = 'var(--green)';
          var ct = el('span'); ct.textContent = 'Add "' + query.trim() + '"';
          co.append(cd, ct);
          co.addEventListener('click', function(e) { e.stopPropagation(); addTagToTeam(team, query.trim()); closeTagDropdown(); });
          listWrap.appendChild(co);
        }
      }
    }
    buildList('');
    search.addEventListener('input', function() { buildList(search.value); });
    search.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); var v = search.value.trim(); if (v && (team.tags || []).indexOf(v) === -1) { addTagToTeam(team, v); closeTagDropdown(); } }
      if (e.key === 'Escape') closeTagDropdown();
    });
    document.body.appendChild(dd);
    var r = wrap.getBoundingClientRect();
    dd.style.top = (r.bottom + 6) + 'px';
    dd.style.left = Math.min(r.left, window.innerWidth - 230) + 'px';
    setTimeout(function() { search.focus(); }, 10);
    function outside(e) { if (dd.contains(e.target) || wrap.contains(e.target)) return; closeTagDropdown(); document.removeEventListener('mousedown', outside); }
    setTimeout(function() { document.addEventListener('mousedown', outside); }, 50);
  }

  function closeTagDropdown() { tagDropdownOpen = false; document.querySelectorAll('.tag-dropdown').forEach(function(d) { d.remove(); }); }
  function addTagToTeam(team, name) { if (!team.tags) team.tags = []; if (team.tags.indexOf(name) === -1) { team.tags.push(name); render(); schedulePublish(); } }

  // --- Toolbar ---
  function renderToolbar(team) {
    var bar = el('div', 'toolbar');
    var contactBtn = el('button', 'toolbar-btn' + (showContacts ? ' active' : ''));
    contactBtn.innerHTML = IC.contact + (showContacts ? ' Hide contacts' : ' Show contacts');
    contactBtn.addEventListener('click', function() {
      showContacts = !showContacts;
      document.querySelectorAll('.member-contact').forEach(function(c) { c.classList.toggle('show', showContacts); });
      contactBtn.className = 'toolbar-btn' + (showContacts ? ' active' : '');
      contactBtn.innerHTML = IC.contact + (showContacts ? ' Hide contacts' : ' Show contacts');
    });
    bar.appendChild(contactBtn);
    return bar;
  }

  // --- Members ---
  function renderMembers(team) {
    var list = el('div', 'members-list');
    if (!team.members.length) {
      var empty = el('div');
      empty.style.cssText = 'padding:40px 28px;text-align:center;color:var(--text-2);font-size:14px;';
      empty.textContent = canEdit ? 'Add your first team member below' : 'No team members added yet';
      list.appendChild(empty);
      return list;
    }
    team.members.forEach(function(m, i) { list.appendChild(renderRow(team, m, i)); });
    return list;
  }

  function renderRow(team, m, idx) {
    var row = el('div', 'member-row');
    row.dataset.idx = idx;

    var accent = el('div', 'member-row-accent');
    accent.style.background = team.color || 'var(--accent)';
    row.appendChild(accent);

    if (canEdit) {
      var handle = el('div', 'drag-handle');
      handle.innerHTML = IC.grip;
      handle.draggable = true;
      handle.addEventListener('dragstart', function(e) { dragSrcIndex = idx; row.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', idx); });
      handle.addEventListener('dragend', function() { row.classList.remove('dragging'); dragSrcIndex = null; document.querySelectorAll('.drag-over-top,.drag-over-bottom').forEach(function(r) { r.classList.remove('drag-over-top', 'drag-over-bottom'); }); });
      row.addEventListener('dragover', function(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; var rect = row.getBoundingClientRect(); var mid = rect.top + rect.height / 2; row.classList.toggle('drag-over-top', e.clientY < mid); row.classList.toggle('drag-over-bottom', e.clientY >= mid); });
      row.addEventListener('dragleave', function() { row.classList.remove('drag-over-top', 'drag-over-bottom'); });
      row.addEventListener('drop', function(e) {
        e.preventDefault(); row.classList.remove('drag-over-top', 'drag-over-bottom');
        var from = dragSrcIndex, to = idx;
        if (from === null || from === to) return;
        var rect = row.getBoundingClientRect();
        if (e.clientY >= rect.top + rect.height / 2 && to < team.members.length - 1) to++;
        var item = team.members.splice(from, 1)[0];
        if (to > from) to--;
        team.members.splice(to, 0, item);
        render(); schedulePublish();
      });
      // Touch drag
      var touchStartIdx = idx;
      handle.addEventListener('touchstart', function(e) { touchStartIdx = idx; }, { passive: true });
      handle.addEventListener('touchmove', function(e) {
        e.preventDefault(); var cy = e.touches[0].clientY;
        document.querySelectorAll('.member-row').forEach(function(r, ri) {
          var rect = r.getBoundingClientRect();
          if (cy > rect.top && cy < rect.bottom && ri !== touchStartIdx) r.classList.add(cy < rect.top + rect.height / 2 ? 'drag-over-top' : 'drag-over-bottom');
          else r.classList.remove('drag-over-top', 'drag-over-bottom');
        });
      }, { passive: false });
      handle.addEventListener('touchend', function(e) {
        var cy = e.changedTouches[0].clientY; var targetIdx = -1;
        document.querySelectorAll('.member-row').forEach(function(r, ri) { r.classList.remove('drag-over-top', 'drag-over-bottom'); var rect = r.getBoundingClientRect(); if (cy > rect.top && cy < rect.bottom) targetIdx = ri; });
        if (targetIdx >= 0 && targetIdx !== touchStartIdx) { var item = team.members.splice(touchStartIdx, 1)[0]; team.members.splice(targetIdx, 0, item); render(); schedulePublish(); }
      });
      row.appendChild(handle);
    }

    // Avatar
    var av = el('div', 'avatar');
    av.style.background = getAvatarColor(idx);
    var initDiv = el('div', 'avatar-initials');
    initDiv.textContent = getInitials(m.name);
    av.appendChild(initDiv);
    row.appendChild(av);

    var body = el('div', 'member-body');
    var top = el('div', 'member-top');

    var name = el('span', 'member-name' + (canEdit ? ' editable-dark' : ''));
    name.textContent = m.name;
    if (canEdit) {
      name.contentEditable = 'plaintext-only'; name.spellcheck = false;
      name.addEventListener('blur', function() { var v = name.textContent.trim(); if (v && v !== m.name) { m.name = v; schedulePublish(); } else name.textContent = m.name; });
      name.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); name.blur(); } });
    }
    top.appendChild(name);

    var role = el('span', 'role-tag' + (canEdit ? ' editable-dark' : ''));
    role.textContent = m.role;
    if (canEdit) {
      role.contentEditable = 'plaintext-only'; role.spellcheck = false;
      role.addEventListener('blur', function() { var v = role.textContent.trim(); if (v && v !== m.role) { m.role = v; schedulePublish(); } else role.textContent = m.role; });
      role.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); role.blur(); } });
    }
    top.appendChild(role);

    var sw = el('div', 'status-pill status-pill-' + m.status);
    var dot = el('span', 'status-pill-dot');
    var sl = el('span');
    sl.textContent = m.status.charAt(0).toUpperCase() + m.status.slice(1);
    sw.append(dot, sl);
    if (canEdit) { sw.style.cursor = 'pointer'; sw.addEventListener('click', function(e) { e.stopPropagation(); toggleStatus(sw, m); }); }
    top.appendChild(sw);
    body.appendChild(top);

    // Tasks
    if ((m.tasks && m.tasks.length) || canEdit) {
      var chips = el('div', 'member-tasks');
      (m.tasks || []).forEach(function(t, i) {
        var chip = el('span', 'task-chip'); chip.textContent = t;
        if (canEdit) { var x = el('button', 'chip-x'); x.innerHTML = '&times;'; x.addEventListener('click', function() { m.tasks.splice(i, 1); render(); schedulePublish(); }); chip.appendChild(x); }
        chips.appendChild(chip);
      });
      if (canEdit) { var addC = el('button', 'task-add'); addC.textContent = '+'; addC.addEventListener('click', function() { showTaskInput(chips, addC, m); }); chips.appendChild(addC); }
      body.appendChild(chips);
    }

    // Contact
    if (m.email || m.phone || canEdit) {
      var contact = el('div', 'member-contact' + (showContacts ? ' show' : ''));
      var emailItem = el('span', 'contact-item'); emailItem.innerHTML = IC.mail;
      var emailVal = el('span', 'contact-val' + (canEdit ? ' editable-dark' : ''));
      emailVal.textContent = m.email || (canEdit ? 'email' : '');
      if (!m.email) emailVal.style.opacity = '0.4';
      if (canEdit) {
        emailVal.contentEditable = 'plaintext-only'; emailVal.spellcheck = false;
        emailVal.addEventListener('focus', function() { emailVal.style.opacity = '1'; if (!m.email) emailVal.textContent = ''; });
        emailVal.addEventListener('blur', function() { var v = emailVal.textContent.trim(); if (v !== (m.email || '')) { m.email = v; schedulePublish(); } if (!v) { emailVal.textContent = 'email'; emailVal.style.opacity = '0.4'; } });
        emailVal.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); emailVal.blur(); } });
      }
      emailItem.appendChild(emailVal);
      if (m.email || canEdit) contact.appendChild(emailItem);

      var phoneItem = el('span', 'contact-item'); phoneItem.innerHTML = IC.phone;
      var phoneVal = el('span', 'contact-val' + (canEdit ? ' editable-dark' : ''));
      phoneVal.textContent = m.phone || (canEdit ? 'phone' : '');
      if (!m.phone) phoneVal.style.opacity = '0.4';
      if (canEdit) {
        phoneVal.contentEditable = 'plaintext-only'; phoneVal.spellcheck = false;
        phoneVal.addEventListener('focus', function() { phoneVal.style.opacity = '1'; if (!m.phone) phoneVal.textContent = ''; });
        phoneVal.addEventListener('blur', function() { var v = phoneVal.textContent.trim(); if (v !== (m.phone || '')) { m.phone = v; schedulePublish(); } if (!v) { phoneVal.textContent = 'phone'; phoneVal.style.opacity = '0.4'; } });
        phoneVal.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); phoneVal.blur(); } });
      }
      phoneItem.appendChild(phoneVal);
      if (m.phone || canEdit) contact.appendChild(phoneItem);
      body.appendChild(contact);
    }

    row.appendChild(body);
    if (canEdit) {
      var del = el('button', 'row-delete'); del.innerHTML = IC.x; del.title = 'Remove';
      del.addEventListener('click', function() { deleteMember(team, m.id); });
      row.appendChild(del);
    }
    return row;
  }

  function renderFooter(team) {
    var wrap = document.createDocumentFragment();

    // Branded footer strip
    var brand = el('div', 'card-brand');
    brand.style.background = team.gradient || team.color || 'var(--accent)';
    var left = el('div', 'card-brand-left');
    var icon = el('div', 'card-brand-icon');
    icon.textContent = 'T';
    left.appendChild(icon);
    var bname = el('span');
    bname.textContent = team.name;
    left.appendChild(bname);
    brand.appendChild(left);
    var right = el('div', 'card-brand-right');
    var n = team.members.length;
    right.textContent = n + ' member' + (n !== 1 ? 's' : '') + (team.tags && team.tags.length ? ' · ' + team.tags.length + ' tag' + (team.tags.length !== 1 ? 's' : '') : '');
    brand.appendChild(right);
    wrap.appendChild(brand);

    var footer = el('div', 'card-footer');
    var shareBtn = el('button', 'btn btn-secondary');
    shareBtn.innerHTML = IC.share + ' Copy Link';
    shareBtn.addEventListener('click', copyLink);
    footer.appendChild(shareBtn);
    var expBtn = el('button', 'btn btn-primary');
    expBtn.innerHTML = IC.download + ' Export Image';
    expBtn.addEventListener('click', function() { exportRoster(team); });
    footer.appendChild(expBtn);
    wrap.appendChild(footer);
    return wrap;
  }

  // --- Task input ---
  function showTaskInput(container, addBtn, member) {
    addBtn.hidden = true;
    var input = el('input', 'task-input');
    input.type = 'text'; input.placeholder = 'Task name…';
    container.appendChild(input); input.focus();
    function commit() { var v = input.value.trim(); if (v) { if (!member.tasks) member.tasks = []; member.tasks.push(v); schedulePublish(); } render(); }
    input.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); commit(); } if (e.key === 'Escape') { input.remove(); addBtn.hidden = false; } });
    input.addEventListener('blur', commit);
  }

  // --- Status ---
  function toggleStatus(wrap, member) {
    closeMenus();
    var menu = el('div', 'status-menu');
    ['active', 'away', 'busy'].forEach(function(s) {
      var opt = el('button', 'status-opt');
      var d = el('span', 'status-dot status-' + s); d.style.animation = 'none';
      var l = el('span'); l.textContent = s.charAt(0).toUpperCase() + s.slice(1);
      opt.append(d, l);
      opt.addEventListener('click', function(e) { e.stopPropagation(); member.status = s; render(); schedulePublish(); });
      menu.appendChild(opt);
    });
    wrap.appendChild(menu);
    openMenu = menu;
    setTimeout(function() { document.addEventListener('click', closeMenus, { once: true }); }, 0);
  }
  function closeMenus() { if (openMenu) { openMenu.remove(); openMenu = null; } }

  // --- Add / Delete ---
  function addMember(team) {
    team.members.push({ id: uid(), name: 'New Member', role: 'Role', tasks: [], email: '', phone: '', status: 'active' });
    render(); schedulePublish();
  }
  function deleteMember(team, id) {
    var m = team.members.find(function(x) { return x.id === id; });
    if (!m || !confirm('Remove ' + m.name + '?')) return;
    team.members = team.members.filter(function(x) { return x.id !== id; });
    render(); schedulePublish();
  }

  // --- Export ---
  function exportRoster(team) {
    if (typeof html2canvas === 'undefined') { showToast('Export not available'); return; }
    var roster = document.getElementById('roster');
    if (!roster) return;
    var bg = getComputedStyle(document.documentElement).getPropertyValue('--card').trim();
    html2canvas(roster, { backgroundColor: bg, scale: 2, logging: false, useCORS: true }).then(function(canvas) {
      canvas.toBlob(function(blob) { saveBlob(blob, (team.name || 'team').replace(/[^a-zA-Z0-9]+/g, '-').toLowerCase() + '-roles.png'); }, 'image/png');
    }).catch(function() { showToast('Export failed'); });
  }

  function saveBlob(blob, filename) {
    if (downloads) { downloads.save({ filename: filename, data: blob }).then(function() { showToast('Image exported!'); }).catch(function(e) { if (e && e.code === 'declined') return; nativeDownload(blob, filename); }); }
    else { nativeDownload(blob, filename); }
  }

  function nativeDownload(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function() { a.remove(); URL.revokeObjectURL(url); }, 100);
    showToast('Image exported!');
  }

  // --- Share ---
  function copyLink() {
    var url = window.location.href;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function() { showToast('Link copied'); }).catch(fallback);
    } else { fallback(); }
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = url;
      ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); showToast('Link copied!'); } catch(e) { showToast('Copy the URL from the address bar'); }
      ta.remove();
    }
  }

  // --- Save ---
  function schedulePublish() { clearTimeout(saveTimer); saveTimer = setTimeout(saveState, DEBOUNCE); }

  function saveState() {
    if (saving) return;
    saving = true; showSaving(true);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
    if (artifact) {
      try {
        var clone = document.documentElement.cloneNode(true);
        var a = clone.querySelector('#app'); if (a) a.innerHTML = '';
        var d = clone.querySelector('#app-data'); if (d) d.textContent = JSON.stringify(state);
        var t = clone.querySelector('#toast'); if (t) t.classList.remove('visible');
        var p = clone.querySelector('#save-pill'); if (p) p.classList.remove('active');
        var html = '<!doctype html>\n' + clone.outerHTML;
        artifact.publish(html).then(done).catch(done);
      } catch(e) { done(); }
    } else { done(); }
    function done() { saving = false; showSaving(false); showToast('Saved'); }
  }

  // --- Init ---
  function loadState() {
    var defaults = JSON.parse(document.getElementById('app-data').textContent);
    try {
      var stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        var parsed = JSON.parse(stored);
        if (parsed.teams) return parsed;
        // Migrate old single-team format
        if (parsed.project || parsed.members) {
          return { teams: [{ id: uid(), name: parsed.project ? parsed.project.name : 'My Team', description: parsed.project ? parsed.project.description : '', color: '#2d7a3a', gradient: 'linear-gradient(135deg, #1a3a2a 0%, #2d7a3a 100%)', tags: parsed.project ? (parsed.project.tags || []) : [], coverPhoto: parsed.project ? parsed.project.coverPhoto || null : null, coverPos: parsed.project ? parsed.project.coverPos || null : null, coverZoom: parsed.project ? parsed.project.coverZoom || null : null, members: parsed.members || [] }] };
        }
      }
    } catch(e) {}
    return defaults;
  }

  function start(hotData) {
    state = (hotData && hotData.state) || loadState();
    render();
    initCaps();
  }

  function initCaps() {
    if (!window.claude) return;
    claude.use('artifact').then(function(a) { artifact = a; }).catch(function() {});
    claude.use('downloads').then(function(d) { downloads = d; }).catch(function() {});
  }

  if (window.claude && window.claude.hot) {
    window.claude.hot.snapshot(function() { return { state: state }; });
    if (window.claude.hot.ready) window.claude.hot.ready(start);
    else start(window.claude.hot.data || {});
  } else {
    start({});
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(function() {});
  }
})();
</script>
